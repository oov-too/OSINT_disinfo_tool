# packs/pilot/pack.toml: the phase 6b pilot pack of the ledger (tools/platform-plan.md phase 6b, prepared 2026-10-22).
# A second domain that shares nothing with the project's first pack: the UK Post Office Horizon IT Inquiry. Written without touching core.
# Every value is drawn from the held sources under sources/pilot/ (each named below) or the public record cited; the corpus case
# is wip/platform-phase6b/corpus.md. Paths are relative to the project root. Every value confirmed by the owner on 2026-10-22, with one addition (Alan Bates as the third ledgered speaker).

[pack]
name = "pilot"
title = "The Post Office Horizon IT Inquiry (phase 6b second-domain pilot)"
version = "0.1.0"
created = "2026-10-22"
status = "pilot pack, confirmed by the owner 2026-10-22"
confirmed = "2026-10-22"
confirmed_by = "the owner"
root = "packs/pilot"
schema_extensions = "packs/pilot/schema-extensions.md"
description = "The domain data for a pilot on a public inquiry with hearings and exhibits: the question, the referent object and three PIRs, five subjects and the two audited, the topic codes, the actor and polity vocabulary with a cited seed order of battle, a lens instance from a text (the SFO's corporate guidance), the canon (three judgments in numbered paragraphs), a near-empty codebook of the corpus's argot, the circles and adverse sources, the catalysts, the brief slots and one narrative seed."
sources = "sources/pilot"
corpus = "wip/platform-phase6b/corpus.md"
licence_note = "Inquiry material: Crown copyright, Open Government Licence (the inquiry's terms, read 2026-10-22). Judgments: Crown copyright, held from the inquiry's exhibits; the judgment text does not ship: the pack carries the fetch manifest (packs/pilot/canon/fetch-manifest.toml) and the recipient re-holds from the inquiry's site under its terms; example notes quote in short passages with attribution (owner, 2026-10-22). Press and forum texts: held locally, linked out, never reproduced."

[question]
# setup stage 1: the question the pilot narrative will test (drawn from the terms of reference, paragraph B, and the held sources; confirmed by the owner 2026-10-22)
text = "Did Post Office Ltd know, while it prosecuted subpostmasters and defended Horizon in public and in court, that branch accounts could be affected by bugs and altered remotely by Fujitsu without the subpostmaster's knowledge; and when did each actor first say so in writing?"
source = "sources/pilot/web/2021-06-01-terms-of-reference-post-office-horizon-it-inquiry/text.md (paragraph B: 'a clear account of 1) the implementation and failings of Horizon over its lifecycle and 2) Post Office Ltd's use of information from Horizon when taking action against persons alleged to be responsible for shortfalls')"
drafted_by = "phase 6b prep session, 2026-10-22"
confirmed_by = "the owner, 2026-10-22"

[pirs]
# the recipient's declared priority intelligence requirements: a dated, attributed overlay that seeds keywords and surfaces entries
# but never places anything the sources do not support (tools/platform-plan.md; read by tools/packload.py pirs())
[[pirs.pir]]
id = "PIR-1"
question = "When did each actor first record, in writing, (a) bugs affecting branch accounts and (b) the ability to alter branch data without the subpostmaster's knowledge?"
eeis = ["per actor (POL executives and board, POL's lawyers, Fujitsu's SSC and management, the shareholder): the earliest dated document", "its author and recipients", "whether it reached a defendant or a court, and when"]
terms = ["remote access", "Balancing Transaction", "APPSUP", "SSC", "Receipts and Payments Mismatch", "Callendar Square", "Dalmellington", "bugs, errors and defects", "PEAK", "KEL", "ARQ"]
declared = "2026-10-22"
by = "phase 6b prep session; confirmed by the owner, 2026-10-22"
[[pirs.pir]]
id = "PIR-2"
question = "How did POL's public, parliamentary and court statements on Horizon's reliability and on remote access change, and when?"
eeis = ["each dated statement with its speaker and audience (2009, 2015, 2019, 2024)", "the documents the speaker held at that date"]
terms = ["robust", "remote access", "no evidence", "integrity", "Parliamentary committee", "BBC", "admitted"]
declared = "2026-10-22"
by = "phase 6b prep session; confirmed by the owner, 2026-10-22"
[[pirs.pir]]
id = "PIR-3"
question = "Who directed POL's response to its critics (Second Sight, the JFSA, the mediation scheme, the group litigation), through which bodies, and with what stated aims?"
eeis = ["membership and dates of Project Sparrow and the X Working Group", "decisions on the mediation scheme and its Working Group", "instructions to lawyers", "what each member says now"]
terms = ["Sparrow", "X Working Group", "Working Group", "Mediation Scheme", "Second Sight", "General Counsel", "Group Litigation"]
declared = "2026-10-22"
by = "phase 6b prep session; confirmed by the owner, 2026-10-22"

[subjects]
all = ["horizon-integrity-and-remote-access", "prosecutions-and-disclosure", "critics-redress-and-litigation", "governance-and-government", "human-impact"]
pages_dir = "subjects"
# the forthrightness audit is mandatory for notes under these (hearing days and exhibits that bear on PIR-1 and PIR-2)
audited = ["horizon-integrity-and-remote-access", "prosecutions-and-disclosure"]
graph_order = ["horizon-integrity-and-remote-access", "prosecutions-and-disclosure", "critics-redress-and-litigation", "governance-and-government", "human-impact"]

[audit]
heading = "## Forthrightness audit"
legacy_heading = "## Forthrightness audit"
mandatory_subjects = ["horizon-integrity-and-remote-access", "prosecutions-and-disclosure"]
# grounds of a stated decline shown in the held transcripts (packs/pilot/schema-extensions.md section 3, with lines)
basis_vocabulary = ["legal professional privilege", "privilege against self-incrimination", "deferral to another witness or body"]
channelled_kind = "none"
channelled_caption = "no channelled class in this pack"
human_caption = "witnesses at the inquiry"
