# packs/pilot/canon/fetch-manifest.toml: how a recipient re-holds the pilot's canon (owner's licence route, 2026-10-22).
# The judgment text does not ship with the pack. Each recipient fetches every judgment from the Post Office Horizon IT Inquiry's site under
# its terms (Crown copyright; the site's Open Government Licence notice), holds it through tools/ledger/acquire/, and checks the bytes
# against the SHA-256 below (the copy held on 2026-10-22). The attachment's download link carries a token: resolve it from the evidence page
# at fetch time, never from this file. Example notes quote the judgments only in short passages, each with the neutral citation and paragraph.

[manifest]
version = "1"
held = "2026-10-22"
site_terms = "https://www.postofficehorizoninquiry.org.uk/terms-and-conditions"
gap_seconds = 10
steps = ["fetch the evidence page", "read the PDF attachment link from it (/file/N/download?token=...)", "fetch the PDF through the web adapter's gate", "check bytes and sha256", "derive the text layer (document.text_layer, per_page_form)", "mark paragraphs with packs/pilot/canon/paragraphs.py and hold with tools/ledger/acquire/canon.py under the scheme file"]
driver = "`ledger acquire batch <list.toml> fetch` (tools/ledger/batch.py): one document item per text below, its url read from the evidence_page at fetch time; then, per text, the text layer, `python3 -I packs/pilot/canon/paragraphs.py <text layer> <marked> <report.json>` and `python3 tools/ledger/acquire/canon.py hold <marked> --id <id> --scheme <scheme>`, the bytes checked against sha256"

