# packs/pilot/briefs/slots.toml: the pilot pack's values for the brief templates' pack slots (phase 6b prep, 2026-10-22).
# The templates are plugin/templates/briefs/ (core); a slot left out falls back on plugin/templates/briefs/slots-default.toml.
# Every value is drawn from the held sources (sources/pilot/) or the pack's own files; nothing from any other pack.

[slots]
"name" = "pilot"
"schema_extensions" = "packs/pilot/schema-extensions.md"
"model_policy" = "Every delegated agent runs on Opus at high effort (a small model only for pass-through probes that run a script and relay its line; the owner's standing rule of 2026-10-16)."
"audited_subjects" = "the Horizon and prosecution subjects: horizon-integrity-and-remote-access and prosecutions-and-disclosure (every hearing note under either carries the forthrightness audit)"
"channelled_clause" = "the pack declares no channelled class"
"reference_objects" = "the object register's form (schema section 6); the pack names no reference object, so the criteria column takes `none` (a candidate, not adopted: ARQ data, Hamilton at [15] to [18])"
"reference_objects.watch_name" = "object watch"
"reference_objects.features" = "what it is, who holds it, whether it was requested, whether it was disclosed, its date"
"actor_register" = "the actor and polity register (packs/pilot/registers/actor-polity-vocabulary.md): return `actor_rows` in the row shape `| # | Actor as named (teller's spelling) | Kind | Polity | Order of battle (part of, run by, funded by, contracted by, instructed by, a front for) with date | Teller and note row | Firsthand / relayed (chain) | Goals or role as told | Posture toward the referent (intent, capability) as told | Confidence |` for every actor and polity the source describes, and `polity_statements` (posture toward the referent object, the subpostmasters and the integrity of the accounts and prosecutions built on Horizon data, by whose telling) as table rows in the register's statement shape `| # | Teller (note, row, time) | Body (alliance, bloc, coalition, network, faction) | Inside / members | Outside | Opposed | The referent's standing | Time (when said; period it refers to) | Quote (short) | Chain |` (the `#` cell is numbered by `ledger integrate`), or `none`; seed rows and the polity ids P1 to P7 are in packs/pilot/registers/order-of-battle-seed.md"
"actor_register.findings_heading" = "Actors and polities"
"actor_register.findings_line" = "- [u NNN:L] actor as named: <...> | kind: <state actor | non-state actor | proxy | front | individual> | teller: <...> | firsthand or relayed: <chain> | goals or role: <...> | polity: <P1 to P7 of the seed, or a new one, or none stated> | order of battle: <part of, run by, contracted by, instructed by, employed by, appointed by, or none> with date | posture toward the referent: <...>"
"actor_register.findings_what" = "every actor and polity the source describes, with its place in the order of battle and its date"
"speaker_ledgers" = "the Bates, Vennells and Jenkins ledgers (packs/pilot/registers/ledgered-speakers.md): return `bates_ledger_section`, `vennells_ledger_section` and `jenkins_ledger_section` (an entry for each appearance of the speaker in the source, firsthand or relayed with its chain), or `does not speak` for each"
"forthrightness_charts" = "the audit counts line is all the charts need; return nothing more."
"eras" = "the era pages research/timeline-consolidated-<id>.md for pre-2000, 2000-2009, 2010-2014, 2015-2019, 2020-2023, 2024-onward (packs/pilot/pack.toml [eras])"
"catalysts" = "packs/pilot/seeds/catalysts.md; the threshold catalyst is the Computer Weekly story of 2009-05-11, before which a telling is \"pre-2009 held\""
"stock_phrases" = "packs/pilot/keywords/stock-phrases-domain.txt beside tools/stock_phrases.txt"
"canon" = "packs/pilot/canon/texts.md: the three judgments (Horizon Issues [2019] EWHC 3408 (QB), Common Issues [2019] EWHC 606 (QB), Hamilton [2021] EWCA Crim 577) held in sources/pilot/canon/, the unit the numbered paragraph; cite `<citation> at [n]` with the hold line; `python3 tools/ledger/acquire/canon.py cite sources/pilot/canon/<id> \"<n>\"` resolves one"
"codebook" = "packs/pilot/codebook/argot.md (argot, code names and acronyms keyed by the sources; decode L1, X = Sparrow, held as a lead)"
"blocked_precedent" = "the pointer-row form of tools/filter-blocks.md section 5"
"report_keys.document" = "`actor_rows`, `polity_statements`, `bates_ledger_section`, `vennells_ledger_section`, `jenkins_ledger_section`"
"report_keys.video" = "`actor_rows`, `polity_statements`, `bates_ledger_section`, `vennells_ledger_section`, `jenkins_ledger_section`, `hearing_day` ({day, phase, date, transcript_urn, recordings})"
"topics" = "the 15 codes of packs/pilot/schema-extensions.md section 2 (horizon-bugs, remote-access, knowledge-and-timing, prosecutions, disclosure, contract-and-liability, investigation-and-audit, mediation-and-redress, governance-and-government, legal-strategy, communications-and-press, own-role, how-they-know, human-impact, other)"
"basis_vocabulary" = "legal professional privilege, privilege against self-incrimination, deferral to another witness or body"
"circles" = "packs/pilot/seeds/circles.md (confirmed by the owner, 2026-10-22); the adverse sources named in advance there per circle, among them POL's Reply to Second Sight Part Two (POL00004432, held) and POL's 2009 statement to Computer Weekly (held)"
"exemplars.document" = "no exemplar yet in this pack: the skeleton's form alone (the first exhibit note of the pilot becomes the exemplar)"
"exemplars.text" = "no exemplar yet in this pack: the skeleton's form alone"
"exemplars.hearing" = "no exemplar yet in this pack: the skeleton's video form and intake-hearing.md (the first hearing-day note of the pilot, Day 117, becomes the exemplar)"
"exemplars.video" = "no exemplar yet in this pack: the skeleton's form alone, with the hearing-day metadata of packs/pilot/schema-extensions.md section 1"
"exemplars.adverse_web" = "no exemplar yet in this pack: the skeleton's form alone (`--form adverse-web`)"
"exemplars.adverse_scan" = "no exemplar yet in this pack: the document form's skeleton"
"free_sections.document" = "`## What the document says about who knew what, when` (PIR-1: each dated statement of knowledge, its author and recipients, row-cited)"
"free_sections.video" = "`## What the witness says about who knew what, when` (PIR-1 and PIR-2: each dated statement of knowledge, row-cited, with the documents put to the witness by URN)"
"free_sections.teller" = "`## New in this hearing day`, `## Forthrightness and the four classes, against the held tellings`, `## Corroboration inside the database`"
"subjects" = "subjects/<slug>.md for the five slugs of packs/pilot/pack.toml [subjects] all"
"narratives" = "research/narrative-register.md and the pilot's one narrative page (seed packs/pilot/seeds/narratives.md), its rival sheet and history page, and the run's digests"
"lenses" = "the core technique catalogue (tools/technique-catalogue.json) with the pilot's instance packs/pilot/lenses/sfo-cooperation.json (a lens from a text: the SFO corporate guidance; techniques S1 to S15 mapped onto the catalogue; no placements)"
"compilers" = "the pack names no compiler among its ten sources; the campaigning press (Computer Weekly's later coverage) would be the corpus's compilers"
"archives" = "the inquiry's evidence database (postofficehorizoninquiry.org.uk/evidence), read item by item through the web and document adapters at a 10-second gap; no bulk mirror"
"base_reading" = "The base reading is the owner's to give at setup stage 1; until then, the held record is read as contested tellings by parties with interests (the Post Office, Fujitsu, the subpostmasters, the government), with the judgments as the canon of record, cited as the courts' tellings."
"narrative_seeds" = "managed-knowledge (bugs and remote access known in writing and kept out of disclosure and the public record) and its rival good-faith-reliance (executives misinformed by their supplier and their own structures); packs/pilot/seeds/theses.json"
"rivals" = "the rival sheet research/narrative-rival-good-faith-reliance.md, which the managed-knowledge page faces"
"lanes" = "A the Horizon system (bugs, remote access, audit data), B prosecutions and civil recovery, C disclosure and expert evidence, D the critics and the scheme (Second Sight, the JFSA, Sparrow, the Working Group), E money and contracts (contract terms, shortfalls, settlement, compensation), F government and Parliament, G the courts and the inquiry, H organisations (POL, Fujitsu, the law firms)"
"synchrony_eras" = "one window per era page of the pack (pre-2000, 2000-2009, 2010-2014, 2015-2019, 2020-2023, 2024-onward); scope start 1999 (the pilot of Horizon), quarter start 2019"
"ordinary_grounds" = "legal professional privilege, privilege against self-incrimination, the inquiry's own procedure (a witness deferring to a later phase or another witness), commercial confidentiality"
"narrative_reading_list" = "packs/pilot/registers/order-of-battle-seed.md, packs/pilot/codebook/argot.md, packs/pilot/seeds/catalysts.md, packs/pilot/canon/texts.md"
