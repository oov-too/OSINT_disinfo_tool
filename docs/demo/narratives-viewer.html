 "appointed after the June and July 2012 discussions (18 June 2012 meeting); the Agreement of December 2012; the Interim Report of 8 July 2013; Part Two of 21 August 2014", "window": "2012 to 2014", "rows": "[doc-pol00004406-2013-07-08-second-sight-interim-report tl 23, 28, 33]; [hearing-2024-04-09-alan-bates-day-117 tl 66]; [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two tl 29]", "roots": "Second Sight (one); Bates (one); Post Office's Reply (one)"}, {"body": "Initial Complaint Review and Mediation Scheme", "event": "set up after the Interim Report; complaints logged with the hub from July 2013; a year in by December 2014", "window": "2013 to 2014", "rows": "[hearing-2024-04-09-alan-bates-day-117 tl 82, 83]; [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two tl 24]; [hearing-2024-05-22-paula-vennells-day-142 tl 73, 112]", "roots": "Bates (one); Post Office (one); Vennells (one)"}, {"body": "the hub (Horizon defects)", "event": "set up in 2013 as a result of the Clarke advice", "window": "2013", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 68]", "roots": "Vennells (one)"}, {"body": "the Working Group (Sir Anthony Hooper)", "event": "the scheme's aims discussed with Aujard, copying Hooper (2014); Vennells accuses Bates of breaching its confidentiality (April 2014)", "window": "2014", "rows": "[hearing-2024-04-09-alan-bates-day-117 tl 92, 93, 98]", "roots": "Bates (one); Vennells's reply POL00116501 (one)"}, {"body": "Project Sparrow", "event": "Aujard a member, \"as we later to find\" (from September 2013 by rel 160); named by Vennells as the scheme's project name", "window": "2013 to 2014", "rows": "[hearing-2024-04-09-alan-bates-day-117 claims 486, 528]; [hearing-2024-05-22-paula-vennells-day-142 claims 467]", "roots": "Bates (one, from unnamed minutes); Vennells (one)"}, {"body": "Post Office Ltd (legal)", "event": "Chris Aujard becomes General Counsel (September 2013)", "window": "2013", "rows": "[hearing-2024-04-09-alan-bates-day-117 tl 91]", "roots": "Beer from memory, Bates agreeing (one)"}, {"body": "Post Office Ltd (IT)", "event": "begins to restructure its IT provision (1 October 2013)", "window": "2013", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 66]", "roots": "Vennells (one)"}, {"body": "Project Zebra", "event": "the Deloitte work progressed into the Project Zebra Action Report (2014)", "window": "2014", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 102; claims 566]", "roots": "Vennells (one)"}, {"body": "Post Office Investigation Team", "event": "prosecutions stopped and the team substantially reduced (by the time of her 2014 conversation with John Scott)", "window": "2014", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 97, 98]", "roots": "Vennells (one)"}, {"body": "Royal Mail separation projects", "event": "continue into 2014", "window": "2014", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 96]", "roots": "Vennells (one)"}], "builders": "\nThe era is the hinge of both seeds: the first written records of a bug affecting branch accounts and of central alteration (2010, 2011), the first public and ministerial denials that follow them (2010), the first written statement by Post Office's own counsel that its expert failed to disclose bugs (2013), and the first board-level technical assurances (2014). Both theses need the same nodes; they differ on who held what and when. Cite this page's tables as `[synchrony 2010-2014 <table> <row>]` (tables: windows, co-movements, contradictions, signals, organisations).\n\n### managed-knowledge\n\nWhat the era offers for it:\n- The founding pair: Post Office and Fujitsu staff record a central-write correction and its \"tampering\" and \"moral implications\" risks in September 2010 [doc-pol00028838-2010-09-29-receipts-payments-mismatch-notes claims 25, 27, 28] [fu FU-9], with branches not told [claims 5] [fu FU-8] and a \"potential impact upon ongoing legal cases\" [claims 14]; ten weeks later Post Office \"categorically\" denies remote access through the minister [doc-pol00004406-2013-07-08-second-sight-interim-report claims 132] [fu FU-10] ([synchrony 2010-2014 co-movements 4]; [synchrony 2010-2014 contradictions 1]).\n- The second written record: the April 2011 journal email [doc-pol00004406-2013-07-08-second-sight-interim-report claims 144, 145] [fu FU-11] and Ernst & Young's APPSUP finding the same year [hearing-2024-05-22-paula-vennells-day-142 claims 544] ([synchrony 2010-2014 co-movements 5]; [synchrony 2010-2014 contradictions 7]).\n- The expert-evidence node: Jenkins attesting to integrity from October 2012 to April 2013 while the defects ran and were disclosed to Second Sight [doc-pol00006357-2013-07-15-clarke-advice-expert-evidence claims 97, 102, 108] ([synchrony 2010-2014 co-movements 8]), and Clarke's written advice that he \"failed to disclose material known to him\" [claims 113] [fu FU-53].\n- The July 2013 window: \"some within the organisation had been aware of bugs\" [doc-pol00006357-2013-07-15-clarke-advice-expert-evidence claims 85] [fu FU-55]; the tracked changes \"prepared with Fujitsu\" [hearing-2024-04-09-alan-bates-day-117 tl 84]; Parsons's \"no systemic\" line and his no-paper-trail advice [hearing-2024-04-09-alan-bates-day-117 claims 598, 602]; Lyons on Bates's letter [hearing-2024-04-09-alan-bates-day-117 tl 80]; the shredding advice [hearing-2024-05-22-paula-vennells-day-142 tl 77] ([synchrony 2010-2014 co-movements 1]; [synchrony 2010-2014 signals 8, 9, 10]).\n- The redating and shrinking of the RPM bug in Post Office's own later tellings ([synchrony 2010-2014 contradictions 2, 4]) and the Reply's recharacterisation of the 2010 documents it cites ([synchrony 2010-2014 contradictions 5]).\n- The data wall against the ARQ allowance ([synchrony 2010-2014 co-movements 9]; [synchrony 2010-2014 contradictions 30]) and the privileged animal-named working group of June 2014 ([synchrony 2010-2014 signals 13]).\n\nWhat the era offers against it:\n- The knowledge is recorded below the top: Vennells \"not made aware\" in 2010 [hearing-2024-05-22-paula-vennells-day-142 claims 23], first knew in May 2013 [claims 24], did not see the Clarke advice until 2021 [hearing-2024-05-22-paula-vennells-day-142 tl 75]; the head of criminal litigation \"had been unaware\" [doc-pol00006357-2013-07-15-clarke-advice-expert-evidence claims 86].\n- Post Office did disclose two bugs at 76 branches to Second Sight in 2012 to 2013 [doc-pol00004406-2013-07-08-second-sight-interim-report claims 56, 90], commissioned the Clarke review, and had a review of all prosecutions under way by July 2013 [doc-pol00006357-2013-07-15-clarke-advice-expert-evidence claims 120] [fu FU-54]; prosecutions had stopped by 2014 on Vennells's account [hearing-2024-05-22-paula-vennells-day-142 claims 354].\n- No held row joins any 2010 document to the drafter of the December 2010 line (lead 41) or any of the July 2013 reactions to one another; the \"managing\" is a pattern of timing, not a row.\n\nNodes a builder should take: [doc-pol00028838-2010-09-29-receipts-payments-mismatch-notes claims 5, 14, 25, 27, 28, 31]; [doc-pol00004406-2013-07-08-second-sight-interim-report claims 132, 144, 145]; [hearing-2024-05-22-paula-vennells-day-142 claims 544]; [doc-pol00006357-2013-07-15-clarke-advice-expert-evidence claims 85, 86, 108, 113, 120]; [hearing-2024-04-09-alan-bates-day-117 tl 84, 89, 90]; [hearing-2024-05-22-paula-vennells-day-142 claims 598, 601, 602].\n\nContradictions it must take a side on: 1 (the December 2010 line), 2 and 4 (the RPM figures and dates), 5 (central correction), 7 (journalling), 11 (who knew within Post Office), 17 (Parsons), 20 (the balancing transaction), 23 (Vennells's no-bugs belief), 24 (the every-case line), 30 (the data wall). All eleven are possible flares on this page; the builder must name the misdirection or the error reading at each and carry it through.\n\n### good-faith-reliance\n\nWhat the era offers for it:\n- The stated chain of reassurance: senior IT managers told Vennells no bugs had been found [hearing-2024-05-22-paula-vennells-day-142 claims 28]; the Board's General Counsel told it every prosecution was won [hearing-2024-05-22-paula-vennells-day-142 tl 57]; in 2014 \"I was completely reassured by the CIO\" [claims 644]; Deloitte \"had not found anything to show that the Horizon system was not working as it should\" [claims 564]; Sewell's balancing-transaction assurance [claims 561] ([synchrony 2010-2014 co-movements 3]; [synchrony 2010-2014 contradictions 20, 23]).\n- Effort at the top: Vennells sought a briefing on the 2011 technology audit [hearing-2024-05-22-paula-vennells-day-142 tl 49], Post Office decided to have Horizon independently verified [tl 45], asked Fujitsu why it took so long to escalate the RPM bug [doc-pol00028838-2010-09-29-receipts-payments-mismatch-notes claims 17], and commissioned Deloitte [hearing-2024-05-22-paula-vennells-day-142 tl 69].\n- The knowledge sat with the supplier and its expert: the RPM bug ran from May before Fujitsu escalated [doc-pol00028838-2010-09-29-receipts-payments-mismatch-notes tl 2, 5]; Jenkins knew, by Post Office's own counsel's reading [doc-pol00006357-2013-07-15-clarke-advice-expert-evidence claims 102, 113]; Post Office's 2013 disclosures may rest on Jenkins (leads 42, 55) ([synchrony 2010-2014 co-movements 8]).\n- Lane F follows Post Office's line, not its documents: no minister holds a lane A document in the era ([synchrony 2010-2014 co-movements 10]).\n\nWhat the era offers against it:\n- Written knowledge at Post Office, not only at Fujitsu: Post Office attendees in 2010 (POL Finance, Network, IT among them) [doc-pol00028838-2010-09-29-receipts-payments-mismatch-notes audit 1]; an email to Post Office employees in 2011 [doc-pol00004406-2013-07-08-second-sight-interim-report claims 144]; Post Office teams at Bracknell [doc-pol00004406-2013-07-08-second-sight-interim-report tl 15].\n- Warnings that reached the chief executive herself: Ernst & Young's 2011 privileged-access risk [hearing-2024-05-22-paula-vennells-day-142 tl 48]; subpostmasters writing to her from February 2012 [tl 59]; Bates's email of 21 May 2013 [hearing-2024-04-09-alan-bates-day-117 tl 76]; Detica's report sent to her General Counsel and CIO [hearing-2024-05-22-paula-vennells-day-142 tl 87].\n- Lines carried after contrary facts were available: the every-case line to MPs after Arch's acquittal ([synchrony 2010-2014 contradictions 24]); Parsons's \"no systemic\" line nine days after the Clarke advice ([synchrony 2010-2014 contradictions 17]); the 2014 Board purpose \"critical to [the Post Office's] legal position\" [hearing-2024-05-22-paula-vennells-day-142 claims 571].\n- The signals the rival must absorb: the covert recording on whether Vennells should be told certain things ([synchrony 2010-2014 signals 7]); the no-paper-trail advice ([synchrony 2010-2014 signals 9]); the undocumented 2014 assurance ([synchrony 2010-2014 signals 12]).\n\nNodes a builder should take: [hearing-2024-05-22-paula-vennells-day-142 claims 23, 24, 28, 400, 535, 544, 559 to 571, 598 to 602, 643 to 645]; [hearing-2024-05-22-paula-vennells-day-142 tl 45, 49, 57, 58, 69, 75, 76, 98, 101, 106 to 110]; [doc-pol00006357-2013-07-15-clarke-advice-expert-evidence claims 86, 102, 113]; [doc-pol00028838-2010-09-29-receipts-payments-mismatch-notes tl 2, 5].\n\nContradictions it must take a side on: 1 (who drafted the December 2010 line, if not a misinformed executive), 11 (knowledge \"within the organisation\" against the disclosure), 17 (the lawyer's line, which the rival must read as narrow, not knowing), 20 (the CIO's assurance, the rival's pivot), 23 (who the senior IT managers were and what they held), 24 (the every-case line after an acquittal), 30 (whether the Board was told of the ARQ allowance). The rival sheet ([narrative-rival-good-faith-reliance](narrative-rival-good-faith-reliance.md)) cites the 2014 assurances; this era adds to it the 2011 Ernst & Young letter as the node it must explain.\n\n", "words": 15660}, {"id": "narrative-synchrony-2015-2019", "era": "2015-2019 (pack era `2015-2019`, 2015 to 2019: the CCRC, the group litigation); windows by year, 2019 also by quarter as the pack gives them; the pack's quarter windows of 2017 and 2018 are read together with their year", "title": "Synchrony: 2015 to 2019 (the CCRC, the group litigation)", "meta": {"Kind": "`narrative-synchrony`", "Era": "2015-2019 (pack era `2015-2019`, 2015 to 2019: the CCRC, the group litigation); windows by year, 2019 also by quarter as the pack gives them; the pack's quarter windows of 2017 and 2018 are read together with their year", "Built": "2026-10-23", "Author": "sync-2015-2019 (run pilot-1023, the narrative step of the pilot)", "Sources": "the narrative pack, built 2026-10-23 from notes.db (research/tasks/tool-feedback/pilot-1023/narratives-pilot-1023/pack/: synchrony/2015-2019.md, synchrony-index.md, contradictions.md, speakers.md, signals.md, seeds.md); the era page was not available: this project has no consolidated era pages (research/timeline-consolidated-2015-2019.md is agent-written and not part of this run), so research/timeline-master.md (2015 to 2019) and research/timeline-contradictions.md were read in its place and no cluster IDs are cited; notes consulted for the original rows: hearing-2024-05-22-paula-vennells-day-142, hearing-2024-04-09-alan-bates-day-117, doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two, the-register-2024-01-17-post-office-boss-keeping-mum-remote-access, hacker-news-2024-01-16-post-office-software-glitch-thread, and for the far side of the era's contradictions doc-pol00004406-2013-07-08-second-sight-interim-report, doc-pol00028838-2010-09-29-receipts-payments-mismatch-notes, doc-pol00006357-2013-07-15-clarke-advice-expert-evidence, computer-weekly-2009-05-11-postmasters-tell-their-story; research/leads-and-inferences.md, research/relations-register.md (`ledger analyse relations`), research/echo-patterns.md, research/divergence-patterns.md, research/narrative-rival-good-faith-reliance.md", "Rows considered": "83 timeline rows: the pack's 74 rows of the era, and 9 rows whose span begins before 2015 and runs into it (doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two tl 7, 8, 13, 17; hearing-2024-05-22-paula-vennells-day-142 tl 3, 6, 52, 67; hearing-2024-04-09-alan-bates-day-117 tl 71); 0 clusters (no era page); 38 contradiction nodes of the pack taken (none scores 1.0 or more), 5 new nodes added", "Status": "complete", "Related": "era page: none in this project (research/timeline-consolidated-2015-2019.md not built); [master timeline](timeline-master.md); [timeline contradictions](timeline-contradictions.md); [protocol](../tools/narratives.md); [rival sheet: good-faith reliance](narrative-rival-good-faith-reliance.md); neighbouring pages [2010-2014](narrative-synchrony-2010-2014.md), [2020-2023](narrative-synchrony-2020-2023.md)"}, "lanes": "\n**A. The Horizon system.** Eight rows in lane A, all told after the fact by one root, Vennells (in her Day 142 evidence, firsthand, or agreeing with documents put by Counsel to the Inquiry), with McCormack's emails as a second root for the Dalmellington error. The lane's content is what the Post Office knew about its own system while it spoke: on 30 January 2015 the chief executive asks in writing whether the system can be accessed and what \"the true answer\" is [hearing-2024-05-22-paula-vennells-day-142 tl 120; claims 606, 608]; the remote-tampering lines of 2 February 2015 are written [hearing-2024-05-22-paula-vennells-day-142 tl 123; claims 622, 624 to 628]; at 10.00 on 3 February 2015 she believed there was no functionality to edit branch data [hearing-2024-05-22-paula-vennells-day-142 tl 127; claims 640]; by August 2015 she and the Post Office knew of at least three bugs that had affected branch balances [hearing-2024-05-22-paula-vennells-day-142 tl 130; claims 143]; in 2016 a former subpostmaster tells her Fujitsu promised to fix the Dalmellington error and that it has recurred [hearing-2024-05-22-paula-vennells-day-142 tl 141, 142; claims 524, 525]; an investigation of one of his issues \"found the explanation\" [hearing-2024-05-22-paula-vennells-day-142 tl 139; claims 461; root unnamed]; and only after she left in 2019 did she understand that the balancing transaction tool could be used without the subpostmaster's permission [hearing-2024-05-22-paula-vennells-day-142 tl 151; claims 593]. Lane A content also sits in rows filed elsewhere: the Post Office's 2015 line to Parliament and the BBC [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 3; claims 11], its 2019 admission to the High Court [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 6; claims 12], the general counsel's 2016 note on super-user rights [hearing-2024-05-22-paula-vennells-day-142 tl 143; claims 648], and a span row for the defence expert's count of 672 bugs over 18 years [hearing-2024-05-22-paula-vennells-day-142 tl 3; claims 373]. Absent: no row of the era from Fujitsu itself (Fujitsu's voice in the held set is 2024 and undated: [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 22, 23, 40 to 42]); no PEAK, KEL or ARQ record of the era; no first-hand subpostmaster row on a bug in the era (Hamilton's \"more than nine years\" is a 2024 span relayed by the press [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 4; claims 31]).\n\n**B. Prosecutions and civil recovery.** Three rows, all 2016 and all about one case: McCormack tells Vennells that Mrs Misra's case has been referred and that the police are looking at the Post Office's investigators [hearing-2024-05-22-paula-vennells-day-142 tl 135, 140; claims 175, 520, 521], and Vennells says the case had gone to the CCRC [hearing-2024-05-22-paula-vennells-day-142 tl 137; claims 177, 523]. Roots: McCormack (through his emails, POL00002749) and Vennells. The lane is otherwise carried in positions, not events: the Reply of April 2015 says no evidence has emerged that any conviction is unsafe and that the Post Office will engage \"appropriate independent bodies\" [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 77, 78], states the Post Office's continuing duty as a prosecutor to disclose [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 411], and walls the prosecution files off from Second Sight [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 73; audit 4, 5]; Counsel puts, and Vennells accepts, that from January 2015 to April 2019 she did not believe there had been miscarriages of justice [hearing-2024-05-22-paula-vennells-day-142 claims 171, 174]; by the time of the Group Litigation Order about 60 of the 550 claimants had convictions [hearing-2024-04-09-alan-bates-day-117 tl 103; claims 479]. Absent: no prosecution, civil recovery, CCRC referral decision or appeal of the era in any row; the CCRC appears only through Vennells; no row of the era names a defendant told of a bug.\n\n**C. Disclosure and expert evidence.** Eight rows. The Post Office gives Second Sight emails of August 2008 [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two tl 32; claims 83]; Brian Altman KC's advice of 8 March 2015 [hearing-2024-05-22-paula-vennells-day-142 tl 129; claims 39] and Jonathan Swift's review of 8 February 2016 [hearing-2024-05-22-paula-vennells-day-142 tl 144; claims 40] exist and the chief executive did not see them, the advices being kept within the legal function [hearing-2024-05-22-paula-vennells-day-142 claims 47, 50, 53]; in July 2016 the general counsel, answering Freeths' Letter of Claim, will flag super-user rights within Fujitsu and calls it \"a different positioning to the public statements that we have previously made\" [hearing-2024-05-22-paula-vennells-day-142 tl 143, 145; claims 647 to 651]; the 2017 Mimecast data of Patrick Bourke is still under the Post Office's review in 2024 [hearing-2024-04-09-alan-bates-day-117 tl 105; claims 41]; in 2018 the claimants' expert put numbers on the bugs and interventions, which Vennells says she first learnt then [hearing-2024-05-22-paula-vennells-day-142 tl 147; claims 108]; in November 2018 Womble Bond Dickinson's briefing for the litigation steering group gives the defence expert's worst case of 672 bugs [hearing-2024-05-22-paula-vennells-day-142 tl 148; claims 373], papers Vennells did not see [hearing-2024-05-22-paula-vennells-day-142 claims 41, 374]. By August 2015 she knew there was \"a problem with the Fujitsu expert\" that \"could create a duty of further disclosure that might undermine past criminal convictions\" [hearing-2024-05-22-paula-vennells-day-142 claims 156, 157]. A span row has Bates learning during the Mediation Scheme that the Post Office could request about 700 ARQs a year from Fujitsu [hearing-2024-04-09-alan-bates-day-117 tl 71]. Roots: Vennells, Counsel reading documents (POL00041258, the WBD note), the Post Office's Reply, Bates. Absent: what was disclosed to which defendant, court or the CCRC in the era; the content of the Altman advice and the Swift review.\n\n**D. The critics and the scheme.** The largest lane, 20 rows, nearly all in 2015. The scheme closes in stages: the Post Office gives Second Sight notice [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two tl 34; claims 69], Second Sight issues its final report on 9 April 2015 [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two tl 35; claims 8], all remaining cases go to mediation under CEDR except those subject to a court ruling [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two tl 33; claims 409], and the Working Group is told by telephone it need not meet, the day before its members were to see the Part Two draft [hearing-2024-04-09-alan-bates-day-117 tl 99; claims 547, 548]; Vennells says that when Second Sight was stood down \"the view was that nothing had been found\" [hearing-2024-05-22-paula-vennells-day-142 tl 117; claims 427]. The Post Office's Reply, marked confidential, answers the report [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two tl 36; claims 1, 19]. The critics multiply around it: the BBC's Panorama of 2015, which the Post Office is said to have threatened and delayed [hacker-news-2024-01-16-post-office-software-glitch-thread tl 24, 25; claims 346 to 349], an MP's constituent [hearing-2024-05-22-paula-vennells-day-142 claims 499 to 501], and Tim McCormack, whose emails of October 2015 and 2016 report an intermittent bug and are routed to the Post Office's lawyer, who recommends the standard letter it sends \"every other person who says they have evidence of flaws\" [hearing-2024-05-22-paula-vennells-day-142 tl 133, 134; claims 505, 512, 513, 516]. In 2016 Vennells asks Tom Wechsler to \"suspend any judgement around Sparrow\" [hearing-2024-05-22-paula-vennells-day-142 tl 136; claims 176, 522]. In 2019 the lane carries Read meeting victims [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 8; claims 29] and a critic's trial blog [hacker-news-2024-01-16-post-office-software-glitch-thread tl 30; claims 309]. Roots: the Post Office (the Reply), Vennells, Bates, McCormack (relayed through Counsel), the BBC (a 2024 report relayed by a forum poster), Clark (The Register), Hamilton (through Clark). Absent: Second Sight's own voice of the era (its Part Two and final report are not held: leads 39, 60); the JFSA's own documents; any record of Project Sparrow itself (lead 89).\n\n**E. Money and contracts.** Two rows: Vennells reviewed the strategy and some content of the Fujitsu contract as the Horizon system went to re-tender, up to and during 2015, the original contract never having crossed her desk [hearing-2024-05-22-paula-vennells-day-142 tl 115; claims 56, 57], and in the Common Issues trial Fraser J found the Post Office needed to change its practices and its contract, after the Board had been advised the contract was acceptable [hearing-2024-05-22-paula-vennells-day-142 tl 150; claims 104 to 107]. One root, Vennells. Around them: the Reply's defence of the contract as \"neither commercially nor legally unfair\" [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 138] and of subpostmasters' liability [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 45, 49, 50]; Fujitsu funding improvements to Horizon by its own initiative [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 353]; a span row on suspense-account credits to the Post Office's profit and loss over five years [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two tl 13]. Absent: the settlement's sum, compensation, or any Fujitsu contract term in the era's rows; the settlement appears only as an event [hacker-news-2024-01-16-post-office-software-glitch-thread tl 29; claims 446].\n\n**F. Government and Parliament.** Twelve rows, eleven of them in 2015. The Select Committee of 3 February 2015 is the lane's centre: the 30 January request for answers [hearing-2024-05-22-paula-vennells-day-142 tl 120; claims 606], the briefing pack and the addendum of 2 February [hearing-2024-05-22-paula-vennells-day-142 tl 121 to 123; claims 619, 622], the printed addendum at breakfast [hearing-2024-05-22-paula-vennells-day-142 tl 125; claims 631], the evidence under parliamentary privilege [hearing-2024-05-22-paula-vennells-day-142 tl 124, 126; claims 639]; the press tells it as the Post Office telling a Parliamentary committee and the BBC that remote access was not possible [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 3; claims 11]. In March 2015 Bates writes to the minister about the Mediation Scheme and Jo Swinson replies that there is \"no evidence of system-wide problems with Horizon\" [hearing-2024-04-09-alan-bates-day-117 tl 100, 101; claims 588, 589]; in August 2015 Gloria De Piero MP writes for a constituent [hearing-2024-05-22-paula-vennells-day-142 tl 132; claims 499]. After the 2019 settlement, the government's line becomes that it had been misled by the Post Office (Bates's reading) [hearing-2024-04-09-alan-bates-day-117 tl 111; claims 375]. Roots: Vennells; the Post Office's briefing documents; the minister's letter; the MP's letter; Bates; Clark. Absent: the words of the 3 February 2015 evidence (parliamentary privilege bars the questions [hearing-2024-05-22-paula-vennells-day-142 claims 639]; lead 175 seeks the statements); no row of the era from the shareholder (ShEx, UKGI) or the department.\n\n**G. The courts and the inquiry.** Eleven rows, a single sequence carried by Bates and by Counsel reading court records: the JFSA finds Freeths in September 2015 [hearing-2024-04-09-alan-bates-day-117 tl 102; claims 552], the first claim is issued in April 2016 [hearing-2024-04-09-alan-bates-day-117 tl 104], the Group Litigation Order is made over the Post Office's opposition from 22 March 2017 [hearing-2024-04-09-alan-bates-day-117 tl 107; claims 553], the cut-off to join is 26 July 2017 [hearing-2024-04-09-alan-bates-day-117 tl 108; claims 559], the Post Office's lawyers discuss Bates's truthfulness [hearing-2024-04-09-alan-bates-day-117 tl 106; claims 556 to 562], its application to strike out his statement is dismissed with warnings about aggressive litigation tactics [hearing-2024-04-09-alan-bates-day-117 tl 109; claims 565, 566], his Common Issues statement is dated 9 August 2018 [hearing-2024-04-09-alan-bates-day-117 tl 110; claims 95], and in late 2019 the Horizon Issues ruling, the settlement and the end of further cases follow [hacker-news-2024-01-16-post-office-software-glitch-thread tl 29; claims 446; the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 9; claims 20, 21], the Post Office having admitted remote access to the High Court in 2019 [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 6; claims 12]. Roots: Bates, Counsel (court records), Clark, a forum poster. The judgments themselves are canon and are not rowed here (cited-source scope). The ruling's date drifts between the rows (November 2019; \"shortly before\" September's appointment, the linked report being of 18 December 2019) and the canon's 16 December 2019 (lead 196).\n\n**H. Organisations.** Nine rows, mostly people moving: Alisdair Cameron in the business from January 2015 [hearing-2024-05-22-paula-vennells-day-142 tl 119; claims 171], Moya Greene leaving Royal Mail in 2018 [hearing-2024-05-22-paula-vennells-day-142 tl 146; claims 76], Vennells leaving the Post Office in April 2019 [hearing-2024-05-22-paula-vennells-day-142 tl 149, 152; claims 77, 289] and, as a forum poster tells it, receiving a CBE and an NHS post that year [hacker-news-2024-01-16-post-office-software-glitch-thread tl 27; claims 93; unsourced], Nick Read joining as chief executive in September 2019 [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 5, 7; claims 19, 25]; and two structures in the Reply: monthly operational reviews between the Post Office and Fujitsu and the Branch Support Programme [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two tl 39, 40; claims 351, 376]. Roots: Vennells (agreeing with Counsel), Clark, Read, a forum poster, the Post Office. Absent: Fujitsu's own organisational events; the law firms' lifecycles (Bond Dickinson in 2017, Womble Bond Dickinson in 2018, only as names in rows: [hearing-2024-04-09-alan-bates-day-117 claims 556; hearing-2024-05-22-paula-vennells-day-142 claims 373]).\n\n", "windows": [{"window": "2015 (January to April)", "lanes active": "A, C, D, F, H (also E, undated in the year)", "what moves": "The chief executive's written question on remote access, the tiered addendum and the Select Committee; the minister's \"no system-wide problems\" letter; the Working Group stood down, all cases to mediation, Second Sight's final report and notice, the confidential Reply; an advice the chief executive does not see", "carriers (roots)": "Vennells; the Post Office (addendum, Reply); Swinson's letter; Bates; Clark; the BBC through a forum poster (6 roots; 4 after circle collapse)", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 116 to 129; hearing-2024-04-09-alan-bates-day-117 tl 99 to 101; doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two tl 32 to 40; the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 3; hacker-news-2024-01-16-post-office-software-glitch-thread tl 24, 25]", "reading": "Causal inside the Post Office for the Parliament chain (the request, the addendum and the evidence are joined by rows: [hearing-2024-05-22-paula-vennells-day-142 claims 606, 619, 630]); coincident in the rows for the scheme's end (no row joins the Select Committee or the advice to the decision to stand the Working Group down; lead 90)"}, {"window": "2015 (August to October)", "lanes active": "A, D, F, G", "what moves": "At least three bugs known to the Post Office; \"our priority is to protect the business\"; an MP's letter; McCormack's intermittent bug and the lawyer's standard letter; the JFSA finds Freeths", "carriers (roots)": "Vennells; McCormack; De Piero; Rodric Williams (through POL00117614); Bates (5 roots; 4 after circle collapse)", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 130 to 134; hearing-2024-04-09-alan-bates-day-117 tl 102]", "reading": "The same complaint told by more mouths, met with a standard response; coincident with the litigation's start, which Bates's rows tie to the scheme's end, not to these letters [hearing-2024-04-09-alan-bates-day-117 claims 550, 551]"}, {"window": "2016", "lanes active": "A, B, C, D, G", "what moves": "Misra referred and the police on the investigators; the CCRC; the Dalmellington error recurring; the Letter of Claim and the general counsel's super-user positioning; the first group claim; Sparrow mentioned in an instruction", "carriers (roots)": "McCormack; Vennells; MacLeod (POL00041258); Bates; Counsel reading the claim (5 roots; 4 after circle collapse)", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 135 to 145; hearing-2024-04-09-alan-bates-day-117 tl 103, 104]", "reading": "Causal for the litigation and the positioning (MacLeod writes \"after the Letter of Claim from Freeths\" [hearing-2024-05-22-paula-vennells-day-142 claims 647]); coincident for the criminal side (no row joins the CCRC review to the civil claim)"}, {"window": "2018 (with 2018-Q3, 2018-Q4)", "lanes active": "C, G, H", "what moves": "The claimants' expert evidence on numbers of bugs; the defence expert's count of 672 for the steering group; the strike-out dismissed; Bates's Common Issues statement; Greene leaves Royal Mail", "carriers (roots)": "Vennells; WBD's note (through Counsel); Bates; Counsel reading the judgment (4 roots; 4 after circle collapse)", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 146 to 148; hearing-2024-04-09-alan-bates-day-117 tl 109, 110]", "reading": "Causal (the litigation produces the counts and the statements); Greene's departure coincident"}, {"window": "2019 (with 2019-Q2 to 2019-Q4)", "lanes active": "A, D, E, F, G, H", "what moves": "Common Issues on the contract; Vennells leaves and later learns what the balancing transaction could do; Read arrives; the Horizon Issues ruling, the admission to the court, the settlement; the government's \"misled\" line", "carriers (roots)": "Vennells; Clark; Read; Bates; ghusbands; jack_riminton; Fraser J's rulings as relayed (7 roots; 6 after circle collapse)", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 149 to 152; the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 5 to 9; hearing-2024-04-09-alan-bates-day-117 tl 111; hacker-news-2024-01-16-post-office-software-glitch-thread tl 27 to 30]", "reading": "Causal for the court chain (judgments, settlement, the government's new line: [hearing-2024-04-09-alan-bates-day-117 claims 375]); coincident for le for Post Office to correct errors in and/or update a branch's accounts\", including \"by way of a balancing transaction\" [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 281]; in the 2010 issue \"the error in one branch was corrected by use of a balancing transaction\" [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 282]", "reading": "The concession sits inside the denial, in a document whose distribution is walled. The distinction the Reply draws (inputting a new transaction, not editing one [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 283]) is its own; the signal is that the capability was stated in writing in April 2015 to a narrow audience (contradictions 42, 43)"}, {"#": "5", "carrier": "Post Office Limited (the Reply)", "window": "2015-04", "wall (rows, ground)": "On prosecutions and their review: the legal files are outside Second Sight's engagement [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 73; audit 4: partial, legal professional privilege, ordinary]; miscarriages are for \"appropriate independent bodies\" [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 78; audit 5: deferral, ordinary]; how the Post Office investigates is outside the scheme's scope [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two audit 34; closed-subtle, none stated]; court-ruled cases are excluded from mediation [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 410; audit 35]; no supplemental report is needed, the engagement being ended [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 70; audit 3; closed-subtle, none stated]", "near the wall (rows)": "No evidence \"that a conviction is unsafe\" [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 77]; \"as a prosecutor, Post Office has a continuing duty after a prosecution has concluded to disclose immediately any information\" that might undermine it [doc-pol00004432-2015-04- blems [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 53]; no systemic flaws [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 405]", "reading": "An omission recorded as a signal (contradiction 7; lead 79); the second defect was the Post Office's own 2013 disclosure [doc-pol00004406-2013-07-08-second-sight-interim-report claims 61]"}, {"#": "8", "carrier": "Paula Vennells", "window": "2015", "wall (rows, ground)": "Denies the Post Office used tactics \"to iron away these very disturbing complaints\": \"That was not my understanding\" [hearing-2024-05-22-paula-vennells-day-142 claims 429]; closed-subtle, no ground. A span row has Counsel put such tactics over \"the next 18 months\" [hearing-2024-05-22-paula-vennells-day-142 tl 67]", "near the wall (rows)": "Her March 2015 email: an escalation process \"so that we avoided any unnecessary\" additional noise \"or references to Horizon\" [hearing-2024-05-22-paula-vennells-day-142 claims 494], which she regrets [hearing-2024-05-22-paula-vennells-day-142 claims 496, 497]; the complaint \"simply shouldn't have reached me\" [hearing-2024-05-22-paula-vennells-day-142 claims 493]; by the time Second Sight was stood down \"nothing had been found\" [hearing-2024-05-22-paula-vennells-day-142 claims 427]", "reading": "Near the wall she volunteers the word she regrets. A signal of how complaints were routed; the wall is on the purpose, which the rows do not give"}, {"#": "9", "carrier": "Rodric Williams (through POL00117614, read by Counsel) and Mark Davies", "window": "2015-10", "wall (rows, ground)": "A standard response to critics: \"recommend we write to him in the same terms that we have every other person who says they have evidence of flaws\" (Kay Linnell, Second Sight, Nick Wallis, Sandip Patel, Professor Button) [hearing-2024-05-22-paula-vennells-day-142 claims 513]; meet him \"with a straight bat\" [hearing-2024-05-22-paula-vennells-day-142 claims 516]; Davies: \"wise advice with which duals will give statements [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 28]; met 30 victims [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 29]", "reading": "A wall with an ordinary ground, spoken in 2024 about 2019. Recorded as a boundary only; the Post Office's 2019 admission is held only as the press's unsourced line [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 12] (lead 176)"}, {"#": "15", "carrier": "Alan Bates", "window": "2013 to 2015", "wall (rows, ground)": "On how far Fujitsu's data, including ARQ data, was obtained by Second Sight: partial, deferral; he learnt later, during the Mediation Scheme, of about 700 free ARQ requests a year [hearing-2024-04-09-alan-bates-day-117 audit 115; tl 71]", "near the wall (rows)": "The scheme ended by a telephone call the day before the Part Two draft was to be seen [hearing-2024-04-09-alan-bates-day-117 claims 547, 548]", "reading": "Audit data were within reach and not, on his telling, used for the scheme's applicants; a boundary on what the investigators held, not on what the data showed"}], "orgs": [{"body": "Second Sight (in the Complaint Review and Mediation Scheme)", "event": "Given notice to end its engagement, after completing the remaining cases (before the Reply)", "window": "2015 (by April)", "rows": "[doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two tl 34; claims 69, 70]", "roots": "the Post Office"}, {"body": "Second Sight", "event": "Issues the final version of its Part Two report on 9 April 2015", "window": "2015-04", "rows": "[doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two tl 35; claims 8]", "roots": "the Post Office"}, {"body": "Second Sight", "event": "\"Stood down\", with the view that nothing had been found", "window": "2015", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 117; claims 427]", "roots": "Vennells (hedged)"}, {"body": "The Working Group (Sir Anthony Hooper in the chair, the ent": "An accelerated process for flagged cases and MPs, in use", "window": "2015-10", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 133; claims 512]", "roots": "Vennells"}, {"body": "The Horizon contract with Fujitsu", "event": "Prepared for re-tender; strategy and some content reviewed by the chief executive", "window": "up to and during 2015", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 115; claims 56, 57]", "roots": "Vennells"}, {"body": "Freeths", "event": "Found by the JFSA; come on board and take over the claim", "window": "2015-09", "rows": "[hearing-2024-04-09-alan-bates-day-117 tl 102; claims 552]", "roots": "Bates"}, {"body": "The group litigation (Bates and others v Post Office)", "event": "First claim issued", "window": "2016-04", "rows": "[hearing-2024-04-09-alan-bates-day-117 tl 104; claims 552]", "roots": "Counsel, from the record"}, {"body": "The group litigation", "event": "Group Litigation Order made, over the Post Office's opposition", "window": "2017-03-22", "rows": "[hearing-2024-04-09-alan-bates-day-117 tl 107; claims 553]", "roots": "Bates (agreeing with Counsel)"}, {"body": "The group litigation", "event": "Cut-off for joining; about 1,200 applied, 550 on the schedules", "window": "2017-07-26", "rows": "[hearing-2024-04-09-alan-bates-day-117 tl 108; claims 555, 558, 559]", "roots": "Bates; the JFSA's press release"}, {"body": "The group litigation", "event": "Settlement and the end of further cases", "window": "2019-Q4", "rows": "[hacker-news-2024-01-16-post-office-software-glitch-thread tl 29; claims 446; hearing-2024-04-09-alan-bates-day-117 tl 111; claims 375]", "roots": "ghusbands (unsourced, \"widely reported\"); Bates"}, {"body": "The Post Office's litigation steering group", "event": "In being; briefed by Womble Bond Dickinson in November 2018; the chief executive not a member", "window": "2018-11", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 148; claims 41, 373]", "roots": "Counsel, from the note; Vennells"}, {"body": "Bond Dickinson, later Womble Bond Dickinson", "event": "Named as Bond Dickinson in the 2017 emails and as Womble Bond Dickinson in the 2018 note (the rows give no date for the change)", "window": "2017 to 2018", "rows": "[hearing-2024-04-09-alan-bates-day-117 claims 556; hearing-2024-05-22-paula-vennells-day-142 claims 373]", "roots": "Counsel"}, {"body": "The Post Office (chief executive)", "event": "Paula Vennells leaves as chief executive", "window": "2019-Q2 (April)", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 149, 152; claims 77, 289]", "roots": "Vennells, agreeing with Counsel"}, {"body": "The Post Office (chief executive)", "event": "Nick Read becomes chief executive", "window": "2019-Q3 (September)", "rows": "[the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 5, 7; claims 19, 25]", "roots": "Clark; Read"}, {"body": "The Post Office (executive)", "event": "Alisdair Cameron in the business from January 2015", "window": "2015-01", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 119; claims 171]", "roots": "Counsel, relaying Cameron"}, {"body": "The Post Office (general counsel)", "event": "Jane MacLeod \"then General Counsel\"", "window": "2016-07", "rows": "[hearing-2024-05-22-paula-vennells-day-142 claims 647]", "roots": "Counsel, from POL00041258"}, {"body": "Royal Mail Group", "event": "Moya Greene leaves as chief executive", "window": "2018", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 146; claims 76]", "roots": "Vennells, agreeing with Counsel"}], "builders": "\nThe era is the one in which the Post Office's line on remote alteration and on bugs was given to Parliament, to the scheme's applicants and to a minister (2015), met the litigation's first demands (2016), and gave way in court (2018 to 2019). Almost every row of the era is told after the fact, in 2024, by the chief executive of the period or by Counsel reading documents to her or to Bates; documents of the era held as notes are one (the Reply of April 2015). Fujitsu has no row of its own in the era. A builder should read the era's rows as the Post Office's documents plus the chief executive's account of them, with Bates, McCormack, a minister, an MP and the press as the other roots.\n\n### managed-knowledge\n\nWhat the era offers for it.\n- The tiered addendum of 2 February 2015, written at the chief executive's request for the Select Committee: \"can't be changed remotely\" and \"No functionality ... to edit, manipulate or remove\" are to be volunteered; the balancing transaction is held back for \"if pushed\" and \"if injection of new transaction\" is raised, with \"only been used once since March 2010\" [hearing-2024-05-22-paula-vennells-day-142 claims 623 to 628]. Take [synchrony 2015-2019 co-movements 2] and [synchrony 2015-2019 contradictions 17], [synchrony 2015-2019 contradictions 20]; the wall on why the Post Office would withhold unless pushed is passed to the author [synchrony 2015-2019 signals 1].\n- The same line in four registers across the era [synchrony 2015-2019 co-movements 6]: the confidential Reply concedes that correction by balancing transaction \"has always been possible\" and was used for one branch [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 281, 282] beside \"no functionality ... to edit or delete\" [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 85]; the general counsel in July 2016 calls the coming super-user positioning \"a different positioning to the public statements\" and the earlier phrasing \"quite narrow\" [hearing-2024-05-22-paula-vennells-day-142 claims 649, 651]; the admission comes only in court in 2019 [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 12]. Take [synchrony 2015-2019 contradictions 42], [synchrony 2015-2019 contradictions 43] and [synchrony 2015-2019 signals 4], [synchrony 2015-2019 signals 10].\n- The Reply's recharacterisation of the Post Office's own 2010 record (\"inaccurately refer\"; \"shown transparently\"; the entry written by Fujitsu renamed a balancing transaction) [synchrony 2015-2019 contradictions 3], [synchrony 2015-2019 contradictions 4], [synchrony 2015-2019 contradictions 36]; its silence on the 2011 journal email and the Local Suspense defect [synchrony 2015-2019 contradictions 12], [synchrony 2015-2019 signals 7].\n- Knowledge beside denial: by August 2015 the Post Office and the chief executive knew of at least three bugs that had affected balances [hearing-2024-05-22-paula-vennells-day-142 claims 143], while the Reply said there was no evidence of systemic problems [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 53] and the minister wrote the same to Bates [hearing-2024-04-09-alan-bates-day-117 claims 589] ([synchrony 2015-2019 contradictions 8], [synchrony 2015-2019 contradictions 39]); in November 2018 the steering group was briefed on a worst case of 672 bugs while the Post Office defended Horizon [synchrony 2015-2019 co-movements 1].\n- The scheme closed in stages while every route to the prosecutions was walled [synchrony 2015-2019 co-movements 8], [synchrony 2015-2019 signals 5]; a standard letter for \"every other person who says they have evidence of flaws\" [synchrony 2015-2019 signals 9]; Sparrow still forming views on cases in 2016 [synchrony 2015-2019 contradictions 16].\n\nWhat the era offers against it.\n- The chief executive's own email asks \"What is the true answer?\" [hearing-2024-05-22-paula-vennells-day-142 claims 608], and her stated grounds are a CIO's 2014 assurance and an auditor's confirmation as she recalls it [hearing-2024-05-22-paula-vennells-day-142 claims 587, 637, 643, 644]: the seed must show the knowledge reached the people who wrote the line, not only the institution ([synchrony 2015-2019 contradictions 21], [synchrony 2015-2019 contradictions 40]).\n- The capability was conceded in writing in April 2015 [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 281]; the seed's \"kept out of the public record\" holds for the public and Parliament, but not for the applicants, and the seed should say so.\n- The general counsel's 2016 note runs against the agency's interest [synchrony 2015-2019 contradictions 43]: it shows the lawyers recognised the gap, which fits management of the gap and also its correction in the litigation.\n- No era row from Fujitsu: the seed's Fujitsu half rests on the Post Office's documents and the 2024 statements [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 22, 23].\n\nContradictions the seed must take a side on: [synchrony 2015-2019 contradictions 17] and [synchrony 2015-2019 contradictions 20] (error or misdirection in the addendum; the drafts decide), [synchrony 2015-2019 contradictions 40] (whether the auditor's caveat stood), [synchrony 2015-2019 contradictions 2] (the Bracknell escort), [synchrony 2015-2019 contradictions 26] (why the Working Group was stood down when it was), [synchrony 2015-2019 contradictions 16] (what Sparrow was), [synchrony 2015-2019 contradictions 39] (whose line the minister wrote).\n\n### good-faith-reliance\n\nWhat the era offers for it (the rival as research/narrative-rival-good-faith-reliance.md states it).\n- A chain of reliance with documents at each link: the auditor's Board briefing of 2014, the CIO's correction of it, the chief executive's belief at 10.00 on 3 February 2015 [hearing-2024-05-22-paula-vennells-day-142 claims 586, 587, 640, 643, 644]; take [synchrony 2015-2019 contradictions 21] and [synchrony 2015-2019 contradictions 40].\n- Structures that kept knowledge from the top: legal advices not shared by practice, the Altman advice of 2015 and the Swift review of 2016 unseen by the chief executive [synchrony 2015-2019 signals 12]; Detica's report going to three senior staff but not to her [hearing-2024-05-22-paula-vennells-day-142 claims 379, 383, 391] ([synchrony 2015-2019 contradictions 19]); the steering group she was not on [synchrony 2015-2019 signals 11]; the standard letter to critics held by the lawyer and the communications director [synchrony 2015-2019 signals 9].\n- Late arrival of knowledge: the numbers of bugs in 2018 [hearing-2024-05-22-paula-vennells-day-142 claims 108], \"possibly Fujitsu not sharing as much as it could or should have done\" [hearing-2024-05-22-paula-vennells-day-142 claims 110], the balancing transaction's reach only after she left [hearing-2024-05-22-paula-vennells-day-142 claims 593] ([synchrony 2015-2019 co-movements 1], [synchrony 2015-2019 co-movements 10]).\n- The shareholder's own later line that it was misled by the Post Office [hearing-2024-04-09-alan-bates-day-117 claims 375] ([synchrony 2015-2019 co-movements 5]); Cameron and Vennells agree she believed there were no miscarriages until April 2019 [synchrony 2015-2019 contradictions 41].\n\nWhat the era offers against it.\n- By August 2015 she knew of at least three bugs and that the Fujitsu expert problem \"could create a duty of further disclosure that might undermine past criminal convictions\" [hearing-2024-05-22-paula-vennells-day-142 claims 143, 156]; the auditor's briefing was, as she accepts, \"written evidence to you and the Board that Fujitsu could alter branch transactions without the approval of the subpostmaster\" [hearing-2024-05-22-paula-vennells-day-142 claims 594].\n- The tiered addendum reached her (\"undoubtedly got it\" [hearing-2024-05-22-paula-vennells-day-142 claims 618]); the 2016 note reached her and drew \"What did we say previously?\" [hearing-2024-05-22-paula-vennells-day-142 claims 650]; she wrote that \"our priority is to protect the business\" [hearing-2024-05-22-paula-vennells-day-142 claims 142].\n- Reliance at the top does not explain the drafters: the Reply's recharacterisation of the Post Office's own 2010 record [synchrony 2015-2019 contradictions 3] and the addendum's tiers [synchrony 2015-2019 signals 1] need the rival to extend to the people who wrote them.\n\nContradictions the rival must take a side on: [synchrony 2015-2019 contradictions 40] and [synchrony 2015-2019 contradictions 21] (whose error the reliance chain carried), [synchrony 2015-2019 contradictions 19] (whether the Reply's drafters had Detica), [synchrony 2015-2019 contradictions 39] (the minister: reliant or relaying), [synchrony 2015-2019 contradictions 17] (if the addendum's drafters erred, the rival reaches below the board; if not, it fails at that node).\n\nTests the era names for both (open; leads below and in the register): the addendum's drafts and drafters (leads 160, 161); the Board minute of the Deloitte briefing; the drafting chain of the minister's March 2015 reply; the Altman advice and the Swift review; the Sparrow minutes (lead 89); any correction of the 2015 statements to Parliament after July 2016.\n\n\n", "words": 15028}, {"id": "narrative-synchrony-2020-2023", "era": "2020-2023 (2020 to 2023: the inquiry, Hamilton); windows by year with quarters (quarter start 2019)", "title": "Synchrony 2020-2023: the inquiry, Hamilton", "meta": {"Kind": "narrative-synchrony", "Era": "2020-2023 (2020 to 2023: the inquiry, Hamilton); windows by year with quarters (quarter start 2019)", "Built": "2026-10-23", "Author": "sync-2020-2023 (run pilot-1023, the narrative step of the pilot)", "Sources": "the run's narrative pack, built 2026-10-23 from notes.db (research/tasks/tool-feedback/pilot-1023/narratives-pilot-1023/pack/: synchrony/2020-2023.md, synchrony-index.md, contradictions.md, speakers.md, signals.md, seeds.md); the era page was not available: this project has no consolidated era pages (research/timeline-consolidated-2020-2023.md is agent-written and not part of this run), so research/timeline-master.md (2019 to 2023) and research/timeline-contradictions.md were read in its place and no cluster IDs are cited; the notes consulted for the original rows: hearing-2024-04-09-alan-bates-day-117, hearing-2024-05-22-paula-vennells-day-142, terms-of-reference-post-office-horizon-it-inquiry-2021, the-register-2024-01-17-post-office-boss-keeping-mum-remote-access, hacker-news-2024-01-16-post-office-software-glitch-thread, computer-weekly-2009-05-11-postmasters-tell-their-story; the canon Hamilton and others v Post Office Ltd [2021] EWCA Crim 577 (sources/pilot/canon/hamilton-v-post-office/paragraphs.txt), read at the paragraphs cited (canon, not a note row: the court's telling); research/leads-and-inferences.md, research/relations-register.md (tools/relations.py), research/divergence-patterns.md, research/echo-patterns.md, research/narrative-rival-good-faith-reliance.md, packs/pilot/seeds/catalysts.md, packs/pilot/codebook/argot.md, packs/pilot/registers/order-of-battle-seed.md", "Rows considered": "28 pack rows (every dated timeline row of the era; all read in their notes); 7 further timeline rows the pack placed in another window or could not date, read for the era ([terms-of-reference-post-office-horizon-it-inquiry-2021 tl 7], [terms-of-reference-post-office-horizon-it-inquiry-2021 tl 8], [hearing-2024-04-09-alan-bates-day-117 tl 111], [hearing-2024-04-09-alan-bates-day-117 tl 120], [hacker-news-2024-01-16-post-office-software-glitch-thread tl 67], [hacker-news-2024-01-16-post-office-software-glitch-thread tl 68], [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 24]); about 150 claims and audit rows read in the notes for the original wording; 0 clusters (no era page)", "Status": "complete", "Related": "era page: not available in this project (research/timeline-consolidated-2020-2023.md not built); [master timeline](timeline-master.md); [timeline contradictions](timeline-contradictions.md); [narratives protocol](../tools/narratives.md); [rival sheet: good-faith reliance](narrative-rival-good-faith-reliance.md)"}, "lanes": "\n**A. The Horizon system.** No pack row of the era falls in lane A after reassignment: nothing held dates a change to Horizon itself between 2020 and 2023. The system enters the era only as concessions and findings about its past. In the appeals, Post Office Ltd's Respondent's Notice accepted Fraser J's findings of about 30 bugs, errors and defects affecting Legacy Horizon and Horizon Online, and that Fujitsu could insert, inject, edit or delete transaction data or data in branch accounts \"without the knowledge or consent of the SPM\" (Hamilton [2021] EWCA Crim 577 at [70], `paragraphs.txt`:910 (canon)). The government's terms of 1 June 2021 ask for \"a clear account of\" the \"implementation and failings of Horizon over its lifecycle\" and name no bug and no remote access ([terms-of-reference-post-office-horizon-it-inquiry-2021 claims 13], [terms-of-reference-post-office-horizon-it-inquiry-2021 claims 14]; leads 200 and 207 already hold the absence). Two forum rows posted in 2024 relay inquiry evidence on the system's earlier state, undated: a developer's account of his team's competence ([hacker-news-2024-01-16-post-office-software-glitch-thread tl 67], [hacker-news-2024-01-16-post-office-software-glitch-thread claims 256]) and Fujitsu's \"unrestricted and unaudited\" access ([hacker-news-2024-01-16-post-office-software-glitch-thread tl 68], [hacker-news-2024-01-16-post-office-software-glitch-thread claims 300]); the note collapses the second to one root, the inquiry. Roots for the lane in the era: the court (canon), the government; the forum relays add no root of their own.\n\n**B. Prosecutions and civil recovery.** One pack row: Jo Hamilton's conviction \"for theft\" quashed in 2021, told by Lindsay Clark from The Register's own report of 2021-04-23, which is not held ([the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 10], [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 30]); lane B (pack said D). The canon gives the event in full: of 42 appellants referred by the CCRC, 39 convictions quashed and three appeals dismissed (Hamilton [2021] EWCA Crim 577 at [447], `paragraphs.txt`:4885 (canon)), after POL conceded material failures of investigation and disclosure in 39 cases (Hamilton [2021] EWCA Crim 577 at [77], `paragraphs.txt`:975 (canon)) and, for Hamilton, Thomas, Henderson and Hall, that the prosecutions were an affront to justice as well (Hamilton [2021] EWCA Crim 577 at [74], `paragraphs.txt`:952 (canon)). The terms of reference then make \"the quashing of criminal convictions\" part of mandate A ([terms-of-reference-post-office-horizon-it-inquiry-2021 claims 8], [terms-of-reference-post-office-horizon-it-inquiry-2021 claims 10]). The Register's \"theft\" diverges from the court and from Computer Weekly 2009 (Contradictions 1). Context, undated: by the group litigation about 60 of 550 claimants had convictions ([hearing-2024-04-09-alan-bates-day-117 claims 479]). Roots on the event after collapse: one, the court (The Register relays a report of the judgment; the terms cite it). Absent: any new prosecution or civil recovery in the era, and any dated row of the CCRC's referrals (the canon says only that they came in tranches, Hamilton [2021] EWCA Crim 577 at [55], `paragraphs.txt`:681 (canon)).\n\n**C. Disclosure and expert evidence.** Six pack rows in two bursts, and the lane that carries the era. In 2021 two Post Office documents of July 2013 reach the subpostmasters' side through the appeals: Mr Bates learns of the first Clarke advice \"quite late on\", probably at \"the appeal court hearings for the overturned convictions\", in 2021 ([hearing-2024-04-09-alan-bates-day-117 tl 113], [hearing-2024-04-09-alan-bates-day-117 claims 475]; lane C, pack said D), and many people learn that the Post Office had notified its insurers of the Horizon issues in 2013 when it \"arose with the overturning of convictions\" ([hearing-2024-04-09-alan-bates-day-117 tl 114], [hearing-2024-04-09-alan-bates-day-117 claims 591], [hearing-2024-04-09-alan-bates-day-117 claims 593] to [hearing-2024-04-09-alan-bates-day-117 claims 599]; lane C, pack said D). The canon dates the first: the Clarke advice of 15 July 2013 \"was first disclosed in these proceedings in November 2020\", from POL's review of documents (Hamilton [2021] EWCA Crim 577 at [81], `paragraphs.txt`:1019 (canon), Hamilton [2021] EWCA Crim 577 at [82], `paragraphs.txt`:1024 (canon)). In 2023 the inquiry's disclosure fight with the Post Office: a meeting of April 2023 at which the inquiry told the Post Office to \"apply a common-sense approach\" to senior custodians ([hearing-2024-04-09-alan-bates-day-117 tl 116], [hearing-2024-04-09-alan-bates-day-117 claims 62]), the section 21(3) notice of 21 July 2023 calling for reviews by Ernst & Young, Deloitte, KPMG and Linklaters and the documents of 19 named individuals ([hearing-2024-04-09-alan-bates-day-117 tl 118], [hearing-2024-04-09-alan-bates-day-117 claims 26] to [hearing-2024-04-09-alan-bates-day-117 claims 29]), and two disclosure hearings in July and September 2023 with Post Office evidence ([hearing-2024-04-09-alan-bates-day-117 tl 117], [hearing-2024-04-09-alan-bates-day-117 claims 3]); all three lane C (pack said D, D, B). Between them, a 2022 briefing on the presumption that computers are reliable ([hacker-news-2024-01-16-post-office-software-glitch-thread tl 36], [hacker-news-2024-01-16-post-office-software-glitch-thread claims 411]; lane C, pack said D; lead 187 holds it as a document to obtain). Roots: Bates (firsthand of what he learned and when), the inquiry (counsel Mr Beer, firsthand of the inquiry's own acts; the Chair is the same root), the court (canon), and a forum poster relaying a briefing. Absent: any row in the era in which the Post Office gives its own account of why its disclosure was late; the nearest is its chief executive's assurance of January 2024 (Contradictions 2).\n\n**D. The critics and the scheme.** Three pack rows, all public commentary rather than the JFSA or Second Sight: a BBC radio programme on the case \"started in 2020\" ([hacker-news-2024-01-16-post-office-software-glitch-thread tl 31], [hacker-news-2024-01-16-post-office-software-glitch-thread claims 356]; lane D, the pack's letter, here as the critics' lane), Bentham's Gaze's \"What went wrong with Horizon\" of 15 July 2021 ([hacker-news-2024-01-16-post-office-software-glitch-thread tl 32], [hacker-news-2024-01-16-post-office-software-glitch-thread claims 308]; lane D, pack said B), and the Wikipedia article on the scandal first posted to the forum about two years before January 2024 ([hacker-news-2024-01-16-post-office-software-glitch-thread tl 35], [hacker-news-2024-01-16-post-office-software-glitch-thread claims 440]; lane D, pack said B). A fourth publication sits in a later note: a postofficetrial.com post of July 2021, the source of The Register's \"the Post Office knew from at least 2012\" ([the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 8]; cross-check 11 of that note; leads 172 and 178). The JFSA's own moves in the era are Mr Bates's learning of the 2013 documents (lane C) and his redress application (lane E). Second Sight, the Working Group and Project Sparrow have no row in the era. Roots: four publications, each through one relay (laurieg, mavhc, omoikane, Lindsay Clark). Absent: any JFSA statement dated 2020 to 2023.\n\n**E. Money and contracts.** Two pack rows, both Mr Bates's: the minister announces the redress scheme in March 2022 ([hearing-2024-04-09-alan-bates-day-117 tl 115], [hearing-2024-04-09-alan-bates-day-117 claims 580]; lane E, pack said B) and Mr Bates applies for redress in October 2023 ([hearing-2024-04-09-alan-bates-day-117 tl 119], [hearing-2024-04-09-alan-bates-day-117 claims 571]; lane E, pack said D), the offer coming 77 working days later at about a sixth of his claim ([hearing-2024-04-09-alan-bates-day-117 tl 120], [hearing-2024-04-09-alan-bates-day-117 claims 572], [hearing-2024-04-09-alan-bates-day-117 claims 573]; ~2024-01, the next era). He names the Post Office's disclosure as the scheme's \"initial problem\" ([hearing-2024-04-09-alan-bates-day-117 claims 580]). The terms ask whether the commitments of the mediation settlement, \"including the historical shortfall scheme\", have been delivered ([terms-of-reference-post-office-horizon-it-inquiry-2021 claims 17]; lead 201) and put the group damages settlement outside scope ([terms-of-reference-post-office-horizon-it-inquiry-2021 claims 23], [terms-of-reference-post-office-horizon-it-inquiry-2021 audit 2]). Fujitsu's share of compensation is deferred to the end of the statutory inquiry ([the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 24], [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 44]; told in 2024). Roots: Bates (one root for every dated money row of the era), the government. Absent: the scheme's operator and rules beyond \"the Department's 40-day target\" ([hearing-2024-04-09-alan-bates-day-117 claims 572]), and any figure for the scheme.\n\n**F. Government and Parliament.** Four pack rows. Three are the government's own sequence as its terms tell it: the Prime Minister's commitment of 26 February 2020 and the Ministerial Statements of 10 June and 30 September 2020, named but not quoted ([terms-of-reference-post-office-horizon-it-inquiry-2021 tl 1] to [terms-of-reference-post-office-horizon-it-inquiry-2021 tl 3], [terms-of-reference-post-office-horizon-it-inquiry-2021 claims 1], [terms-of-reference-post-office-horizon-it-inquiry-2021 claims 2]; lane F, pack said D, B, B; lead 198 seeks the 2020 statements). The fourth is Ms Vennells's texts \"in relation to the Select Committee in 2020\" ([hearing-2024-05-22-paula-vennells-day-142 tl 153], [hearing-2024-05-22-paula-vennells-day-142 claims 100]; lane F, pack said D). Just before the era, after the group litigation settled, the government moved from the ministers' line that Horizon was a matter for an arm's-length Post Office ([hearing-2024-04-09-alan-bates-day-117 claims 372]) to \"the new line that it had been misled by the Post Office\" ([hearing-2024-04-09-alan-bates-day-117 tl 111], [hearing-2024-04-09-alan-bates-day-117 claims 375]: put by Mr Beer from Mr Bates's statement, Mr Bates agreeing by his own inference). Roots: the government (one root for the terms' rows), Vennells, Bates through his statement. Absent: which Select Committee inquiry of 2020, with whom Ms Vennells texted, and what the 2020 statements said.\n\n**G. The courts and the inquiry.** Five pack rows, plus the Court of Appeal in canon. The inquiry: its non-statutory phase, when Ms Vennells also exchanged texts ([hearing-2024-05-22-paula-vennells-day-142 tl 154], [hearing-2024-05-22-paula-vennells-day-142 claims 100]; lane G, pack said D); its beginning as the Chair counts it, \"very nearly three years\" before 9 April 2024 ([hearing-2024-04-09-alan-bates-day-117 tl 112], [hearing-2024-04-09-alan-bates-day-117 claims 71]; lane G, pack said D); its first aim to report to the Secretary of State \"in Autumn 2022\", overtaken by a later footnote ([terms-of-reference-post-office-horizon-it-inquiry-2021 tl 6], [terms-of-reference-post-office-horizon-it-inquiry-2021 claims 28]; lane G, pack said D; with [terms-of-reference-post-office-horizon-it-inquiry-2021 tl 8], [terms-of-reference-post-office-horizon-it-inquiry-2021 claims 32], undated); its request of August 2023 that Ms Vennells reflect on her time at the Post Office ([hearing-2024-05-22-paula-vennells-day-142 tl 155], [hearing-2024-05-22-paula-vennells-day-142 claims 124]; lane G, pack said B) and her draft statement of December 2023, by which she had \"run out of time\" for two questions ([hearing-2024-05-22-paula-vennells-day-142 tl 156], [hearing-2024-05-22-paula-vennells-day-142 claims 130]; lane G, pack said B). The court: hearing on 22 to 25 March 2021 and judgment on 23 April 2021 (Hamilton [2021] EWCA Crim 577, header (\"Date: 23/04/2021\"; \"Hearing dates: 22, 23, 24 & 25 March 2021\"), `paragraphs.txt`:10, 18 (canon)), with the court's reading that the need for the Clarke advices \"suggests there was a culture, amongst at least some in positions of responsibility within POL, of seeking to avoid legal obligations\" (Hamilton [2021] EWCA Crim 577 at [90], `paragraphs.txt`:1156 (canon)). Roots: the government, the inquiry (Chair and counsel one root), Vennells, the court. Absent: any held telling of a hearing of the inquiry before July 2023; the inquiry's own phase dates (lead 205).\n\n**H. Organisations.** Two pack rows: the inquiry established as a non-statutory inquiry after the statements of 2020, undated ([terms-of-reference-post-office-horizon-it-inquiry-2021 tl 4], [terms-of-reference-post-office-horizon-it-inquiry-2021 claims 3]; lane H, the pack's letter) and converted into a statutory inquiry on 1 June 2021 with amended terms ([terms-of-reference-post-office-horizon-it-inquiry-2021 tl 5], [terms-of-reference-post-office-horizon-it-inquiry-2021 claims 4], [terms-of-reference-post-office-horizon-it-inquiry-2021 claims 5]; lane H, pack said D). Undated: the Department for Business, Energy and Industrial Strategy \"is now the Department for Business and Trade\" ([terms-of-reference-post-office-horizon-it-inquiry-2021 tl 7], [terms-of-reference-post-office-horizon-it-inquiry-2021 claims 31]). The inquiry's staffing is in the terms: the Chair, a Secretariat and up to four unnamed assessors ([terms-of-reference-post-office-horizon-it-inquiry-2021 claims 25], [terms-of-reference-post-office-horizon-it-inquiry-2021 claims 26]). The Post Office's chief executive throughout the era is Nick Read, in post from September 2019 ([the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 7], [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 19], [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 25]). Absent: any lifecycle row for the Post Office, Fujitsu, the JFSA or the law firms in the era; Burges Salmon appears as the Post Office's recognise
