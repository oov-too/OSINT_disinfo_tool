const DATA = {"built": "2026-10-26", "narratives": [{"id": "narrative-managed-knowledge", "title": "Narrative: managed knowledge", "meta": {"Kind": "narrative", "Mode": "mainline", "Parent": "none", "Thesis": "From 2010 at the latest, and with antecedents from 2002, people within the Post Office and Fujitsu recorded in writing that Horizon had bugs affecting branch accounts and that Fujitsu could write to branch accounts without the branch knowing, while the Post Office told the minister (2010), Parliament (2015), the scheme's applicants (2015) and its insurers (2013) narrower or contrary lines, and the written knowledge reached convicted defendants only when the appeals forced it out (2020 to 2021) and the inquiry was still drawing it out in 2024.", "Alternative": "Good-faith reliance [rival: good-faith-reliance]: the executives believed Horizon robust because the supplier, the audits and every prosecution told them so; the knowledge of bugs and remote access sat with Fujitsu and junior staff and did not reach the people who made the statements; the failures were of competence, structure and oversight, not of knowledge withheld.", "Span": "2002 to 2024 (antecedents 2002 to 2009; the seed's core 2010 to 2019; the tail 2020 to 2024)", "Lanes": "A (Horizon: bugs, remote access, audit data), B (prosecutions and civil recovery), C (disclosure and expert evidence), D (the critics and the scheme), E (money and contracts), F (government and Parliament), G (the courts and the inquiry), H (organisations)", "Built": "2026-10-23", "Author": "build-managed-knowledge (run pilot-1023, narrative step)", "Status": "revised 2026-10-23", "Revised": "revise-managed-knowledge (run pilot-1023, narrative step: the ruling on the first attack, attack-managed-knowledge), 2026-10-23", "Related": "[rival sheet](narrative-rival-good-faith-reliance.md); synchrony pages [pre-2000](narrative-synchrony-pre-2000.md), [2000-2009](narrative-synchrony-2000-2009.md), [2010-2014](narrative-synchrony-2010-2014.md), [2015-2019](narrative-synchrony-2015-2019.md), [2020-2023](narrative-synchrony-2020-2023.md), [2024-onward](narrative-synchrony-2024-onward.md); [first-utterance register](first-utterance-register.md); [leads](leads-and-inferences.md); [relations](relations-register.md); speaker ledgers [Bates](bates-perspective-ledger.md), [Vennells](vennells-perspective-ledger.md), [Jenkins](jenkins-perspective-ledger.md)"}, "mode": "mainline", "parent": "none", "thesis_line": "From 2010 at the latest, and with antecedents from 2002, people within the Post Office and Fujitsu recorded in writing that Horizon had bugs affecting branch accounts and that Fujitsu could write to branch accounts without the branch knowing, while the Post Office told the minister (2010), Parliament (2015), the scheme's applicants (2015) and its insurers (2013) narrower or contrary lines, and the written knowledge reached convicted defendants only when the appeals forced it out (2020 to 2021) and the inquiry was still drawing it out in 2024.", "alternative_line": "Good-faith reliance [rival: good-faith-reliance]: the executives believed Horizon robust because the supplier, the audits and every prosecution told them so; the knowledge of bugs and remote access sat with Fujitsu and junior staff and did not reach the people who made the statements; the failures were of competence, structure and oversight, not of knowledge withheld.", "span": "2002 to 2024 (antecedents 2002 to 2009; the seed's core 2010 to 2019; the tail 2020 to 2024)", "lanes": "A (Horizon: bugs, remote access, audit data), B (prosecutions and civil recovery), C (disclosure and expert evidence), D (the critics and the scheme), E (money and contracts), F (government and Parliament), G (the courts and the inquiry), H (organisations)", "status": "revised 2026-10-23", "words": 45605, "score_lines": [{"clusters": 33.0, "rows": 173.0, "roots": 35.0, "circle_roots": 12.0, "reading_roots": 6.0, "contradictions": 27.0, "load": 20.4, "max_downstream": 7.0, "closures_pred": null, "closures_all": null, "unaff_roots": 24.0, "roots_all": 30.0, "survive": 13.0, "nodes_all": 33.0, "tests": 18.0, "thin": null, "thin_all": null}, {"clusters": 33.0, "rows": 173.0, "roots": 32.0, "circle_roots": 11.0, "reading_roots": 7.0, "contradictions": 37.0, "load": 23.9, "max_downstream": 15.0, "closures_pred": null, "closures_all": null, "unaff_roots": 18.0, "roots_all": 28.0, "survive": 11.0, "nodes_all": 33.0, "tests": 17.0, "thin": null, "thin_all": null}, {"clusters": 33.0, "rows": 189.0, "roots": 35.0, "circle_roots": 11.0, "reading_roots": 7.0, "contradictions": 35.0, "load": 22.6, "max_downstream": 15.0, "closures_pred": null, "closures_all": null, "unaff_roots": 20.0, "roots_all": 30.0, "survive": 12.0, "nodes_all": 33.0, "tests": 18.0, "thin": null, "thin_all": null}, {"clusters": 33.0, "rows": 243.0, "roots": 35.0, "circle_roots": 11.0, "reading_roots": 7.0, "contradictions": 35.0, "load": 22.6, "max_downstream": 15.0, "closures_pred": null, "closures_all": null, "unaff_roots": 20.0, "roots_all": 30.0, "survive": 12.0, "nodes_all": 33.0, "tests": 18.0, "thin": 3.0, "thin_all": 33.0}], "thesis": "\nThe story, as the held rows let it be told: the Post Office's own papers handled Horizon-attributed losses as a class from 2002 while its letters told a subpostmaster that nothing was \"inherently wrong\" (node 1); its supplier knew of the Callendar Square bug for years while courts and pleas settled cases on Horizon's soundness (node 2); a form of remote alteration of branch data is attested for 2008 by an eyewitness and, through counsel, by inquiry documents (node 3). From September 2010 the record is in writing and joint: Post Office and Fujitsu staff wrote down a bug that hid discrepancies from about 40 branches, that the branches had not been told, that one remedy was for \"Fujitsu ... to manually write an entry value to the local branch account\" with risks of \"tampering\" and of \"changing branch data without informing the branch\", and that the bug bore on \"ongoing legal cases\" (node 6); ten weeks later the Post Office \"categorically\" told the minister there was no remote access (node 8). A second written record followed in 2011 (journalling from branch accounts, privileged access, a second defect; node 9); the Post Office's expert attested to integrity in 2012 and 2013 while, on its own counsel's written reading, he knew of the bugs (nodes 11, 14); in July 2013 its executives told its solicitor that \"some within the organisation had been aware of bugs\", its counsel advised that convicted defendants should have had the bugs disclosed, and its lawyers advised notifying the insurers \"verbally ... so as not to leave a paper trail\" because \"at present there are no systemic\" problems (nodes 13 to 15). In 2014 the Board had in writing that balancing transaction postings did not need the subpostmaster's approval (node 19); in February 2015 the line for Parliament was built in tiers, the capability held back for \"if pushed\" and \"if injection of new transaction\" is raised (node 21); the confidential Reply of April 2015 both denied any \"functionality ... to edit or delete\" and conceded that correction by balancing transaction \"has always been possible\" (node 25); the general counsel in 2016 called the coming position \"a different positioning to the public statements\" (node 27); the July 2013 advice reached the defendants' side only at the appeals (node 30), and the Post Office's disclosure to the inquiry was still \"late and\" \"problematic\" in 2024 (node 31). The thesis reads these as knowledge managed: kept in writing below or around the people who made the public statements, and kept out of disclosure, the public record and the courts by narrow wording, tiered lines, oral assurances and walls on data. **The strongest alternative, stated at once**, is the rival sheet's [rival: good-faith-reliance]: the same documents were written and held below the top, the executives were told by the supplier and by their IT officers that the system was sound and the balancing transaction used once, and what looks like management is a structure that did not carry knowledge upward (the rows that carry it: [hearing-2024-05-22-paula-vennells-day-142 claims 28], [hearing-2024-05-22-paula-vennells-day-142 claims 65], [hearing-2024-05-22-paula-vennells-day-142 claims 561], [hearing-2024-05-22-paula-vennells-day-142 claims 640]; and the Post Office did disclose two bugs to Second Sight, commissioned the Clarke review and had a review of all prosecutions under way by July 2013, [doc-pol00004406-2013-07-08-second-sight-interim-report claims 56], [doc-pol00006357-2013-07-15-clarke-advice-expert-evidence claims 120]). The record decides one thing and leaves the other open: it shows the knowledge in writing inside the Post Office and Fujitsu from 2010 at the latest (2008 on counsel's unnamed documents), and it shows the public and applicant-facing lines narrower than that writing; it does not show, by any held row, that a named author of a public line held a named document that contradicted it, which is the step the thesis needs and the rival denies. The nearest rows to that step are the chief executive's acceptance that the Deloitte briefing of June 2014 was \"written evidence to you and the Board\" of the capability [hearing-2024-05-22-paula-vennells-day-142 claims 594] and her own reading of the addendum's balancing-transaction line as a reminder of \"what I knew from 2014\" [hearing-2024-05-22-paula-vennells-day-142 claims 637]; they bear on what she was told, not on what she believed. Two further limits: the seed's end date (\"until the group litigation forced it out in 2019\") does not fit the held rows, which show the disclosure into the inquiry continuing into 2024 [hearing-2024-04-09-alan-bates-day-117 claims 23] [hearing-2024-04-09-alan-bates-day-117 claims 55]; and the seed's \"kept out of the public record\" holds for the public and Parliament but not for the scheme's applicants, to whom the capability was conceded in writing in April 2015 [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 281].\n\nInherited caveats, declared once and carried by every dependent node: (1) the documents behind the hearing rows are read through counsel and are not held (the addendum POL00117097, the Deloitte briefing POL00030159, the insurers' emails POL00145716, the covert recording, the October 2008 inquiry documents, the Arch file, the WBD note); (2) the 2010 notes name their attendees by function only, and Appendix 1 and Appendix 2 are one source (lead 25); (3) the Davey line's drafter is not named in any held row (lead 41); (4) the judgments are cited as the courts' tellings, a party and never a referee, and no canon paragraph is used here as a row; (5) the Sewell assurances exist only as Vennells's recollection ten years on; (6) the first-utterance register repeats thirteen clusters (FU-1 to FU-13 repeat FU-1 to FU-13, a tool defect being ruled on), and this page cites the lowest ID of each.\n\nWhat the ruling on the first attack moved (revised 2026-10-23; the Revision table below): the 2010 notes, written jointly by Post Office and Fujitsu staff, now count as the Post Office's own line against its later tellings ([doc-pol00004406-2013-07-08-second-sight-interim-report xc 16]: \"so not independent\"), so the gaps they open are the institution's own and weigh less (ledger rows 5, 7, 19); the Reply of April 2015 holds a third line, that no evidence has emerged \"to suggest that a conviction is unsafe\" [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 77], against its own counsel's written advice of July 2013 [doc-pol00006357-2013-07-15-clarke-advice-expert-evidence claims 118] (ledger row 28); and the Reply's telling of the 2010 record (\"inaccurately refer\", [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 280]) now stands at node 6, the page's widest downst er.md and research/timeline-contradictions.md were read for the era in its place and no cluster IDs are cited. Notes read for the original rows (claims, cross-checks, audit): hearing-2024-04-09-alan-bates-day-117, hearing-2024-05-22-paula-vennells-day-142, computer-weekly-2009-05-11-postmasters-tell-their-story, doc-pol00004406-2013-07-08-second-sight-interim-report, doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two, hacker-news-2024-01-16-post-office-software-glitch-thread, the-register-2024-01-17-post-office-boss-keeping-mum-remote-access; registers: research/leads-and-inferences.md (notes.db leads), research/relations-register.md (notes.db relations), research/first-utterance-register.md, research/narrative-rival-good-faith-reliance.md, packs/pilot/seeds/catalysts.md and theses.json", "Rows considered": "122 pack rows (the era's dated timeline rows from 7 notes; the 3 rows dated 1999 are left to the pre-2000 page); 0 clusters (no era page); about 330 claims rows, 30 cross-checks and 12 audit rows read behind them; lanes reassigned on 92 of the 122 rows (the pack put 106 rows in lane D by its fallback rule), 4 rows set aside as off-subject (tables at research/tasks/tool-feedback/pilot-1023/narratives-pilot-1023/sync-2000-2009/parts/lanes.tsv)", "Status": "complete", "Related": "[master timeline](timeline-master.md) (era page not available: research/timeline-consolidated-2000-2009.md); [timeline contradictions](timeline-contradictions.md); [protocol](../tools/narratives.md); [rival sheet](narrative-rival-good-faith-reliance.md); [first-utterance register](first-utterance-register.md)"}, "lanes": "\n**A. The Horizon system (40 rows after reassignment).** The lane carries three strands. First, the branch-level unexplained shortfalls as subpostmasters lived them: Bates at Craig-y-Don from the installation of 2 October 2000 to the £6,000 Giro variance of 13 December 2000, the seven calls to the helpline that day and the 507 calls (85 on Horizon and balancing) recorded to November 2003 [hearing-2024-04-09-alan-bates-day-117 tl 7, tl 11, tl 12, tl 16; hearing-2024-04-09-alan-bates-day-117 claims 123, 127, 129, 131]; Hamilton from October 2003 [computer-weekly-2009-05-11-postmasters-tell-their-story tl 6; computer-weekly-2009-05-11-postmasters-tell-their-story claims 63, 64]; Thomas from 2003 to October 2005 [computer-weekly-2009-05-11-postmasters-tell-their-story tl 4, tl 10, tl 17]; Castleton from January 2004 [computer-weekly-2009-05-11-postmasters-tell-their-story tl 7, tl 8]; Bajaj from 2004 [computer-weekly-2009-05-11-postmasters-tell-their-story tl 11]; Alan Brown's e-mail of January 2006 (one node stopped communicating; a £4 gain and a £13,000 loss on two screens for the same stock unit) [computer-weekly-2009-05-11-postmasters-tell-their-story tl 18; computer-weekly-2009-05-11-postmasters-tell-their-story claims 113 to 117; fu FU-3]; Ford from November 2007 [computer-weekly-2009-05-11-postmasters-tell-their-story tl 25]; and the 2009 branch cases Second Sight later reviewed, SR21's automatic reversals of 4 November 2009 under her own user ID and SR22's Scratch Card corrections [doc-pol00004406-2013-07-08-second-sight-interim-report tl 6, tl 7; doc-pol00004406-2013-07-08-second-sight-interim-report claims 152 to 156, 175 to 179]. These are nine independent roots (each subpostmaster, Brown's e-mail, Second Sight's own review for SR22), all in the subpostmasters' circle bar Second Sight's. Second, the Post Office's line on the system, from Ria MacQueen's letter of 27 August 2003 (\"nothing inherently wrong\") [hearing-2024-04-09-alan-bates-day-117 tl 36; hearing-2024-04-09-alan-bates-day-117 claims 237; fu FU-1 first telling] through Lynn Hobbs's e-mail of about 2008 (\"exonerated in both the civil and criminal courts\") [computer-weekly-2009-05-11-postmasters-tell-their-story tl 30; computer-weekly-2009-05-11-postmasters-tell-their-story claims 128 to 131] to the spokesman of May 2009 (\"an extremely robust system\", no complaints, no IT fault) [computer-weekly-2009-05-11-postmasters-tell-their-story tl 33; computer-weekly-2009-05-11-postmasters-tell-their-story claims 16, 30 to 34], Mike Young's assurance to Vennells the same month [hearing-2024-05-22-paula-vennells-day-142 tl 26; hearing-2024-05-22-paula-vennells-day-142 claims 21] and Alan Cook's reply of 15 October 2009 (\"stable and reliable for many years\") [hearing-2024-05-22-paula-vennells-day-142 tl 29; hearing-2024-05-22-paula-vennells-day-142 claims 360]: several documents, one party. Third, the hidden side, all of it told later: the Bracknell basement visit of 19 August 2008 that the SR05 subpostmaster describes as live branch data altered [doc-pol00004406-2013-07-08-second-sight-interim-report tl 3; doc-pol00004406-2013-07-08-second-sight-interim-report claims 126 to 129; fu FU-12], POL's answer that it was a test environment [doc-pol00004406-2013-07-08-second-sight-interim-report tl 2; doc-pol00004406-2013-07-08-second-sight-interim-report claims 133 to 137; doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two tl 9], counsel's statement that inquiry documents show the Post Office knew a form of remote access was possible \"from at least October 2008\" [hearing-2024-05-22-paula-vennells-day-142 tl 24; hearing-2024-05-22-paula-vennells-day-142 claims 530; lead 154], Vennells's agreement that she had no information on Fujitsu's use of balancing transactions before 2008 [hearing-2024-05-22-paula-vennells-day-142 tl 22; hearing-2024-05-22-paula-vennells-day-142 claims 597], an unnamed inquiry witness, relayed by counsel, calling Fujitsu's ability to inject or amend transactions before 2010 \"the Wild West\", \"completely before 2004, unregulated, unaudited and unauditable\" [hearing-2024-05-22-paula-vennells-day-142 claims 599], the Branch Focus warning of January 2008 (over 1,100 Transaction Corrections worth £744,000 in three months) [doc-pol00004406-2013-07-08-second-sight-interim-report tl 1; doc-pol00004406-2013-07-08-second-sight-interim-report claims 181], and the 2018 defence expert's count of at most 672 bugs over the system's life [hearing-2024-05-22-paula-vennells-day-142 tl 3; hearing-2024-05-22-paula-vennells-day-142 claims 373]. What is absent: no row held from ICL Pathway or Fujitsu dated in the era, no PEAK, no KEL, no SSC record. The supplier's knowledge enters only through the canon by cross-check (Callendar Square \"probably\" present since 2000, known at Fujitsu \"for years\" by February 2006, at least 19 branches) [computer-weekly-2009-05-11-postmasters-tell-their-story cross-check 17; computer-weekly-2009-05-11-postmasters-tell-their-story cross-check 13; lead 13] and through counsel's relays on Day 142.\n\n**B. Prosecutions and civil recovery (9 rows).** The lane holds Hamilton's audit of March 2005 and her prosecution for theft and 14 counts of false accounting, the theft charge dropped on her plea [computer-weekly-2009-05-11-postmasters-tell-their-story tl 12; computer-weekly-2009-05-11-postmasters-tell-their-story claims 70, 71, 73]; Thomas's guilty plea to false accounting and his prison term, which the article gives as 12 weeks and the Court of Appeal as 9 months from 6 November 2006 [computer-weekly-2009-05-11-postmasters-tell-their-story tl 21; computer-weekly-2009-05-11-postmasters-tell-their-story claims 85, 91, 92; computer-weekly-2009-05-11-postmasters-tell-their-story cross-check 25, 26; lead 14]; Castleton's suspension after 12 weeks and the civil claim against him [computer-weekly-2009-05-11-postmasters-tell-their-story tl 9; computer-weekly-2009-05-11-postmasters-tell-their-story claims 54], ending in his bankruptcy in 2007 [computer-weekly-2009-05-11-postmasters-tell-their-story tl 23]; Bajaj's fear in July 2005 that the Post Office would \"prosecute us due to its own mistakes\" [computer-weekly-2009-05-11-postmasters-tell-their-story tl 14; computer-weekly-2009-05-11-postmasters-tell-their-story claims 96]; Ford's 18-week suspension and reinstatement in June 2008 without action [computer-weekly-2009-05-11-postmasters-tell-their-story tl 27, tl 28; computer-weekly-2009-05-11-postmasters-tell-their-story claims 125, 126]; the Post Office Investigation Division of 2007 to 2012, \"up to 100 people\" (counsel, unsourced) [hearing-2024-05-22-paula-vennells-day-142 tl 11; hearing-2024-05-22-paula-vennells-day-142 claims 327]; and the Risk and Compliance Committee minute of 28 March 2008 (year-to-date fraud of £4.6 million in 292 raised cases; £1.6 million recovered against closed cases; two trainee Financial Investigators) [hearing-2024-05-22-paula-vennells-day-142 tl 18, tl 19; hearing-2024-05-22-paula-vennells-day-142 claims 309, 311]. Roots: Hamilton, Thomas, Castleton, Bajaj (each through Thomson; Thomson unsourced for the case outcomes), Beer, the minute POL00021422; the canon (Hamilton [2021] EWCA Crim 577 at [113], [115], [149]) through cross-checks. Pleas were accepted on terms that kept Horizon out of the hearing (Thomas's \"on the basis that he accepted that Horizon was working perfectly\") [computer-weekly-2009-05-11-postmasters-tell-their-story cross-check 28, cross-check 30]. Absent: no held prosecution file, charging decision or investigator's report of the era; Bates was not prosecuted, and his reason is his own inference [computer-weekly-2009-05-11-postmasters-tell-their-story claims 109].\n\n**C. Disclosure and expert evidence (1 row; the claims carry the lane).** The only dated row is a forum poster's unverified 2004 audit \"PO employees omitted parts of\" [hacker-news-2024-01-16-post-office-software-glitch-thread tl 15; lead 183]. Behind the rows: Castleton could not pay an IT expert to look at the logs [computer-weekly-2009-05-11-postmasters-tell-their-story claims 56]; Mark Jenner's report for Thomas's defence said the terminal could not be discounted without examining it and was never used [computer-weekly-2009-05-11-postmasters-tell-their-story claims 87 to 90]; the prosecution's Horizon evidence in Thomas's case was a Jenkins witness statement with ARQ data, a dip sample and a Fujitsu statement on 13 helpdesk calls (canon, Hamilton at [151]) [computer-weekly-2009-05-11-postmasters-tell-their-story cross-check 29]; Hamilton says her case \"did not deal with the issue of IT\" [computer-weekly-2009-05-11-postmasters-tell-their-story claims 72]. The lane's weight in this era is what reached the subpostmaster only later by disclosure: the Loss Authorisation form, the Write Off Authority voucher and the helpline records Bates first saw after the era [hearing-2024-04-09-alan-bates-day-117 claims 159, 165, 167, 129]. Roots: Castleton, Thomas, Hamilton (through Thomson), Bates, the canon. Absent: any disclosure decision of the era, any held expert statement of the era.\n\n**D. The critics and the scheme (26 rows).** The lane is Bates's correspondence from \"Horizon Faults\" of 19 December 2000 to his letters to the NFSP of December 2003 and January 2004 [hearing-2024-04-09-alan-bates-day-117 tl 14, tl 17, tl 18, tl 27, tl 34, tl 35, tl 40, tl 43, tl 45], one root for every row; his NFSP experiences (a subpostmaster escorted out of a Federation meeting in 2002 or 2003; a national executive member trying to stop him speaking) [hearing-2024-04-09-alan-bates-day-117 tl 21, tl 26]; Colin Baker's reply for the NFSP [hearing-2024-04-09-alan-bates-day-117 tl 44]; Computer Weekly's six-month investigation and its article of 11 May 2009, with Bates interviewed [computer-weekly-2009-05-11-postmasters-tell-their-story tl 31, tl 35; hearing-2024-04-09-alan-bates-day-117 tl 47]; the \"Horizon pressure group\" meeting and Michael Rudkin's e-mail to Alan Cook of 15 October 2009 [hearing-2024-05-22-paula-vennells-day-142 tl 25, tl 28]; Bates's 30 to 40 hours a week from 2009 [hearing-2024-04-09-alan-bates-day-117 tl 46]; and six forum posters' retrospective \"20 years\" comments [hacker-news-2024-01-16-post-office-software-glitch-thread tl 10 to tl 13], unsourced. Roots: Bates; Thomson; Rudkin (POL00158368); Colin Baker's letter (POL00215384); the posters (each its own root, unsourced). Absent: Second Sight, the Mediation Scheme and the Working Group (all after 2012); the JFSA forms only at the era's end [hearing-2024-05-22-paula-vennells-day-142 tl 27].\n\n**E. Money and contracts (22 rows).** The make-good regime: Bates carries the £1,041.86 to the suspense account in December 2000 [hearing-2024-04-09-alan-bates-day-117 tl 10, tl 13]; it is written off by letter of 6 March 2002 without a reason given to him, the letter explaining the delay by the need to \"formulate a consistent response to all\" such cases, while the Write Off Authority voucher gives the reason as \"Disputed Horizon Cash Account Shortage\" [computer-weekly-2009-05-11-postmasters-tell-their-story tl 3; hearing-2024-04-09-alan-bates-day-117 tl 23; hearing-2024-04-09-alan-bates-day-117 claims 158 to 164]; the Loss Authorisation, an internal standard form for aged shortages the subpostmaster attributes to a Horizon failure, was used in his case in 2002 to 2003 [hearing-2024-04-09-alan-bates-day-117 tl 19; hearing-2024-04-09-alan-bates-day-117 claims 165 to 169; lead 81]; Mike Wakley's \"Losses and Gains\" letter of 14 April 2003, the breach letter of 2 May and the three months' notice to 5 November 2003 [hearing-2024-04-09-alan-bates-day-117 tl 28, tl 30, tl 32, tl 25, tl 41]; Bates's section 12 reply (not liable for data he cannot check) [hearing-2024-04-09-alan-bates-day-117 tl 31; hearing-2024-04-09-alan-bates-day-117 claims 189 to 192]; Thomas's £6,000 deficit of 2003, half paid by the Post Office [computer-weekly-2009-05-11-postmasters-tell-their-story tl 4; computer-weekly-2009-05-11-postmasters-tell-their-story claims 77]; Ford's savings, wages and bankruptcy [computer-weekly-2009-05-11-postmasters-tell-their-story tl 27, tl 32]; the 2006 to 2009 loss figures of the Risk and Compliance Committee and Banville's costs of double-checking tills since 2008 [hearing-2024-05-22-paula-vennells-day-142 tl 4, tl 10, tl 20, tl 21]. Roots: Bates; the Post Office's own letters and forms (POL00004598, POL00328099); Thomas; Ford (Thomson, unsourced); POL00021422; Banville (POL00117090). Absent: the Fujitsu contract (Vennells was not briefed on it when she joined [hearing-2024-05-22-paula-vennells-day-142 claims 20]); the ICL contract's value appears only in 2024 [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 36].\n\n**F. Government and Parliament (5 rows).** From 2001 Royal Mail, with Post Office Limited, is a plc with the Government as its only shareholder, at arm's length (Ed Davey's reply of 2010, read in 2024: an antecedent the minister invokes) [hearing-2024-04-09-alan-bates-day-117 tl 15; hearing-2024-04-09-alan-bates-day-117 claims 334]; Bates's MP, Betty Williams, raises his case with the Post Office and the Minister after 27 October 2003, and the Post Office tells her it has \"lost confidence\" in him [hearing-2024-04-09-alan-bates-day-117 tl 37, tl 38; hearing-2024-04-09-alan-bates-day-117 claims 203, 204, 256, 257]; a minister's letter of about 2003, which Bates in 2010 calls \"little different\" from Davey's [hearing-2024-04-09-alan-bates-day-117 tl 24; hearing-2024-04-09-alan-bates-day-117 claims 346]; Simon Burns MP writes for Bajaj and is told the Post Office accepts \"very occasional failures\" (undated, before May 2009) [computer-weekly-2009-05-11-postmasters-tell-their-story claims 101, 102; fu FU-6]; a forum poster's retrospective on government [hacker-news-2024-01-16-post-office-software-glitch-thread tl 16]. The catalyst of 2009 (two MPs report constituents' concerns to the minister, who forwards them to POL; Hamilton at [23], packs/pilot/seeds/catalysts.md) is not held as a timeline row. Roots: Bates; Ed Davey's reply; Dave Barrett's letter; Bajaj through Thomson; a poster. Absent: any government document of the era, any select committee, any shareholder executive.\n\n**G. The courts and the inquiry (4 rows).** Castleton's High Court trial of 6 to 13 January 2006 and the judgment of 13 January 2007, the court finding \"the conclusion is inescapable that the Horizon system was working properly in all material respects\" on conditions the article drops [hearing-2024-05-22-paula-vennells-day-142 tl 5, tl 17; hacker-news-2024-01-16-post-office-software-glitch-thread tl 18; computer-weekly-2009-05-11-postmasters-tell-their-story claims 8, 9; computer-weekly-2009-05-11-postmasters-tell-their-story cross-check 9; lead 1, lead 189]; Suzanne Palmer's acquittal by a jury in January 2007 after she blamed Horizon (counsel, unsourced) [hearing-2024-05-22-paula-vennells-day-142 tl 15; hearing-2024-05-22-paula-vennells-day-142 claims 195], with Maureen McKelvey's undated acquittal beside it [hearing-2024-05-22-paula-vennells-day-142 claims 194]. Roots: Beer (dates \"as stated\", unverified), Thomson reading the judgment, a poster's BAILII link, the canon (the Common Issues judgment quoting Castleton at [843] to [848]). The Castleton finding rested on Fujitsu's Anne Chambers, who found \"no evidence whatsoever of any problem with the system\" [computer-weekly-2009-05-11-postmasters-tell-their-story cross-check 12]. Absent: the inquiry (later); any criminal court's own finding on Horizon (the pleas settled it, lane B).\n\n**H. Organisations (11 rows).** The Royal Mail Group plc with Post Office Limited from 2001, Allan Leighton its chairman in 2003 [hearing-2024-04-09-alan-bates-day-117 tl 15; hearing-2024-04-09-alan-bates-day-117 claims 215, 219]; the NFSP's 2002 conference committee on Horizon issues [hearing-2024-04-09-alan-bates-day-117 tl 20; hearing-2024-04-09-alan-bates-day-117 claims 305] and its monthly or quarterly operational reviews with the Post Office's IT, Network and FSC teams \"for over 10 years\" before 2015 [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two tl 8; doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 352]; Vennells's arrival in January 2007, with \"absolutely no corporate memory, alive\" of Horizon's inception [hearing-2024-05-22-paula-vennells-day-142 tl 7, tl 8, tl 9, tl 14, tl 16; hearing-2024-05-22-paula-vennells-day-142 claims 112]; the Risk and Compliance Committee of 28 March 2008 [hearing-2024-05-22-paula-vennells-day-142 tl 23]; a 12-year span of alleged withholding put by counsel [hearing-2024-05-22-paula-vennells-day-142 tl 6]; the JFSA in 2009 [hearing-2024-05-22-paula-vennells-day-142 tl 27]; the \"People's Post Office\" advertising of the early 2000s [hacker-news-2024-01-16-post-office-software-glitch-thread tl 8]. Roots: Bates; POL Limited; Vennells; POL00021422; Beer; a poster. Absent: Fujitsu's own lifecycle (ICL Pathway is named only in Bates's letter of January 2002 [hearing-2024-04-09-alan-bates-day-117 claims 156]), any law firm, any POL legal function.\n\n**Off-subject (4 rows).** [hacker-news-2024-01-16-post-office-software-glitch-thread tl 9], [hacker-news-2024-01-16-post-office-software-glitch-thread tl 14], [hacker-news-2024-01-16-post-office-software-glitch-thread tl 17], [hacker-news-2024-01-16-post-office-software-glitch-thread tl 19] concern technology choices, an Erlang extension, a passport fingerprint reader and the 2008 banking crisis; they are counted and given no lane.\n\n", "windows": [{"window": "2000", "lanes active": "A 8, D 5, E 2, H 1", "what moves": "Horizon installed at Craig-y-Don; the first unexplained variance; seven helpline calls; \"Horizon Faults\" written six days later; the shortfall carried to suspense", "carriers (roots)": "Bates (1 root for 10 rows: statement, letters, oral, CW relay); the WBD note of 2018 (retrospective); forum posters (unsourced)", "rows": "[hearing-2024-04-09-alan-bates-day-117 tl 6 to tl 14]; [computer-weekly-2009-05-11-postmasters-tell-their-story tl 2]; [hearing-2024-05-22-paula-vennells-day-142 tl 3]; [hacker-news-2024-01-16-post-office-software-glitch-thread tl 8, tl 10 to tl 13]", "r n; Thomas's losses resume; Bajaj writes at every misbalance; the NFSP says Horizon works well", "carriers (roots)": "Castleton; Thomas; Bajaj; Colin Baker's letter; POL Limited (2015 Reply on the Forde machine); a poster", "rows": "[computer-weekly-2009-05-11-postmasters-tell-their-story tl 7 to tl 11]; [hearing-2024-04-09-alan-bates-day-117 tl 44, tl 45]; [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two tl 2, tl 3]; [hacker-news-2024-01-16-post-office-software-glitch-thread tl 14 to tl 17]", "reading": "coincident (independent branches, no shared cause stated); civil recovery begins for Castleton"}, {"window": "2005", "lanes active": "A 4, B 2, D 1, H 1", "what moves": "Hamilton audited at £36,000 and prosecuted; Bajaj consults a solicitor; Thomas's losses stop at about £50,000", "carriers (roots)": "Hamilton; Bajaj; Thomas (through Thomson); POL Limited (2015 Reply context)", "rows": "[computer-weekly-2009-05-11-postmasters-tell-their-story tl 12, tl 14, tl 17]; [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two tl 4 to tl 8]", "reading": "coincident; in each branch prosecution or the fear of it follows the shortfall"}, {"window": "2006", "lanes active": "A 1, E 1, G 1", "what moves": "Castleton's trial in January; Alan Brown's Callendar Square e-mail the same month, given to Castleton for his case; Thomas sentenced in November (canon)", "carriers (roots)": "Beer (dates as stated); Brown's e-mail; POL00021422", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 4, tl 5]; [computer-weekly-2009-05-11-postmasters-tell-their-story tl 18]; [computer-weekly-2009-05-11-postmasters-tell-their-story cross-check 25]", "reading": "causal by custody (Brown gives Castleton the e-mail, relation 25); the canon puts Fujitsu's knowledge of Callendar Square in the same quarter [computer-weekly-2009-05-11-postmasters-tell-their-story cross-check 13]"}, {"window": "2007", "lanes active": "A 3, B 3, D 1, E 1, G 3, H 6", "what moves": "the Castleton judgment and on; Bates; the spokesman; Mike Young (through Vennells); Rudkin and Cook (POL00158368); Second Sight; the SR21 subpostmaster; POL's SR21 response; Ford", "rows": "[computer-weekly-2009-05-11-postmasters-tell-their-story tl 32 to tl 35]; [hearing-2024-04-09-alan-bates-day-117 tl 46, tl 47]; [hearing-2024-05-22-paula-vennells-day-142 tl 25 to tl 29]; [doc-pol00004406-2013-07-08-second-sight-interim-report tl 4 to tl 7]", "reading": "causal (the article, then Rudkin's e-mail, then Cook's chain to Vennells [hearing-2024-05-22-paula-vennells-day-142 claims 357 to 363]); the branch anomalies coincident"}], "co": [{"#": "1", "window(s)": "2008 to 2009", "lanes": "A, D, H, E", "what moves together": "The first public telling and the Post Office's uniform line meet. Computer Weekly's six-month investigation and its article of 11 May 2009, with Bates's call for a public inquiry, and the JFSA's formation (D, H), are met by one line at three levels: the spokesman (no complaints received, no IT fault possible, \"an extremely robust system\"), the Operations Director to Vennells (the magazine \"didn't know what it was talking about\"), and the Managing Director in October (\"stable and reliable for many years\", subpostmasters \"with their hand in till\" blaming technology), while Cook's same e-mail records \"a steadily building nervousness about the accuracy of the Horizon system\" and the chain goes to Vennells (A). In the same months the Post Office's own branch data record the anomalies Second Sight later reviewed: conformance instructions on same-day stock adjustments, £147,000 of Scratch Card losses at 20 audited branches, SR21's automatic reversals and SR22's corrections (A, E)", "independent roots": "11 as flagged (Thomson; Bates; the spokesman; Mike Young through Vennells; Cook and Rudkin, POL00158368; the senior NFSP official, unnamed; Second Sight's own review; the SR21 subpostmaster; POL's SR21 response; POL's Scratch Card telling); 5 after circle collapse (press, subpostmasters, the Post Office, the NFSP, the investigators)", "rows": "[computer-weekly-2009-05-11-postmasters-tell-their-story tl 31, tl 33, tl 34, tl 35]; [computer-weekly-2009-05-11-postmasters-tell-their-story claims 16, 28, 30 to 34, 40, 41]; [hearing-2024-04-09-alan-bates-day-117 tl 47]; [hearing-2024-05-22-paula-vennells-day-142 tl 25 to tl 29]; [hearing-2024-05-22-paula-vennells-day-142 claims 21, 22, 356 to 363]; [doc-pol00004406-2013-07-08-second-sight-interim-report tl 4 to tl 7]; [doc-pol00004406-2013-07-08-second-sight-interim-report claims 152 to 156, 165, 175 to 179, 191]", "reading": "causal (the article produces the Rudkin e-mail and Cook's chain to Vennells); the branch anomalies are coincident in time and told only in 2013", "bears on seeds": "managed-knowledge (a uniform denial while the organisation records nervousness and branch anomalies); good-faith-reliance (the line is belief stated as fact by people who say they were assured: Young to Vennells, Cook's \"instincts\")"}, {"#": "2", "window(s)": "2004 to 2007", "lanes": "A, B, G, C", "what moves together": "The courts' findings on Horizon are made on the supplier's evidence while the supplier knows of a bug. Castleton's 12 weeks of deficits in 2004, his suspension and the civil claim (A, B) end in the judgment of January 2007 that Horizon was working properly, a finding resting on Fujitsu's Anne Chambers (\"no evidence whatsoever of any problem\") (G); in January 2006, the month of the trial, Alan Brown's Callendar Square e-mail describes a node that \"stopped communicating\" and is given to Castleton for his case, and the canon finds that by February 2006 Chambers and others at Fujitsu knew the Callendar Square bug \"had been around for years\" (A, C). In the criminal cases of the same years the pleas are accepted on terms that keep Horizon out: Thomas's \"on the basis that he accepted that Horizon was working perfectly\", Hamilton unable to plead that the computer was at fault, Jenner's terminal caveat never used (B, C); a jury acquits Palmer in January 2007 after she blames Horizon (G)", "independent roots": "9 as flagged (Castleton; Thomas; Hamilton; Brown's e-mail; Jenner's report; Palmer through Beer; the Castleton judgment through the Common Issues judgment; the Hamilton judgment; the Horizon Issues judgment); 4 after circle collapse (subpostmasters, the courts, inquiry counsel, the press)", "rows": "[computer-weekly-2009-05-11-postmasters-tell-their-story tl 7, tl 8, tl 9, tl 12, tl 18, tl 21, tl 23]; [computer-weekly-2009-05-11-postmasters-tell-their-story claims 8, 9, 56, 72, 85 to 91, 113 to 117]; [computer-weekly-2009-05-11-postmasters-tell-their-story cross-check 9, 12, 13, 17, 25, 28, 29, 30]; [hearing-2024-05-22-paula-vennells-day-142 tl 5, tl 15, tl 17]; [hearing-2024-05-22-paula-vennells-day-142 claims 195]; [hacker-news-2024-01-16-post-office-software-glitch-thread tl 18]", "reading": "causal by custody (Brown to Castleton, relation 25; the 2007 finding becomes the Post Office's \"exonerated\" line by about 2008, co-movement 5); the supplier's knowledge and the court's finding coincide in the quarter", "bears on seeds": "managed-knowledge (knowledge at Fujitsu, court told otherwise); good-faith-reliance (the Post Office's executives could cite a court finding and pleas: the external validation the rival rests on)"}, {"#": "3", "window(s)": "2000 to 2009", "lanes": "H, D, A", "what moves together": "The NFSP channel. The Federation's local secretary tells Bates in December 2000 that others \"around the country\" have the same problems; its 2002 conference sets up a committee on Horizon issues; its executives escort out a subpostmaster who raises Horizon problems and try to stop Bates speaking; its General Secretary writes about 2004 that it knew of \"some disputes\" from migration but that Horizon \"works well and there are no real problems\"; it runs operational reviews with the Post Office's IT, Network and FSC teams monthly or quarterly for \"over 10 years\"; it refuses to help Castleton and Thomas; in 2009 it declines to comment while a senior official tells the press, unnamed, that in the Post Office \"it's heresy to say something can go wrong\"; and a \"very senior postmaster in the Fed\" e-mails the Managing Director about the pressure group in October 2009", "independent roots": "8 as flagged (Bates; Dave Foster through Bates collapses to Bates, so not counted; Colin Baker's letter; POL Limited's 2015 Reply; Thomson; the senior NFSP official, unnamed; Rudkin's e-mail; Castleton; Thomas); 4 after circle collapse (subpostmasters, the NFSP, the Post Office, the press)", "rows": "[hearing-2024-04-09-alan-bates-day-117 tl 20, tl 21, tl 26, tl 43, tl 44]; [hearing-2024-04-09-alan-bates-day-117 claims 143, 150, 298 to 309]; [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two tl 8]; [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 352]; [computer-weekly-2009-05-11-postmasters-tell-their-story tl 34]; [computer-weekly-2009-05-11-postmasters-tell-their-story claims 29, 35, 40, 41, 53, 81]; [hearing-2024-05-22-paula-vennells-day-142 tl 28]; [hearing-2024-05-22-paula-vennells-day-142 claims 357, 362]", "reading": "causal reading available but not held: the body that collected members' Horizon complaints had a standing channel to the Post Office's IT function, and told members there were no real problems (no row records what the committee or the reviews passed on: lead 84, lead returned 9)", "bears on seeds": "managed-knowledge (a second institutional holder of the pattern, with a channel to IT); good-faith-reliance (the representative body itself reported no real problems, so the Post Office heard reassurance from the subpostmasters' side)"}, {"#": "4", "window(s)": "2000 to 2009", "lanes": "A, E, D, F", "what moves together": "The pattern was known below the top. In writing or in speech recorded later, the Post Office's own staff and channels register Horizon-attributed losses as a class: the 6 March 2002 write-off explained by the need for \"a consistent response to all\" such cases, the voucher's \"Disputed Horizon Cash Account Shortage\", a standard Loss Authorisation form for shortages attributed to \"Horizon system/software/equipment/training failure\", the Retail Network Manager overheard calling it \"another one of the Horizon losses\", Bates's 2003 statement that rolling over was known to \"many other\" staff, the reply to Simon Burns MP accepting \"very occasional failures\", Hobbs's \"previous challenges in relation to the integrity of the system\", Banville's 2007 to 2012 question whether management \"knew of many offices in a similar position\"; against which stand the public denials of complaints and faults (co-movement 1)", "independent roots": "8 as flagged (Bates; the 6 March 2002 letter and voucher; POL00328099; the helpline records; the reply to Burns; Hobbs's e-mail; Banville's texts, POL00117090 and POL00355692; Colin Baker's letter); 3 after circle collapse (subpostmasters, the Post Office, the NFSP)", "rows": "[hearing-2024-04-09-alan-bates-day-117 tl 16, tl 19, tl 23, tl 29]; [hearing-2024-04-09-alan-bates-day-117 claims 129, 158 to 170, 178, 182, 303]; [computer-weekly-2009-05-11-postmasters-tell-their-story tl 3, tl 30]; [computer-weekly-2009-05-11-postmasters-tell-their-story claims 102, 105, 128]; [hearing-2024-05-22-paula-vennells-day-142 tl 12, tl 21]; [hearing-2024-05-22-paula-vennells-day-142 claims 409, 500]", "reading": "the same story told across channels (one class of event seen by many holders); not a single causal chain; the holders are local and operational, not the board", "bears on seeds": "managed-knowledge (written records of Horizon-attributed losses as a class by 2002); good-faith-reliance (every record is of the subpostmaster's attribution, not the Post Office's acceptance; the knowledge sits with field staff, the rival's \"junior staff\")"}, {"#": "5", "window(s)": "2003 to 2009", "lanes": "E, A, B", "what moves together": "The make-good regime runs beside inaccessible data. Each subpostmaster is required to make good shortfalls he or she cannot trace: Bates under section 12 (he will not be liable for data he cannot check; \"if Horizon said I owed £1 million\"), Thomas paying half of £6,000, Hamilton repaying from her wages and remortgaging, Castleton pursued for about £25,800 with £321,000 in costs, Bajaj paying £11,203, Ford paying her savings and having her wages docked; MacQueen restates the contract (\"postmasters must make good losses\") and Hobbs suggests training and personnel; the subpostmasters' common complaint is the lack of data to check the figure (Bates's \"visibility of transactions\", Hamilton's \"I couldn't get it to come up any different\", Bajaj's shortage reappearing within a week)", "independent roots": "8 as flagged (Bates; Thomas; Hamilton; Castleton; Bajaj; Ford; the Post Office's letters, Wakley and MacQueen; Thomson for the unsourced rows); 3 after circle collapse (subpostmasters, the Post Office, the press)", "rows": "[hearing-2024-04-09-alan-bates-day-117 tl 28 to tl 32, tl 41]; [hearing-2024-04-09-alan-bates-day-117 claims 116, 120, 184, 189 to 192, 240]; [computer-weekly-2009-05-11-postmasters-tell-their-story tl 4, tl 9, tl 23, tl 27, tl 32]; [computer-weekly-2009-05-11-postmasters-tell-their-story claims 3, 10, 21, 59, 61, 64, 65, 74, 77, 93, 98, 125, 131]; [computer-weekly-2009-05-11-postmasters-tell-their-story cross-check 10]", "reading": "causal (the contract places the loss on the branch; the data to contest it are on the other side)", "bears on seeds": "managed-knowledge (liability held where the evidence of cause was not shared); good-faith-reliance (the contract was applied as written, a failure of structure)"}, {"#": "6", "window(s)": "2008", "lanes": "A, D (with C told later)", "what moves together": "Remote access in 2008. On 19 August 2008 the SR05 subpostmaster, on a visit to Fujitsu's Bracknell basement, s -09-alan-bates-day-117 claims 228, 291, 293]", "roots": "Bates"}, {"body": "Craig-y-Don post office (Bates's contract)", "event": "contract ended on three months' notice", "window": "2003-11-05", "rows": "[hearing-2024-04-09-alan-bates-day-117 tl 41, tl 39; hearing-2024-04-09-alan-bates-day-117 claims 194, 315]", "roots": "Bates; the termination notice (POL00004598)"}, {"body": "Post Office (Paula Vennells)", "event": "Vennells joins in January 2007; Network Director by 28 March 2008; Managing Director from October 2010 (outside the era)", "window": "2007-01 to 2008-03", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 14, tl 16, tl 23; hearing-2024-05-22-paula-vennells-day-142 claims 289, 306]", "roots": "Vennells"}, {"body": "Post Office Investigation Division", "event": "in operation, \"up to 100 people\" conducting criminal investigations (span 2007 to 2012)", "window": "2007", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 11; hearing-2024-05-22-paula-vennells-day-142 claims 327]", "roots": "Beer (unsourced)"}, {"body": "Risk and Compliance Committee", "event": "meets on 28 March 2008, Vennells a member as Network Director", "window": "2008-03-28", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 23; hearing-2024-05-22-paula-vennells-day-142 claims 306]", "roots": "POL00021422"}, {"body": "Security Team (Fraud Strand)", "event": "restructured toward \"proactive fraud initiatives\"; two trainee Financial Investigators; the 2008/09 Crown loss initiative", "window": "2008", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 20; hearing-2024-05-22-paula-vennells-day-142 claims 309, 311, 312]", "roots": "POL00021422 (John Scott's minuted report)"}, {"body": "Fujitsu, Bracknell basement test environment", "event": "holds a Horizon test environment with four test versions (POL's telling); Post Office teams working in Fujitsu's Bracknell office in 2011 \"and possibly earlier\"", "window": "2008-08", "rows": "[doc-pol00004406-2013-07-08-second-sight-interim-report tl 2; doc-pol00004406-2013-07-08-second-sight-interim-report claims 133, 143]", "roots": "POL's SR05 response; POL e-mail records of 2011 (through Second Sight)"}, {"body": "Royal Mail Group (communications)", "event": "Mary Fagan Group Communications Director", "window": "2009-10", "rows": "[hearing-2024-05-22-paula-vennells-day-142 claims 358]", "roots": "Vennells"}, {"body": "Post Office (operations)", "event": "Mike Young \"the then Operations Director\"", "window": "2009-05", "rows": "[hearing-2024-05-22-paula-vennells-day-142 claims 21]", "roots": "Vennells"}, {"body": "JFSA (Justice for Subpostmasters Alliance)", "event": "formed, after the Computer Weekly article, complaints starting to come in", "window": "2009", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 27; hearing-2024-05-22-paula-vennells-day-142 claims 356; hearing-2024-04-09-alan-bates-day-117 claims 90]", "roots": "Beer (unsourced); Bates"}, {"body": "the \"Horizon pressure group\"", "event": "to meet at Fenny Compton Hall", "window": "2009", "rows": "[hearing-2024-05-22-paula-vennells-day-142 tl 25; hearing-2024-05-22-paula-vennells-day-142 claims 357]", "roots": "POL00158368 (Rudkin's e-mail)"}], "builders": "\n### managed-knowledge\n\nThe seed's thesis begins \"from 2010 at the latest\", so this era is its antecedent: what the era offers is the depth of the record before the written bug and access documents of 2010 (FU-9).\n\nFor. (a) Written records of Horizon-attributed losses as a class by 2002 to 2003: the 6 March 2002 \"consistent response to all\" such cases, the voucher's \"Disputed Horizon Cash Account Shortage\", the standard Loss Authorisation form [hearing-2024-04-09-alan-bates-day-117 claims 159, 160, 166; co-movements 4 and 7]. (b) The first written denial of a fault to a subpostmaster in 2003, resting on a review of which no record is held [hearing-2024-04-09-alan-bates-day-117 claims 237, 238; contradiction 4; FU-1]. (c) The supplier's knowledge of the Callendar Square bug by February 2006, in the quarter of the Castleton trial, against the finding that Horizon was working properly [computer-weekly-2009-05-11-postmasters-tell-their-story cross-check 13, cross-check 17; co-movement 2]. (d) Pleas accepted on terms that kept Horizon out of the criminal hearings [computer-weekly-2009-05-11-postmasters-tell-their-story cross-check 28, cross-check 30; signal 8]. (e) Hobbs's \"exonerated\" line about 2008, outrunning the record [computer-weekly-2009-05-11-postmasters-tell-their-story claims 129; contradiction 3]. (f) Knowledge of a form of remote access \"from at least October 2008\" in inquiry documents, two months after the Bracknell visit [hearing-2024-05-22-paula-vennells-day-142 claims 530; doc-pol00004406-2013-07-08-second-sight-interim-report claims 126; co-movement 6; contradiction 6]. (g) The uniform 2009 denial at three levels while the Managing Director records nervousness and the branch data record anomalies [co-movement 1; contradictions 1, 2]. (h) The record wall: the era's central-access records reported unavailable by four routes [signal 7].\n\nAgainst. (a) The records of 2002 to 2003 are of the subpostmaster's attribution, filed under its own heading, not of the Post Office accepting a fault [hearing-2024-04-09-alan-bates-day-117 claims 166, 169]. (b) The Callendar Square knowledge is Fujitsu's; no held row shows it reaching the Post Office in the era [computer-weekly-2009-05-11-postmasters-tell-their-story cross-check 17; signal 13]. (c) The October 2008 documents are not held; counsel's statement is a relay [hearing-2024-05-22-paula-vennells-day-142 claims 530; lead 154]. (d) The Bracknell account is one witness against the Post Office's test-environment account; the agency rule keeps his row standing but does not make it corroborated [contradiction 5]. (e) The \"Wild West\" is an unnamed witness through counsel [hearing-2024-05-22-paula-vennells-day-142 claims 599]. (f) The Castleton judgment gave the Post Office an external finding to rely on [computer-weekly-2009-05-11-postmasters-tell-their-story claims 8, 9].\n\nNodes to take (by row): [hearing-2024-04-09-alan-bates-day-117 claims 160, 166] (2002 write-off and form); [hearing-2024-04-09-alan-bates-day-117 claims 237] (2003 denial); [computer-weekly-2009-05-11-postmasters-tell-their-story cross-check 13, cross-check 17] (Callendar Square at Fujitsu, 2006); [computer-weekly-2009-05-11-postmasters-tell-their-story cross-check 28] (Thomas's plea basis); [computer-weekly-2009-05-11-postmasters-tell-their-story claims 128, 129] (Hobbs); [doc-pol00004406-2013-07-08-second-sight-interim-report claims 126, 129] (Bracknell); [hearing-2024-05-22-paula-vennells-day-142 claims 530] (October 2008); [computer-weekly-2009-05-11-postmasters-tell-their-story claims 16, 30 to 33] and [hearing-2024-05-22-paula-vennells-day-142 claims 359 to 361] (2009 line and nervousness).\n\nContradictions the builder must take a side on: 2 (did the Callendar Square knowledge reach the Post Office before the 2009 denial: the seed needs yes); 5 (Bracknell: live or test); 6 (the reassurances against the October 2008 documents); 1 (the denial of complaints against the office's own records); 3 and 4 (the \"exonerated\" and \"reviewed and interrogated\" lines as messaging or error).\n\n### good-faith-reliance\n\nThe rival [rival: good-faith-reliance] finds its strongest era material here, since the knowledge of the era is shown at the branch, the field and the supplier, and the executives' accounts are of not being told.\n\nFor. (a) Vennells joins in January 2007 with no corporate memory of Horizon's inception, no briefing on the Fujitsu contract and no one telling her of bugs or allegations [hearing-2024-05-22-paula-vennells-day-142 claims 19, 20, 112, 113]; the Operations Director assures her in May 2009 that Computer Weekly \"didn't know what it was talking about\" [hearing-2024-05-22-paula-vennells-day-142 claims 21; contradiction 18]. (b) The external validations of the era all point one way: the Castleton judgment [computer-weekly-2009-05-11-postmasters-tell-their-story claims 8, 9], Chambers's evidence of no problem [computer-weekly-2009-05-11-postmasters-tell-their-story cross-check 12], the pleas [computer-weekly-2009-05-11-postmasters-tell-their-story cross-check 28], the NFSP's \"works well and there are no real problems\" [hearing-2024-04-09-alan-bates-day-117 claims 304; co-movement 3], Jenner's reasoning that a flawed system would show issues at all 14,000 branches [computer-weekly-2009-05-11-postmasters-tell-their-story claims 88], Thomson's own \"None of the postmasters have firm evidence that IT was to blame\" [computer-weekly-2009-05-11-postmasters-tell-their-story claims 36], and Wise's view that the handling, not glitches, may be the problem [computer-weekly-2009-05-11-postmasters-tell-their-story claims 47, 48]. (c) Cook's line is framed as belief (\"My instincts tell\") [hearing-2024-05-22-paula-vennells-day-142 claims 361]. (d) The reply to Burns accepts \"very occasional failures\", consistent with an honest belief that faults were rare [computer-weekly-2009-05-11-postmasters-tell-their-story claims 102]. (e) The field records name the subpostmaster's attribution, not the Post Office's acceptance [hearing-2024-04-09-alan-bates-day-117 claims 166].\n\nAgainst. (a) The 6 March 2002 letter's \"consistent response to all\" such cases implies a policy-level handling of Horizon disputes, above the branch [hearing-2024-04-09-alan-bates-day-117 claims 160]. (b) The Risk and Compliance Committee's 2008 papers put investigation and recovery figures before the Network Director [hearing-2024-05-22-paula-vennells-day-142 claims 309, 311; contradiction 8]. (c) Hobbs, in Vennells's line of report, wrote of \"previous challenges\" to the system's integrity about 2008 [computer-weekly-2009-05-11-postmasters-tell-their-story claims 128; lead 167]. (d) Cook's e-mail recording \"a steadily building nervousness\" went to Vennells in October 2009 [hearing-2024-05-22-paula-vennells-day-142 claims 359, 363]. (e) The 2009 denial of complaints stands against the Post Office's own helpline and write-off records [contradiction 1]: the rival must place that as a press office's error.\n\nNodes to take (by row): [hearing-2024-05-22-paula-vennells-day-142 claims 19, 21, 112]; [computer-weekly-2009-05-11-postmasters-tell-their-story claims 8, 9]; [computer-weekly-2009-05-11-postmasters-tell-their-story cross-check 12]; [hearing-2024-04-09-alan-bates-day-117 claims 304]; [computer-weekly-2009-05-11-postmasters-tell-their-story claims 88, 102]; [hearing-2024-05-22-paula-vennells-day-142 claims 361].\n\nContradictions the builder must take a side on: 18 (not told, while the organisation knew: the rival's own node); 8 (what the 2008 committee papers put before her); 2 (the rival needs the Callendar Square knowledge to have stayed at Fujitsu); 1 (the 2009 denial as an uninformed press line); 3 (Hobbs's line as her own gloss, not central messaging).\n\n", "words": 14931}, {"id": "narrative-synchrony-2010-2014", "era": "2010-2014 (2010 to 2014: Horizon Online, Second Sight, the scheme); windows by year (quarters start in 2019, after this era)", "title": "Synchrony 2010 to 2014 (Horizon Online, Second Sight, the scheme)", "meta": {"Kind": "narrative-synchrony", "Era": "2010-2014 (2010 to 2014: Horizon Online, Second Sight, the scheme); windows by year (quarters start in 2019, after this era)", "Built": "2026-10-23", "Author": "sync-2010-2014 (run pilot-1023, the narrative step of the pilot)", "Sources": "the run's narrative pack (research/tasks/tool-feedback/pilot-1023/narratives-pilot-1023/pack/, built 2026-10-23 from notes.db: synchrony/2010-2014.md, synchrony-index.md, contradictions.md, speakers.md, signals.md, seeds.md); the era page was not available: this project has no consolidated era pages (research/timeline-consolidated-2010-2014.md is agent-written and not part of this run), so [research/timeline-master.md](timeline-master.md) and [research/timeline-contradictions.md](timeline-contradictions.md) were read for the era in its place and no cluster IDs are cited; notes read for the original rows: [doc-pol00028838-2010-09-29-receipts-payments-mismatch-notes](../books/doc-pol00028838-2010-09-29-receipts-payments-mismatch-notes.md), [doc-pol00004406-2013-07-08-second-sight-interim-report](../books/doc-pol00004406-2013-07-08-second-sight-interim-report.md), [doc-pol00006357-2013-07-15-clarke-advice-expert-evidence](../books/doc-pol00006357-2013-07-15-clarke-advice-expert-evidence.md), [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two](../books/doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two.md), [hearing-2024-04-09-alan-bates-day-117](../videos/hearing-2024-04-09-alan-bates-day-117.md), [hearing-2024-05-22-paula-vennells-day-142](../videos/hearing-2024-05-22-paula-vennells-day-142.md), [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access](../books/the-register-2024-01-17-post-office-boss-keeping-mum-remote-access.md); registers: [leads](leads-and-inferences.md), [relations](relations-register.md), [first-utterance register](first-utterance-register.md), packs/pilot/codebook/argot.md, packs/pilot/seeds/catalysts.md; canon: Common Issues [2019] EWHC 606 (QB) at [37] to [42] (sources/pilot/canon/bates-no3-common-issues/paragraphs.txt:600 to 690)", "Rows considered": "261: the pack's 252 dated rows of 2010 to 2014 (2010: 66, 2011: 19, 2012: 46, 2013: 88, 2014: 33), every one read, plus 9 rows the pack skipped as undated that their notes place in the era by context (doc-pol00004406 tl 34, 35; doc-pol00004432 tl 41, 48; hearing-2024-04-09-alan-bates-day-117 tl 160; hearing-2024-05-22-paula-vennells-day-142 tl 171, 174 to 178); 0 era-page clusters (no era page); 74 of the pack's 96 contradiction nodes fall in the era or have an era row on one side (grouped into 22 of this page's 30 contradiction rows; the other 22 nodes belong to 2009 or earlier, 2015 and after, or 2024)", "Status": "complete", "Related": "era page: not available in this project (research/timeline-consolidated-2010-2014.md not built); [timeline contradictions](timeline-contradictions.md); [master timeline](timeline-master.md); [rival sheet: good-faith reliance](narrative-rival-good-faith-reliance.md); tools/narratives.md (sections 1, 3, 5a, 6, 8); lane reassignments: research/tasks/tool-feedback/pilot-1023/narratives-pilot-1023/sync-2010-2014/lane-assignments.tsv"}, "lanes": "\n**A, the Horizon system (88 rows, the era's largest lane once reassigned).** The lane opens with Horizon Online: go live from March 2010 [hearing-2024-05-22-paula-vennells-day-142 tl 37], rollout completed that year [hearing-2024-05-22-paula-vennells-day-142 tl 33], and within months the Receipts and Payments Mismatch, recorded in writing by Post Office and Fujitsu staff in late September 2010 (about 40 branches, about £20k, began in May, branches not told, three correction options of which the first has Fujitsu \"manually write an entry value to the local branch account\") [doc-pol00028838-2010-09-29-receipts-payments-mismatch-notes tl 1, 2, 5; claims 5, 25, 27, 28] [fu FU-7, FU-8, FU-9]. Twenty-three of the 2010 A rows are that one document's actions and plans (fix into test from 4 October, roll-out by 21 October) [doc-pol00028838-2010-09-29-receipts-payments-mismatch-notes tl 10 to 25]: one root, the Appendix 1 meeting with Jenkins's Appendix 2, which lead 25 shows are not independent of each other. The same bug comes back through Post Office's own later tellings (62 branches, £9,029, no subpostmaster out of pocket, discovered in September 2010 by Fujitsu's monitoring) [doc-pol00004406-2013-07-08-second-sight-interim-report tl 11] and (a \"small number\" of pilot branches, one balancing transaction) [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two tl 11, 12]: those are Post Office's root, relayed by Second Sight and by Clarke [doc-pol00006357-2013-07-15-clarke-advice-expert-evidence tl 3, 4]. 2011 adds the Local Suspense defect (14 branches) [doc-pol00004406-2013-07-08-second-sight-interim-report tl 14] [fu FU-13], the April 2011 email that \"it is possible to journal from branch cash accounts\" [doc-pol00004406-2013-07-08-second-sight-interim-report tl 16; claims 144] [fu FU-11], Post Office teams at Fujitsu's Bracknell office [doc-pol00004406-2013-07-08-second-sight-interim-report tl 15] and Ernst & Young's management letter on \"inappropriate system privileges assigned to the APPSUP role and SYSTEM_MANAGER role\" [hearing-2024-05-22-paula-vennells-day-142 tl 47; claims 544]. 2012 and early 2013 hold the Local Suspense defect's recurrence and write-off [doc-pol00004406-2013-07-08-second-sight-interim-report tl 19, 20], the Lepton reversal issue the ARQ logs do not distinguish [doc-pol00006357-2013-07-15-clarke-advice-expert-evidence tl 13], B14 and the planned systems change of 8 October 2013 [doc-pol00006357-2013-07-15-clarke-advice-expert-evidence tl 18, 20, 35, 39] [fu FU-56], the Detica report that Post Office systems are not fit for purpose [hearing-2024-05-22-paula-vennells-day-142 tl 87] and, in 2014, the Deloitte desktop review and draft Board briefing with its balancing-transaction caveat and Lesley Sewell's assurance that the balancing transaction was \"an emergency measure\", used once, \"not about remote access\" [hearing-2024-05-22-paula-vennells-day-142 tl 101, 106, 108 to 110; claims 561]. Roots after collapse: the 2010 notes (one), Post Office's corporate telling (one, which lead 42 and lead 55 suggest may itself rest on Jenkins), Second Sight's own branch reviews (one), the unnamed April 2011 sender (one, unnamed), Ernst & Young (one), Detica (one), Deloitte (one, partly Fujitsu's assertions by rel 242 and [hearing-2024-05-22-paula-vennells-day-142 tl 35]), Sewell through Vennells (one, undocumented by Vennells's own account, claims 559), and Rose's draft report (one): nine. Absent: any Fujitsu SSC record of the era (no PEAK, KEL or ARQ is held; leads 21, 62, 174), any Fujitsu witness but Jenkins, and any row of the era in which a branch is told of a central correction.\n\n**B, prosecutions and civil recovery (22 rows plus 6 undated).** The lane is thin and mostly told in 2024: the Misra case's publicity of 2010 [hearing-2024-05-22-paula-vennells-day-142 tl 31], the SR22 suspension of September 2010 and her later conviction [doc-pol00004406-2013-07-08-second-sight-interim-report tl 12, 34], the General Counsel telling the Board in January 2012 that every prosecution was won [hearing-2024-05-22-paula-vennells-day-142 tl 57, 58], Nichola Arch's acquittal of April 2012 [hearing-2024-05-22-paula-vennells-day-142 tl 62], Vennells's learning in 2012 that Post Office ran its own prosecutions [hearing-2024-05-22-paula-vennells-day-142 tl 53 to 55], the review of all prosecutions \"presently underway\" in July 2013 [doc-pol00006357-2013-07-15-clarke-advice-expert-evidence tl 37] [fu FU-54], Altman's criticism of pre-2012/13 prosecution documentation [hearing-2024-05-22-paula-vennells-day-142 tl 65], the Griffiths case (his suicide attempt on 23 September 2013 and death on 11 October) [hearing-2024-05-22-paula-vennells-day-142 tl 83 to 86, 90 to 93, 174 to 177] and, by 2014, \"We had stop prosecutions\" [hearing-2024-05-22-paula-vennells-day-142 tl 98; claims 354] beside Bates's April 2014 letter that Post Office keeps prosecuting [hearing-2024-04-09-alan-bates-day-117 tl 97]. Roots: Vennells (one), Beer reading inquiry documents (the documents, unnamed in several rows), Clarke (one), Second Sight (one), the Griffiths email chains POL00116133 and POL00027757 (Post Office staff, one). Absent: any court record of an era prosecution (no case file, no judgment of 2010 to 2014 is held; the Hamilton appeal is the court's later telling), and civil recovery outside Griffiths and Griffithstown.\n\n**C, disclosure and expert evidence (29 rows  Security's instructions to shred documents, unseen by Vennells until 2021 [hearing-2024-05-22-paula-vennells-day-142 tl 77; claims 31]", "near the wall (rows)": "the weekly hub call's minutes reported destroyed (lead 56, from Hamilton at [88]); the hub \"set up as a result of Simon Clarke's advice\", which she says she never saw [hearing-2024-05-22-paula-vennells-day-142 tl 68]", "reading": "a reported instruction to destroy records in the weeks after the advice; held only as a later telling of a document (lead 127); never a finding of destruction"}, {"#": "11", "carrier": "Sewell (through Vennells)", "window": "2014", "wall (rows, ground)": "\"very difficult, if not impossible, to get the data\", under \"data retention policies\" or \"because it simply wasn't there any longer\" [hearing-2024-05-22-paula-vennells-day-142 claims 598]", "near the wall (rows)": "Vennells now: \"it didn't need to be made, did it, because, as you say, the information was there\" [claims 602]; \"I don't know whether my CIO at the time knew they existed\" [claims 600]", "reading": "the CEO's own present reading turns the 2014 wall around; with the ARQ allowance [hearing-2024-04-09-alan-bates-day-117 tl 71] it is contradiction 30; the signal is the repeated data ground, across investigator and Board"}, {"#": "12", "carrier": "Vennells", "window": "2014", "wall (rows, ground)": "the assurance undocumented: \"isn't documented\", \"from your recollection 10 years on\": \"Yes\" [hearing-2024-05-22-paula-vennells-day-142 claims 559]; \"I'm not sure that I would have documented my conversation\" [claims 567]", "near the wall (rows)": "\"I find it puzzling because it was discussed at a Board meeting very briefly\" [claims 565]; she went back \"to check that we had got it documented\" [claims 570]", "reading": "the good-faith rival's key node (contradiction 20) rests on a conversation with no record; the speaker herself marks the gap"}, {"#": "13", "carrier": "Post Office (privilege over the X Working Group)", "window": "2014 (June)", "wall (rows, ground)": "the name of the working group and the title of its Action Summary of 12 June 2014 withheld under privilege (Common Issues [2019] EWHC 606 (QB) at [37] to [42]; ground: legal professional privilege, an ordinary ground, so outside the openness wall set)", "near the wall (rows)": "the unredacted recommendation of an audit programme \"to detect errors in accounts due to problems with Horizon\" (at [41]); the Board's wish to use Deloitte's report \"alongside the Linklaters report\" and its progression into \"the Project Zebra Action Report\" [hearing-2024-05-22-paula-vennells-day-142 claims 566], after the draft Board briefing of 4 June 2014 [claims 571]", "reading": "the court was told X is \"the name of an animal\" and Post Office names working groups after animals; Zebra is an animal-named Horizon project of the same weeks; a decode candidate beside the codebook's L1 (X = Sparrow), recorded as lead returned 4, never as a finding"}, {"#": "14", "carrier": "Vennells (Sparrow)", "window": "2013 to 2014", "wall (rows, ground)": "\"I'm not sure what I meant by 'more difficult times over Sparrow'\" [hearing-2024-05-22-paula-vennells-day-142 claims 467, partial]", "near the wall (rows)": "Bates: Aujard \"was also part of Project Sparrow, which, as we later to find, was monitoring what was going on in the scheme\" [hearing-2024-04-09-alan-bates-day-117 claims 528]", "reading": "a partial answer on a body her General Counsel sat on (contradiction 18); the hint is in the partial move, not in its content"}, {"#": "15", "carrier": "Vennells (Griffiths)", "window": "2013 (October)", "wall (rows, ground)": "none stated", "near the wall (rows)": "\"rarely a simple explanation\"; brief the Board; she had heard of mental health issues [hearing-2024-05-22-paula-vennells-day-142 tl 92, 93]", "reading": "an offhand alternative causation, its source not stated (lead 139); a signal about how the death was framed internally that
