t of 26 February 2020 ([terms-of-reference-post-office-horizon-it-inquiry-2021 tl 1]); the order is held, the link is not"}, {"#": "6", "carrier": "Post Office Ltd (as counsel to the inquiry tells it)", "window": "2023 (from the April meeting to the section 21(3) productions)", "wall (rows, ground)": "the \"inboxes of potential relevance\" have \"not been explained by the Post Office so we don't know\" whose they are ([hearing-2024-04-09-alan-bates-day-117 claims 61]); no ground stated; the custodians concern raised since April 2023 ([hearing-2024-04-09-alan-bates-day-117 claims 60], [hearing-2024-04-09-alan-bates-day-117 claims 62])", "near the wall (rows)": "two \"assurance exercises\" announced in the covering letter of 28 March 2024 ([hearing-2024-04-09-alan-bates-day-117 claims 30]); the Exchange/365 repository found during Phase 4 ([hearing-2024-04-09-alan-bates-day-117 claims 5]); the chief executive's \"cooperating ... wholeheartedly\" ([the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 27])", "reading": "a silence relayed by the other official party; under the agency rule both tellings are leads; nothing is inferred from the silence to its content"}, {"#": "7", "carrier": "Paula Vennells", "window": "2023-08 to 2023-12 (her first statement)", "wall (rows, ground)": "a gap with a reason: by \"December last year when the draft went in, I had simply run out of time\" for questions 189 and 190 ([hearing-2024-05-22-paula-vennells-day-142 claims 130], [hearing-2024-05-22-paula-vennells-day-142 tl 156]); \"No, not at all, Mr Beer. That's not the way I work\" to \"wait and see\" ([hearing-2024-05-22-paula-vennells-day-142 claims 127], closed-subtle)", "near the wall (rows)": "the request of August 2023 ([hearing-2024-05-22-paula-vennells-day-142 claims 124]); \"I could have put more into it and I'm sorry\" and an offer of a further statement ([hearing-2024-05-22-paula-vennells-day-142 claims 125], [hearing-2024-05-22-paula-vennells-day-142 claims 126]); \"over 600 questions\" and a memory \"not very good at the beginning of this process\" ([hearing-2024-05-22-paula-vennells-day-142 claims 128], [hearing-2024-05-22-paula-vennells-day-142 claims 129])", "reading": "the two questions are named by number only in the held rows; what they asked is not held (counsel's list is an inquiry document)"}], "orgs": [{"body": "Post Office Horizon IT Inquiry", "event": "established as a non-statutory inquiry after the Prime Minister's commitment of 26 February 2020 and the Ministerial Statements of 10 June and 30 September 2020; no date of establishment given", "window": "2020", "rows": "[terms-of-reference-post-office-horizon-it-inquiry-2021 tl 4], [terms-of-reference-post-office-horizon-it-inquiry-2021 claims 1] to [terms-of-reference-post-office-horizon-it-inquiry-2021 claims 3]; [hearing-2024-05-22-paula-vennells-day-142 claims 100] (cross-check 2 of the terms note)", "roots": "the government; Vennells"}, {"body": "Post Office Horizon IT Inquiry", "event": "notice under s.15 of the Inquiries Act 2005 to convert it into a statutory inquiry \"on 1 June 2021\", with amended terms (whether the date is the notice's or the conversion's is open, lead 203)", "window": "2021-Q2", "rows": "[terms-of-reference-post-office-horizon-it-inquiry-2021 tl 5], [terms-of-reference-post-office-horizon-it-inquiry-2021 claims 4], [terms-of-reference-post-office-horizon-it-inquiry-2021 claims 5]", "roots": "the government (the Chair's count fits, [hearing-2024-04-09-alan-bates-day-117 claims 71])"}, {"body": "Post Office Horizon IT Inquiry", "event": "staffed: Sir Wyn Williams as Chair, an Inquiry Secretariat, up to four assessors (unnamed; lead 204), Leila Pilgrim as Secretary to the Inquiry", "window": "2021-Q2 (in operation to 2024: an assessor joins Day 117 remotely, [hearing-2024-04-09-alan-bates-day-117 claims 1])", "rows": "[terms-of-reference-post-office-horizon-it-inquiry-2021 claims 25], [terms-of-reference-post-office-horizon-it-inquiry-2021 claims 26], [terms-of-reference-post-office-horizon-it-inquiry-2021 claims 30]", "roots": "the government"}, {"body": "Department for Business, Energy and Industrial Strategy", "event": "\"is now the Department for Business and Trade\" (an undated footnote added to the terms' page)", "window": "undated, after 2021-06-01 (lead 202)", "rows": "[terms-of-reference-post-office-horizon-it-inquiry-2021 tl 7], [terms-of-reference-post-office-horizon-it-inquiry-2021 claims 31]", "roots": "the inquiry's page"}, {"body": "the redress scheme", "event": "announced by the minister (not named)", "window": "2022-03", "rows": "[hearing-2024-04-09-alan-bates-day-117 tl 115], [hearing-2024-04-09-alan-bates-day-117 claims 580]", "roots": "Bates"}, {"body": "Post Office Ltd", "event": "Nick Read chief executive through the era, from September 2019", "window": "2019-09 onward", "rows": "[the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 7], [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 19], [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 25]", "roots": "Clark (unsourced); Read (\"since 2019\")"}], "builders": "\nThe era makes little new knowledge; it is the era in which knowledge already written down reaches the defendants, the courts, the public and the inquiry, and in which the Post Office's concessions and its disclosure conduct are recorded. Both seeds must read it as such. Every dense window and co-movement above is cited `[synchrony 2020-2023 <table> <row>]`.\n\n### managed-knowledge\n\nWhat the era offers for the thesis:\n- The surfacing of 2013 knowledge in 2020 to 2021 (Co-movements 3): the Clarke advice of 15 July 2013, which told the Post Office that bugs known to its expert \"should have been disclosed\" to convicted defendants and were not (Hamilton [2021] EWCA Crim 577 at [86], `paragraphs.txt`:1075 (canon)), \"was first disclosed in these proceedings in November 2020\" (Hamilton [2021] EWCA Crim 577 at [82], `paragraphs.txt`:1024 (canon)); Mr Bates, the JFSA's founder, learned of it only \"quite late on\", at the appeals, in 2021 ([hearing-2024-04-09-alan-bates-day-117 claims 475]), and had heard nothing of such problems from anyone at the Post Office at the time ([hearing-2024-04-09-alan-bates-day-117 claims 477]). The insurers' notice of July 2013 on \"the Horizon issues\" reached the subpostmasters' side at the same point on his telling ([hearing-2024-04-09-alan-bates-day-117 claims 591], with the emails of 24 July 2013 at [hearing-2024-04-09-alan-bates-day-117 claims 593] to [hearing-2024-04-09-alan-bates-day-117 claims 599]; lead 88).\n- The Post Office's own concession in court, in its Respondent's Notice before the hearing of March 2021: it \"failed to disclose to SPMs and to the courts the full and accurate position in relation to the reliability of Horizon\", and Fujitsu could insert, inject, edit or delete branch data \"without the knowledge or consent of the SPM\" (Hamilton [2021] EWCA Crim 577 at [70], `paragraphs.txt`:910 (canon)); 39 of 42 cases conceded on Ground 1 (Hamilton [2021] EWCA Crim 577 at [77], `paragraphs.txt`:975 (canon)).\n- The court's reading of the Clarke advices: \"a culture, amongst at least some in positions of responsibility within POL, of seeking to avoid legal obligations when fulfilment of those obligations would be inconvenient and/or costly\" (Hamilton [2021] EWCA Crim 577 at [90], `paragraphs.txt`:1156 (canon)).\n- The disclosure record of 2023 (Co-movements 4): \"late and\" \"problematic disclosure of documents\" as \"a constant\" theme ([hearing-2024-04-09-alan-bates-day-117 claims 3]), the April 2023 instruction ([hearing-2024-04-09-alan-bates-day-117 claims 62]), the section 21(3) notice ([hearing-2024-04-09-alan-bates-day-117 claims 26] to [hearing-2024-04-09-alan-bates-day-117 claims 29]) and inboxes not explained ([hearing-2024-04-09-alan-bates-day-117 claims 61]); and Mr Bates's telling that the Post Office's disclosure was the redress scheme's first problem ([hearing-2024-04-09-alan-bates-day-117 claims 580]).\n\nWhat it offers against, or what limits it:\n- The concessions say failure to disclose; they do not say who knew, or when. The chief executive's 2024 decline on who knew what when he joined is a wall, not evidence ([the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 24] to [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 26]; Signals 1).\n- The terms of 1 June 2021 name no remote access and nothing of what the Post Office knew ([terms-of-reference-post-office-horizon-it-inquiry-2021 claims 13], [terms-of-reference-post-office-horizon-it-inquiry-2021 claims 14]); an absence in a government text is a boundary (Signals 3), not cover, unless a builder finds a row that joins it to a choice.\n- The advice and the court place the expert's failure on Mr Jenkins and \"arguably\" Fujitsu (Hamilton [2021] EWCA Crim 577 at [86], `paragraphs.txt`:1075 (canon)).\n- No row of 2020 to 2023 records a decision in the era to withhold anything; the era's late disclosures are compatible with structure (the late-found repository, [hearing-2024-04-09-alan-bates-day-117 claims 5]) as well as with management.\n\nNodes a builder should take: Hamilton [2021] EWCA Crim 577 at [82], `paragraphs.txt`:1024 (canon) with [hearing-2024-04-09-alan-bates-day-117 claims 475] (the 2013 advice's seven-year path to the defendants' side; [synchrony 2020-2023 co-movements 3]); Hamilton [2021] EWCA Crim 577 at [70], `paragraphs.txt`:910 (canon) (the era's concession in court of alteration without the subpostmaster's knowledge; Leads returned); [hearing-2024-04-09-alan-bates-day-117 claims 591] (the insurers' notice, one root); [hearing-2024-04-09-alan-bates-day-117 claims 3] with [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 27] ([synchrony 2020-2023 contradictions 2]).\n\nContradictions it must take a side on: [synchrony 2020-2023 contradictions 2] (wholehearted cooperation against late disclosure; possible flare, with its separating test); and the reading of [synchrony 2020-2023 co-movements 3]: whether the Post Office's disclosure of November 2020 was its first opportunity or forced by the appeals (Hamilton [2021] EWCA Crim 577 at [81], `paragraphs.txt`:1019 (canon) says only that it came from \"its review of the many documents\"). [synchrony 2020-2023 contradictions 1] and 4 do not bear on it; 3 is a candour signal only.\n\n### good-faith-reliance\n\nWhat the era offers for the rival ([rival: good-faith-reliance]):\n- The government's own line after the settlement, that it \"had been misled by the Post Office\" ([hearing-2024-04-09-alan-bates-day-117 claims 375]; Signals 5), is the rival's frame one level up: a principal misinformed by the body beneath it ([synchrony 2020-2023 co-movements 1]).\n- The court and the Clarke advice place the failure on the expert and \"arguably\" his employer (Hamilton [2021] EWCA Crim 577 at [86], `paragraphs.txt`:1075 (canon)); Ms Vennells, looking back from 2024, says she learned through the inquiry what she did not know ([hearing-2024-05-22-paula-vennells-day-142 claims 102], closed-subtle; [hearing-2024-05-22-paula-vennells-day-142 claims 108]: the serious numbers of bugs and the interventions only with Mr Coyne's evidence in 2018) and gives as reasons \"possibly Fujitsu not sharing as much as it could or should have done\" and the lack of corporate memory ([hearing-2024-05-22-paula-vennells-day-142 claims 110] to [hearing-2024-05-22-paula-vennells-day-142 claims 112]; her labelled inference).\n- The 2023 disclosure difficulties fit structure: a repository discovered during Phase 4 ([hearing-2024-04-09-alan-bates-day-117 claims 5]), assistants' inboxes searched only in an \"assurance exercise\" of 2024 ([hearing-2024-04-09-alan-bates-day-117 claims 30]), the chief executive's \"and that we are aware of\" ([the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 27]), and the Chair's own view that his tight timetables may be partly to blame ([hearing-2024-04-09-alan-bates-day-117 claims 69], [hearing-2024-04-09-alan-bates-day-117 claims 70]).\n- Mr Bates's words to the committee in January 2024 (next era): the Post Office \"very much relied upon their supplier to also be their IT experts and advisors\" ([the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 38]).\n\nWhat it offers against:\n- The Clarke advice was the Post Office's own in July 2013 (Hamilton [2021] EWCA Crim 577 at [82], `paragraphs.txt`:1024 (canon)); the rival must hold that it did not reach those who made the public statements, a claim the era's rows neither support nor refute.\n- The court's culture reading (Hamilton [2021] EWCA Crim 577 at [90], `paragraphs.txt`:1156 (canon)) and its finding it \"extraordinary\" that the advice was needed after \"well over a decade\" of complaints (Hamilton [2021] EWCA Crim 577 at [87], `paragraphs.txt`:1112 (canon)).\n- The Post Office's concession that it failed to disclose to subpostmasters and courts (Hamilton [2021] EWCA Crim 577 at [70], `paragraphs.txt`:910 (canon)) is a failure of the prosecutor, not of the supplier; and Fujitsu's 2024 telling that the Post Office was \"certainly aware\" ([the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 23]) is an adverse telling of the executive circle that the rival must answer.\n\nNodes a builder should take: [hearing-2024-04-09-alan-bates-day-117 claims 375] ([synchrony 2020-2023 signals 5]); Hamilton [2021] EWCA Crim 577 at [86], `paragraphs.txt`:1075 (canon); [hearing-2024-05-22-paula-vennells-day-142 claims 108], [hearing-2024-05-22-paula-vennells-day-142 claims 110]; [hearing-2024-04-09-alan-bates-day-117 claims 5] with [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 27].\n\nContradictions it must take a side on: [synchrony 2020-2023 contradictions 2], on the structural side (the repository unknown to the Post Office when the notice came) or concede the managed reading for 2023; [synchrony 2020-2023 co-movements 3], where it must say why a 2013 advice held by the prosecutor reached defendants only in 2020.\n\n", "words": 9868}, {"id": "narrative-synchrony-2024-onward", "era": "2024-onward (2024 to 2100; the pack's windows 2024, 2024-Q1, 2024-Q2, 2026, 2026-Q4)", "title": "Synchrony: 2024 onward", "meta": {"Kind": "narrative-synchrony", "Era": "2024-onward (2024 to 2100; the pack's windows 2024, 2024-Q1, 2024-Q2, 2026, 2026-Q4)", "Built": "2026-10-23", "Author": "sync-2024-onward (run pilot-1023, the narrative step of the pilot)", "Sources": "the narrative pack research/tasks/tool-feedback/pilot-1023/narratives-pilot-1023/pack/ (synchrony/2024-onward.md, synchrony-index.md, contradictions.md, speakers.md, signals.md, seeds.md), built 2026-10-23 from notes.db; the era page research/timeline-consolidated-2024-onward.md was not available (consolidated era pages are agent-written and not part of this run), so research/timeline-master.md and research/timeline-contradictions.md were read for the era in its place and no cluster IDs are cited; notes read through notes.db (claims, timeline, cross-checks, audit rows): the-register-2024-01-17-post-office-boss-keeping-mum-remote-access, hacker-news-2024-01-16-post-office-software-glitch-thread, hearing-2024-04-09-alan-bates-day-117, hearing-2024-05-22-paula-vennells-day-142, guidance-sfo-corporate-cooperation-2025, with rows of doc-pol00028838-2010-09-29-receipts-payments-mismatch-notes, doc-pol00004406-2013-07-08-second-sight-interim-report, doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two, doc-pol00006357-2013-07-15-clarke-advice-expert-evidence and computer-weekly-2009-05-11-postmasters-tell-their-story where a 2024 telling is checked against them; research/narrative-rival-good-faith-reliance.md; packs/pilot/seeds/theses.json; the relations register (`ledger analyse relations`) and the leads register (notes.db `leads`)", "Rows considered": "77 pack rows (every dated timeline row of the era; 7 more master-timeline spans that end in 2024, such as [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 4] and [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 8], sit in earlier windows of the pack and are read only where a 2024 carrier tells them); 0 clusters (no era page); 19 of the pack's 96 contradiction nodes (ranks 45 to 56 and 79 to 85, those whose note row falls in the era), merged into 11 rows, plus 4 new nodes; the speaker and signal sheets of the six carriers active in the era (Vennells, Bates, Beer, Lindsay Clark, PakG1, SFO)", "Status": "complete", "Related": "era page: research/timeline-consolidated-2024-onward.md (not available in this run); [timeline contradictions](timeline-contradictions.md); [master timeline](timeline-master.md); [rival sheet: good-faith reliance](narrative-rival-good-faith-reliance.md); tools/narratives.md (sections 1, 3, 5a, 6, 8)"}, "lanes": "\n**A. The Horizon system.** One dated row only: at the Business and Trade Committee on 16 January 2024 Fujitsu's director Paul Patterson says Fujitsu's remote interventions \"has been documented\" and that the Post Office \"were certainly aware of that remote access\" [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 15; the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 22, 23], and that Fujitsu \"did have bugs and errors in the system\" [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 41]. Everything else the era says about the system is told in 2024 about earlier years: counsel's reading of inquiry documents that the Post Office \"knew that a form of remote access was possible from at least October 2008\" [hearing-2024-05-22-paula-vennells-day-142 claims 530]; the Post Office's addendum of 2 February 2015 with its tiers of lines on remote tampering [hearing-2024-05-22-paula-vennells-day-142 claims 622 to 625]; Deloitte's board briefing of 2014 as \"written evidence to you and the Board\" of Fujitsu's capability [hearing-2024-05-22-paula-vennells-day-142 cross-check 16]; Vennells learning the numbers of bugs only from Coyne's evidence of 2018 [hearing-2024-05-22-paula-vennells-day-142 claims 108]; and the Guardian, relayed on the forum, that Fujitsu's access was \"unrestricted and unaudited\" [hacker-news-2024-01-16-post-office-software-glitch-thread cross-check 7]. Roots: Patterson (Fujitsu), Beer reading documents he does not name (possibly the same root as Patterson's documentation, [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access cross-check 5]), Vennells, the Guardian through one poster. Absent: no Fujitsu or Post Office document of the era is held, no engineer and no SSC row speaks; lane A in 2024 is speech about documents (leads 173, 181).\n\n**B. Prosecutions and civil recovery.** Four rows, three of them forum posts with no source: two \"fairly prominent\" Fujitsu people interviewed under caution on suspicion of perjury [hacker-news-2024-01-16-post-office-software-glitch-thread tl 41], police investigating perjury that may have contributed to the prosecutions [hacker-news-2024-01-16-post-office-software-glitch-thread tl 42], the Post Office under investigation for potential fraud offences [hacker-news-2024-01-16-post-office-software-glitch-thread tl 44]; roots g_p and johndunne, pseudonymous and unsourced (lead 193). The fourth is the SFO guidance page's update of 13 October 2026 [guidance-sfo-corporate-cooperation-2025 tl 3], the era's only official prosecution text, which does not name the Post Office (it is the pack's lens source, packs/pilot/lenses/sfo-cooperation.json). The one named root on prosecutions is Patterson: \"we did help the Post Office in their prosecutions of the subpostmasters\" [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 42]. Told in 2024 about earlier years: Alan Cook's evidence that Vennells \"may have signed off\" some £300,000 pursuing Castleton [hearing-2024-05-22-paula-vennells-day-142 tl 160; hearing-2024-05-22-paula-vennells-day-142 claims 290], and Cameron's that she did not believe there had been miscarriages of justice [hearing-2024-05-22-paula-vennells-day-142 claims 171]. Absent: no court or police record of 2024 is held.\n\n**C. Disclosure and expert evidence.** The era's densest lane: 21 rows, all from counsel's statement opening Day 117 on the Post Office's disclosure to the inquiry. It runs from the disclosure hearing of 12 January 2024, where the Post Office's lawyer Mr Jackson of Burges Salmon called its Phase 4 disclosure \"suboptimal\" [hearing-2024-04-09-alan-bates-day-117 tl 123; hearing-2024-04-09-alan-bates-day-117 claims 4 to 6], through the chair's directions of 31 January [hearing-2024-04-09-alan-bates-day-117 tl 124], the minuted meeting of 28 February [hearing-2024-04-09-alan-bates-day-117 tl 127; hearing-2024-04-09-alan-bates-day-117 claims 11 to 20], the Microsoft Exchange failings and productions to 22 March [hearing-2024-04-09-alan-bates-day-117 tl 125, 130], the tranches of 28 March to 5 April (1,071, 196, 3,188, 189, 200 and 374 documents) [hearing-2024-04-09-alan-bates-day-117 tl 132 to 134, 138 to 146], to the personal assistants' data due from 23 April [hearing-2024-04-09-alan-bates-day-117 tl 154]; since 2 February the Post Office had disclosed 73,720 documents and at least 78,211 might fall for disclosure [hearing-2024-04-09-alan-bates-day-117 tl 126, 147; hearing-2024-04-09-alan-bates-day-117 claims 55, 56]. Roots: Beer (firsthand, and reading the minute and the Post Office's letters), the Post Office through its letters and lawyers (one party), the inquiry's Information Management Team for one count [hearing-2024-04-09-alan-bates-day-117 tl 147]. Beer's own terms: late and \"problematic disclosure\" a \"constant\" theme [hearing-2024-04-09-alan-bates-day-117 claims 3], issues \"much more than minor, ad hoc or additional\" [hearing-2024-04-09-alan-bates-day-117 claims 59], inboxes \"not been explained by the Post Office\" [hearing-2024-04-09-alan-bates-day-117 claims 60 to 62]. One independent root on the same theme: Greene's text \"they did not deliver [documents]\" [hearing-2024-05-22-paula-vennells-day-142 claims 92]. Expert evidence in the courts' sense has no era row; the governance experts are lane G. Absent: the Post Office's own account of its failures, except as Beer reads its letters; nothing on how the personal assistants' review ended.\n\n**D. The critics and the scheme.** In this era the critics' lane is the press and the forum: the ITV drama [hacker-news-2024-01-16-post-office-software-glitch-thread tl 47; the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 13; hearing-2024-04-09-alan-bates-day-117 claims 586], the Guardian's technical breakdown of 9 January and its report of 12 January on the law on computer evidence [hacker-news-2024-01-16-post-office-software-glitch-thread tl 51, 52], CNN on 13 January [hacker-news-2024-01-16-post-office-software-glitch-thread tl 53], Forbes on 15 January [hacker-news-2024-01-16-post-office-software-glitch-thread tl 54], David Allen Green's post [hacker-news-2024-01-16-post-office-software-glitch-thread tl 45], the Hacker News thread itself [hacker-news-2024-01-16-post-office-software-glitch-thread tl 46, 55], a poster's \"one CBE handed back\" with no holder named [hacker-news-2024-01-16-post-office-software-glitch-thread tl 50] (lead 9 below) and The Register's report of 17 January [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 18]. Roots after the forum relays collapse to their publications: the Guardian, CNN, Forbes, Green, The Register (Clark); the posters who relay them (IronWolve, ChocMontePy, jdietrich, omoikane) add no root. The JFSA appears only through Bates, in lanes E, F and G. The scheme has no era row; Sparrow and Second Sight enter only as 2024 tellings of 2013 to 2015 ([hearing-2024-04-09-alan-bates-day-117 cross-check 20]; [hearing-2024-05-22-paula-vennells-day-142 claims 467, 591]). [hacker-news-2024-01-16-post-office-software-glitch-thread tl 40] is a poster's description of himself, context only, and [hacker-news-2024-01-16-post-office-software-glitch-thread tl 56] a capture artefact.\n\n**E. Money and contracts.** Redress and compensation only: Bates's first redress offer 77 working days after his claim, about a sixth of it [hearing-2024-04-09-alan-bates-day-117 tl 120; hearing-2024-04-09-alan-bates-day-117 claims 571 to 576], his lawyer's challenge letter unanswered [hearing-2024-04-09-alan-bates-day-117 tl 137; hearing-2024-04-09-alan-bates-day-117 claims 578], Fujitsu's admission of a \"moral responsibility\" to compensate, its extent \"determined when the statutory inquiry finishes\" [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 13; the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 10, 43, 44], Byrne relaying that Read \"can't estimate the scale of compensation\" and has not \"kept evidence safe\" on money paid [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 17, 18], Sunak's promise of compensation [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 14], and Greene's \"they did not compensate people\" [hearing-2024-05-22-paula-vennells-day-142 claims 92]. Roots: Bates, Patterson, Read through Byrne, Sunak through The Register's report of 8 January 2024, Greene. Absent: no figure for any scheme, no contract row of the era (Clark's \"£2.3 billion contract with ICL\" is undated and unsourced, [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 36]).\n\n**F. Government and Parliament.** The Business and Trade Committee of 16 January 2024 [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 12, 14, 16, 17; hearing-2024-04-09-alan-bates-day-117 tl 121], Sunak's promise of legislation [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 11], the announced law change to speed exonerations [hacker-news-2024-01-16-post-office-software-glitch-thread tl 48], a comment that convictions could not be quashed without retrial [hacker-news-2024-01-16-post-office-software-glitch-thread tl 49], a general election due within the year [hacker-news-2024-01-16-post-office-software-glitch-thread tl 43]. Roots: the committee's witnesses (Read, Patterson, Hamilton, Bates) and its chair Byrne, all relayed by one reporter (Clark), except Bates, who confirms his own appearance at the inquiry [hearing-2024-04-09-alan-bates-day-117 claims 577] ([the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 17] agreement: one root, two tellings); dspillett (forum, unsourced) for the law rows. Absent: the committee's own transcript (lead 173), the text of any bill; no minister speaks in an era row (the minister of 2010 is read back on Day 117, signal 12).\n\n**G. The courts and the inquiry.** The inquiry's own procedure: the governance experts announced on 9 January [hearing-2024-04-09-alan-bates-day-117 tl 122] and their first report of 27 March covering 1999 to 2019 [hearing-2024-04-09-alan-bates-day-117 tl 131], Bates's statement of 29 February [hearing-2024-04-09-alan-bates-day-117 tl 128], Vennells's statements of 8 March and 8 April [hearing-2024-05-22-paula-vennells-day-142 tl 159, 161], the chair's decision to carry on [hearing-2024-04-09-alan-bates-day-117 tl 136; hearing-2024-04-09-alan-bates-day-117 claims 65 to 71], Day 117 on 9 April [hearing-2024-04-09-alan-bates-day-117 tl 148, 149], Bourke's hearing set for 7 May [hearing-2024-04-09-alan-bates-day-117 tl 155], Cook's evidence in April and Cameron's in May [hearing-2024-05-22-paula-vennells-day-142 tl 160, 162], Day 142 on 22 May [hearing-2024-05-22-paula-vennells-day-142 tl 163, 164]. Roots: Beer, Sir Wyn Williams, the transcripts. 11 of the lane's 24 rows are procedural (sittings, breaks, adjournments). No court sits in an era row; the courts enter only as 2024 tellings of the judgments of 2019 and 2021.\n\n**H. Organisations.** The Post Office's chairman Henry Staunton \"resigned, I think, or was required to resign\" on 27 January 2024 [hearing-2024-05-22-paula-vennells-day-142 tl 158; hearing-2024-05-22-paula-vennells-day-142 claims 80], and Greene's text \"Chairman gone. He will be next\" [hearing-2024-05-22-paula-vennells-day-142 claims 83]; the exchange itself, between the former chief executives of the Post Office and of Royal Mail Group, is [hearing-2024-05-22-paula-vennells-day-142 tl 157]. Lifecycle facts told in 2024 of earlier years: Read chief executive from September 2019 [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 19], ICL \"later bought by Fujitsu\" [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 37], Chartis renamed AIG [hearing-2024-04-09-alan-bates-day-117 claims 602]. Roots: Beer, Greene (PVEN00000532), Clark (unsourced). Absent: no change at Fujitsu as a body; nothing on the Post Office's board after Staunton.\n\n", "windows": [{"window": "2024-Q1", "lanes active": "A, B, C, D, E, F, G, H (8; 39 rows: C 10, D 10, F 8, G 5, E 2, H 2, A 1, B 1)", "what moves": "January's public turn (the drama, the press of 9 to 16 January, the committee of 16 January, Sunak's promise, Staunton's exit on 27 January, the forum's reports of police inquiries, Greene withdrawing her support) and, beside it, the inquiry's dispute with the Post Office over disclosure (12 January hearing, 31 January directions, 28 February minute, the Exchange productions to 22 March, the 28 March letter)", "carriers (roots)": "Guardian, CNN, Forbes, Green, Clark; Read, Patterson, Byrne, Hamilton, Bates; IronWolve, dspillett, g_p, johndunne; Beer and the Post Office's letters; Greene (16 flagged; 8 circles)", "rows": "[hacker-news-2024-01-1 rance on the report's caveats [hearing-2024-05-22-paula-vennells-day-142 claims 560]; the report was \"full of caveats\" [hearing-2024-05-22-paula-vennells-day-142 claims 562]", "reading": "The assurance that carries the rival at this point has no document. A signal on the rival's custody, not a refutation of it"}, {"#": "11", "carrier": "Moya Greene, as read on Day 142", "window": "2010 to 2018", "wall (rows, ground)": "offhand: \"I was afraid you were being lied to\" [hearing-2024-05-22-paula-vennells-day-142 claims 89] in the message that also says \"'I think you knew\" [hearing-2024-05-22-paula-vennells-day-142 claims 86]", "near the wall (rows)": "\"I asked you twice. I suggested you get an independent review\" [hearing-2024-05-22-paula-vennells-day-142 claims 88]; Vennells said \"the system had already been reviewed multiple times\" [hearing-2024-05-22-paula-vennells-day-142 claims 90]", "reading": "A peer's fear at the time, as she writes it in 2024, that the chief executive was misinformed: the rival's reading voiced by a third party in the same message that voices the seed's"}, {"#": "12", "carrier": "the Minister (2010), read by Beer on Day 117", "window": "2010 (after the change of Government)", "wall (rows, ground)": "closed-outright: the integrity of the system is \"an operational and contractual matter for the Post Office and not government\"; a meeting would not \"serve any useful purpose\" [hearing-2024-04-09-alan-bates-day-117 audit 77; hearing-2024-04-09-alan-bates-day-117 claims 335, 336]; ground: deferral to another body", "near the wall (rows)": "Bates took offence at \"arm's length\", the Government being sole shareholder [hearing-2024-04-09-alan-bates-day-117 claims 337]; Government \"more interested these days\" [hearing-2024-04-09-alan-bates-day-117 claims 338]", "reading": "The shareholder's boundary of 2010 read back in 2024: the oversight gap the rival names, and the distance the seed needs"}, {"#": "13", "carrier": "Alan Bates", "window" tely", "window": "2024-04", "rows": "[hearing-2024-04-09-alan-bates-day-117 claims 1, 613]", "roots": "1: Sir Wyn Williams"}, {"body": "Burges Salmon LLP", "event": "the Post Office's recognised legal representative before the inquiry (Mr Jackson)", "window": "2024-01-12", "rows": "[hearing-2024-04-09-alan-bates-day-117 tl 123]; [hearing-2024-04-09-alan-bates-day-117 claims 4]", "roots": "1: Beer"}, {"body": "Business and Trade Committee", "event": "chaired by Liam Byrne at the hearing of 16 January 2024", "window": "2024-01-16", "rows": "[the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 12]; [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 15]", "roots": "1: Clark (Byrne quoted)"}, {"body": "ICL / Fujitsu", "event": "ICL \"later bought by Fujitsu\" (undated; told 2024)", "window": "undated", "rows": "[the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 37]; [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 22]", "roots": "1: Clark (unsourced)"}, {"body": "Chartis / AIG", "event": "Chartis renamed AIG (the Post Office's insurer of 2013, told 2024)", "window": "by 2024", "rows": "[hearing-2024-04-09-alan-bates-day-117 claims 602]", "roots": "1: Parsons's email as read"}], "builders": "\nWhat the era is, for both seeds: almost nothing in it is an event of the matter itself. Its events are tellings: a committee hearing, press pieces, texts between two former chief executives, the inquiry's disclosure record and two hearing days. Its offer to each seed is therefore what the parties said in 2024 about 2000 to 2019, under questioning or at a hearing, with every such row cited to its 2024 note and to the earlier era it describes. A builder crossing 2024-Q1 must say what the other lanes were doing (Windows: eight lanes in one quarter), and the co-movements 1, 2 and 6 are the ones that cross it.\n\n### managed-knowledge\n\nFor:\n- The written record of the capability is read into the public record by parties other than the critics. Counsel, from inquiry documents: the Post Office \"knew that a form of remote access was possible from at least October 2008\" [hearing-2024-05-22-paula-vennells-day-142 claims 530] (two years before the seed's \"from 2010 at the latest\"; contradiction 9). Fujitsu's director: the interventions \"has been documented\" and the Post Office \"were certainly aware\" [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 22, 23]. Deloitte's board briefing of 2014 is \"written evidence to you and the Board\" of Fujitsu's capability [hearing-2024-05-22-paula-vennells-day-142 claims 594; hearing-2024-05-22-paula-vennells-day-142 cross-check 16].\n- The 2015 line was built in tiers: lines to volunteer, lines \"If you're pushed\", and a third tier, if injection is raised, that \"There is functionality to add transactions\" [hearing-2024-05-22-paula-vennells-day-142 claims 622 to 625, 627; hearing-2024-05-22-paula-vennells-day-142 cross-check 21]; its effect \"very guarded\", and \"It could have been\" the effect its creators sought [hearing-2024-05-22-paula-vennells-day-142 claims 658, 659] (signal 3; contradictions 1, 2).\n- Avoiding a written trail in 2013: Parsons's advice to notify the insurers verbally \"so as not to leave a paper trail\" and to say only that \"the press have reported\" issues [hearing-2024-04-09-alan-bates-day-117 claims 599, 602], nine days after Clarke's advice that some within the Post Office had been aware of bugs [doc-pol00006357-2013-07-15-clarke-advice-expert-evidence claims 85] (signal 9; contradiction 6). The Minister's 2015 letter that there was no \"evidence of system-wide problems\" is read beside the 2013 notice [hearing-2024-04-09-alan-bates-day-117 claims 589, 590].\n- Peers and critics in 2024: Greene, \"'I think you knew\" [hearing-2024-05-22-paula-vennells-day-142 claims 86]; Bates, \"they had known they were wrong for many, many years\" [hearing-2024-04-09-alan-bates-day-117 claims 609] and a board comment that the case \"should be buried at any cost\" [hearing-2024-04-09-alan-bates-day-117 claims 607].\n- The era's own pattern, if a builder takes it: the Post Office's late disclosure to the inquiry [hearing-2024-04-09-alan-bates-day-117 claims 3, 23, 55, 59 to 62] beside Read's assurance [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 27] (contradiction 12; co-movement 6). The rows give volume and lateness, not the withholding of a known document; that step is the builder's inference and must be marked as such.\n\nAgainst:\n- Custody. The knowledge rows come through a party now adverse to the Post Office, or through counsel reading documents the database does not hold: Patterson's \"certainly aware\" is unsourced (host, closed-subtle, [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 23]) and his documents are not named [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 22]; counsel's 2008 rests on \"documents provided by the Inquiry\", unnamed [hearing-2024-05-22-paula-vennells-day-142 claims 530], and the two may be one root [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access cross-check 5] (lead 2 below). Bates's \"buried at any cost\" has an unnamed teller (hearsay, [hearing-2024-04-09-alan-bates-day-117 claims 607]); his \"known they were wrong\" is his own unsourced view [hearing-2024-04-09-alan-bates-day-117 claims 609].\n- Timing. The seed has the knowledge kept out of disclosure \"until the group litigation forced it out in 2019\"; the era's rows show the inquiry still drawing documents from the Post Office in 2024 [hearing-2024-04-09-alan-bates-day-117 claims 23, 55]. That fits a longer version of the seed, and the seed as written would need its end date moved.\n- The structure rows are many and specific [hearing-2024-05-22-paula-vennells-day-142 claims 60, 61, 64, 65] and the seed must explain them rather than set them aside.\n\nNodes to take: co-movement 2 (the knowledge attribution), co-movement 6 (disclosure into the inquiry); contradictions 1, 2, 4, 6, 7, 9, 12, 14; signals 2, 3, 8, 9.\n\nContradictions it must take a side on: 1 and 2 (did the addendum's drafters hold the 2010 record or the 2014 briefing?); 3 (Sewell's assurance: given as recalled, and believed?); 5 (what Sparrow was); 12 (Read's assurance: error or misdirection?); 13 (Greene's \"I think you knew\" against Vennells's \"No Moya\"); 14 (Fujitsu against the Post Office on who held the knowledge).\n\n### good-faith-reliance\n\nFor:\n- The rival's anchor rows belong to this era. Bates at the committee: the Post Office \"very much relied upon their supplier to also be their IT experts and advisors\", \"That was the major problem\" [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 38], and should have brought in a third party \"and not rely on Fujitsu\" [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 39]; the same reliance is in Clarke's 2013 advice, \"relied upon Dr. Gareth Jenkins\" for expert evidence [doc-pol00006357-2013-07-15-clarke-advice-expert-evidence claims 29; the-register-2024-01-17-post-office-boss-keeping-mum-remote-access cross-check 8]. Vennells: \"At the time, they were not considered to be false statements\" [hearing-2024-05-22-paula-vennells-day-142 claims 539].\n- Structure. Reporting \"at different levels\", \"a level 0 and a level 1\" reaching her and the Board, issues below \"not reported\" [hearing-2024-05-22-paula-vennells-day-142 claims 59 to 61]; \"layers of escalation\" that gave a Board no \"line of sight\" [hearing-2024-05-22-paula-vennells-day-142 claims 64]; information did not reach her because of the way the company was \"organised and structured\" [hearing-2024-05-22-paula-vennells-day-142 claims 65]; legal advices not shared, only their outcomes [hearing-2024-05-22-paula-vennells-day-142 claims 47, 50, 53].\n- Misinformation from below and from the supplier. No bugs, on what \"a series of senior IT managers\" told her [hearing-2024-05-22-paula-vennells-day-142 claims 28]; Fujitsu \"not sharing as much as it could or should have done\" [hearing-2024-05-22-paula-vennells-day-142 claims 110]; the numbers of bugs learned only from Coyne in 2018 [hearing-2024-05-22-paula-vennells-day-142 claims 108]; \"told multiple times\" that \"there had been no evidence found\" [hearing-2024-05-22-paula-vennells-day-142 claims 172]; Sewell's assurance on the balancing transaction [hearing-2024-05-22-paula-vennells-day-142 claims 561].\n- A third party at the time, as she writes in 2024: Greene, \"I was afraid you were being lied to\" [hearing-2024-05-22-paula-vennells-day-142 claims 89] (signal 11).\n- The inquiry's own frame in the era is governance: experts on \"governance, management and leadership\" for 1999 to 2019 [hearing-2024-04-09-alan-bates-day-117 claims 74; hearing-2024-04-09-alan-bates-day-117 tl 131]; a forum poster's \"it was the corporate governance that failed\" [hacker-news-2024-01-16-post-office-software-glitch-thread claims 177] (co-movement 4). The Post Office's 2024 disclosure is put by its own lawyer as \"suboptimal\" and structural [hearing-2024-04-09-alan-bates-day-117 claims 6, 15].\n\nAgainst:\n- Fujitsu's director says the Post Office was \"certainly aware\" [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 23]; counsel's documents date a form of remote access to October 2008 [hearing-2024-05-22-paula-vennells-day-142 claims 530]; Deloitte's 2014 briefing was \"written evidence to you and the Board\" [hearing-2024-05-22-paula-vennells-day-142 claims 594].\n- She \"routinely received correspondence\" raising concerns about Horizon and \"saw the theme of Horizon coming up\" [hearing-2024-05-22-paula-vennells-day-142 claims 527, 528]; the addendum's tiers [hearing-2024-05-22-paula-vennells-day-142 claims 623]; her wall on why the Post Office would withhold information \"unless pushed\" [hearing-2024-05-22-paula-vennells-day-142 audit 296].\n- She denies Cameron's account that she never doubted the path [hearing-2024-05-22-paula-vennells-day-142 claims 179, 181] (contradiction 15): she says she did doubt, which is not the same as being misinformed.\n- Custody. The assurances that carry the rival are undocumented [hearing-2024-05-22-paula-vennells-day-142 claims 559, 160] (signal 10); Bates's reliance words are his unsourced view (host, closed-subtle, [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 38]) and three months later he says the Post Office \"had known they were wrong\" [hearing-2024-04-09-alan-bates-day-117 claims 609] (lead 8 below): a builder citing [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 38] for the rival must cite [hearing-2024-04-09-alan-bates-day-117 claims 609] beside it.\n\nNodes to take: co-movement 2, co-movement 4; contradictions 3, 13, 14, 15; signals 4, 7, 10, 11.\n\nContradictions it must take a side on: 3 (Sewell); 13 (Greene's \"lied to\" against her \"I think you knew\"); 14 (Patterson against Vennells: the rival needs the knowledge to have stayed with Fujitsu and junior staff, and Patterson places it with the Post Office); 15 (Cameron); and 1 and 2 at the level of the drafters (the rival survives the addendum only if those who drafted it did not hold the 2010 record).\n\n", "words": 12254}, {"id": "narrative-synchrony-pre-2000", "era": "pre-2000 (1990 to 1999; the pack's scope start is 1999, the pilot of Horizon, so 1999 is the only window on the grid and 1990 to 1998 enters only as antecedents a later carrier invokes)", "title": "Synchrony: before 2000 (pre-2000)", "meta": {"Kind": "narrative-synchrony", "Era": "pre-2000 (1990 to 1999; the pack's scope start is 1999, the pilot of Horizon, so 1999 is the only window on the grid and 1990 to 1998 enters only as antecedents a later carrier invokes)", "Built": "2026-10-23", "Author": "sync-pre-2000 (run pilot-1023)", "Sources": "the narrative pack (research/tasks/tool-feedback/pilot-1023/narratives-pilot-1023/pack/, built 2026-10-23 from notes.db: synchrony/pre-2000.md, synchrony-index.md, contradictions.md, speakers.md, signals.md, seeds.md); the era page was not available (research/timeline-consolidated-pre-2000.md is agent-written and not part of this run), so research/timeline-master.md and research/timeline-contradictions.md were read for the era in its place and no cluster IDs are cited; notes.db (read-only) for the pre-scope rows and the claims rows the pack cut; the notes hearing-2024-05-22-paula-vennells-day-142, hearing-2024-04-09-alan-bates-day-117, the-register-2024-01-17-post-office-boss-keeping-mum-remote-access, hacker-news-2024-01-16-post-office-software-glitch-thread, doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two, doc-pol00006357-2013-07-15-clarke-advice-expert-evidence, computer-weekly-2009-05-11-postmasters-tell-their-story, guidance-sfo-corporate-cooperation-2025, terms-of-reference-post-office-horizon-it-inquiry-2021; the registers research/leads-and-inferences.md, research/relations-register.md (with `ledger analyse relations`), research/divergence-patterns.md, research/echo-patterns.md; the pack's reference pages packs/pilot/registers/order-of-battle-seed.md, packs/pilot/seeds/catalysts.md, packs/pilot/codebook/argot.md, packs/pilot/canon/texts.md; the rival sheet research/narrative-rival-good-faith-reliance.md", "Rows considered": "3 pack rows (window 1999); 15 pre-scope timeline rows (1990 to 1998, every one carried by a note of 2009 or later) entered as lane G antecedents; 62 claims rows bearing on the era read from notes.db; 0 clusters (no era page)", "Status": "complete", "Related": "era page: research/timeline-consolidated-pre-2000.md (not available in this run); [master timeline](timeline-master.md); [timeline contradictions](timeline-contradictions.md); the pack's contradiction nodes (research/tasks/tool-feedback/pilot-1023/narratives-pilot-1023/pack/contradictions.md); [the protocol](../tools/narratives.md); [rival: good-faith-reliance](narrative-rival-good-faith-reliance.md)"}, "lanes": "\n**A. The Horizon system (bugs, remote access, audit data).** Two unsourced tellings put the system's installation or roll-out in 1999: Lindsay Clark of The Register (\"installed in 1999\") [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access tl 1] [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 9] and the forum poster zimpenfish (\"rolled out in 1999 under Labour as the reduced system after DSS withdrew\") [hacker-news-2024-01-16-post-office-software-glitch-thread tl 7] [hacker-news-2024-01-16-post-office-software-glitch-thread claims 173]; two roots, both unsourced, not collapsible on any echo the registers hold. The pack's catalyst seed (Hamilton [2021] EWCA Crim 577 at [9], paragraphs.txt:136-140: piloted 1999, rolled out 2000) is not a held row; it is the reference date the notes' Agreement cells use. The other lane-A rows about the 1990s system are undated or later-dated characterisations: \"Horizon was a child of the 90s\" [hacker-news-2024-01-16-post-office-software-glitch-thread tl 4] [hacker-news-2024-01-16-post-office-software-glitch-thread claims 311]; the Riposte and ISDN design [hacker-news-2024-01-16-post-office-software-glitch-thread claims 307]; the EPOS development team's quality as the Guardian relayed McDonnell's inquiry evidence [hacker-news-2024-01-16-post-office-software-glitch-thread claims 256] (lead 181); a system \"designed for a completely different purpose\" that the Post Office \"had had to struggle to take on\", which Vennells says she did not know [hearing-2024-05-22-paula-vennells-day-142 claims 113]; and, from Vennells and the Deloitte briefing of 2014, the standing question whether the implementation \"back in the 1990s/early 2000s\" could be validated at all [hearing-2024-05-22-paula-vennells-day-142 tl 1] [hearing-2024-05-22-paula-vennells-day-142 claims 576] [hearing-2024-05-22-paula-vennells-day-142 claims 573] [hearing-2024-05-22-paula-vennells-day-142 claims 579]. Absent: any held row that records a bug, a PEAK or a remote correction in 1999 itself. The canon does carry dated 1999 PEAKs (the Horizon Issues judgment at [235] to [241]), but no note row catalogues them; that absence is returned as a lead, not entered as an event.\n\n**B. Prosecutions and civil recovery.** Nothing in the era. The only rows that touch it look back from 2010: Bates's letters to Ed Davey say the 1994 Contract \"does not address new technology\" and is still used \"to intimidate and prosecute subpostmasters\", relying on a clause making the subpostmaster liable for loss \"however it occurs\" [hearing-2024-04-09-alan-bates-day-117 claims 328] [hearing-2024-04-09-alan-bates-day-117 claims 355]. One root (Bates's letters), lane B by use, lane E by object. Absent: any prosecution, any civil recovery and any investigator's row in 1999 or before.\n\n**C. Disclosure and expert evidence.** Two antecedents, both invoked by later carriers. Gareth Jenkins, the engineer whose statements later served POL's prosecutions, described himself as an ICL then Fujitsu employee since 1973 and as working on the Horizon project since 1996 [doc-pol00006357-2013-07-15-clarke-advice-expert-evidence tl 1] [doc-pol00006357-2013-07-15-clarke-advice-expert-evidence tl 2] [doc-pol00006357-2013-07-15-clarke-advice-expert-evidence claims 30] [doc-pol00006357-2013-07-15-clarke-advice-expert-evidence claims 31] (one root: Jenkins's self-description, relayed by Clarke from statements not held). The SFO guidance dates the disclosure statute it invokes, the Criminal Procedure and Investigations Act 1996 [guidance-sfo-corporate-cooperation-2025 tl 1] [guidance-sfo-corporate-cooperation-2025 claims 79]. A forum poster's account of a pre-1990s change to the burden of proof on computer evidence is his own inference, unsourced as to the statute [hacker-news-2024-01-16-post-office-software-glitch-thread tl 3] [hacker-news-2024-01-16-post-office-software-glitch-thread claims 161] [hacker-news-2024-01-16-post-office-software-glitch-thread claims 162] [hacker-news-2024-01-16-post-office-software-glitch-thread claims 163] (lead 187 already asks for the statute). Absent: any disclosure decision, expert report or court ruling of the era.\n\n**D. The critics and the scheme.** No critic, scheme or campaign exists in the era. The lane holds the later critic's own antecedents: Bates worked with EPOS systems from 1986 [hearing-2024-04-09-alan-bates-day-117 tl 1] [hearing-2024-04-09-alan-bates-day-117 claims 83] [hearing-2024-04-09-alan-bates-day-117 claims 146] and became subpostmaster at Craig-y-Don on 31 March 1998 [hearing-2024-04-09-alan-bates-day-117 tl 4] [hearing-2024-04-09-alan-bates-day-117 claims 85] (Computer Weekly's \"1998 to 2003\" is the same teller relayed [computer-weekly-2009-05-11-postmasters-tell-their-story tl 1] [computer-weekly-2009-05-11-postmasters-tell-their-story claims 103]); he was \"quite positive when Horizon came in\", had \"no involvement in discussions on the introduction of Horizon\" and \"no choice\" but to accept it [hearing-2024-04-09-alan-bates-day-117 claims 84] [hearing-2024-04-09-alan-bates-day-117 claims 110] [hearing-2024-04-09-alan-bates-day-117 claims 111]. His age at taking over drifts by about three years between his hearing and Computer Weekly [hearing-2024-04-09-alan-bates-day-117 tl 3] (pack rank 48). One root (Bates), with Thomson relaying him. The pack placed all three 1999 rows here by fallback; none belongs here (see the reassignments under Windows).\n\n**E. Money and contracts.** The Contract between Post Office and subpostmasters is dated September 1994 by POL reading it [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two tl 1] [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 131] and 1994 by Bates's 2010 letter [hearing-2024-04-09-alan-bates-day-117 tl 2] [hearing-2024-04-09-alan-bates-day-117 claims 328]: two independent roots, matching. Bates's own acknowledgement of his Contract for Services is dated \"31 March 2003\" in POL's 2003 letter and corrected by him to 1998 [hearing-2024-04-09-alan-bates-day-117 tl 5] [hearing-2024-04-09-alan-bates-day-117 claims 186]. The ICL contract is \"the £2.3 billion contract\" in Clark's flat telling [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 36] (lead 177). In the 1999 window, the subpostmaster Pennington's letter (received by Vennells's office in September 2013) says his complaint dates \"from when the Horizon system was implemented\": a shown loss of over £18,000, £13,500 returned, the shortfall made good, the Area Manager telling him \"the contract stipulated all shortages must be 'made good', and there was no appeal procedure\" [hearing-2024-05-22-paula-vennells-day-142 tl 2] [hearing-2024-05-22-paula-vennells-day-142 claims 432] [hearing-2024-05-22-paula-vennells-day-142 claims 433] [hearing-2024-05-22-paula-vennells-day-142 claims 434] (one root: the letter, read by counsel; lead 112 asks to hold it). Absent: the ICL contract's own terms, any POL accounting of branch losses before or at roll-out (POL says pre-Horizon transaction records are not available [doc-pol00004432-2015-04-01-pol-reply-second-sight-part-two claims 225]).\n\n**F. Government and Parliament.** One forum root carries the whole lane: the project \"Started in 1994 under the Tories\" as a PFI \"foisted upon them by the Tory government of the day\" against benefit fraud, and \"rolled out in 1999 under Labour as the reduced system after DSS withdrew\" [hacker-news-2024-01-16-post-office-software-glitch-thread tl 6] [hacker-news-2024-01-16-post-office-software-glitch-thread tl 7] [hacker-news-2024-01-16-post-office-software-glitch-thread claims 170] [hacker-news-2024-01-16-post-office-software-glitch-thread claims 172] [hacker-news-2024-01-16-post a and are returned as leads, not nodes: the Horizon Issues judgment's PEAKs of July and November 1999 at [235] to [241] (no held row) and a forum poster's archive link saying ICL/Fujitsu knew of near-identical bugs in an earlier project [hacker-news-2024-01-16-post-office-software-glitch-thread claims 188] (lead 183).\n\nWhat the era offers against. Every root is late (2009 to 2024) and the 1999 dates are unsourced [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 9] [hacker-news-2024-01-16-post-office-software-glitch-thread claims 173]; the origin rows describe an inherited, ill-designed system and a decision taken by government [synchrony pre-2000 co-movements 1], which a builder of this thesis must not turn into knowledge. The early-record walls (Signals 1 to 3) are boundaries, never evidence of what was known.\n\nContradictions to take a side on: 4 (corporate memory) and 5 (the inception data), both possible flares; 1 only for dating where PIR-1's earliest written record can lie.\n\n### good-faith-reliance\n\nWhat the era offers for the rival. The structural premise is strongest here: a system \"designed for a completely different purpose\" that the Post Office \"had had to struggle to take on\" [hearing-2024-05-22-paula-vennells-day-142 claims 113]; no living corporate memory of the inception by 2007 [hearing-2024-05-22-paula-vennells-day-142 claims 112]; a project \"foisted upon them\" by government [hacker-news-2024-01-16-post-office-software-glitch-thread claims 170]; and Bates himself, adverse to POL, supplying the rival's terms at the committee in 2024: POL lacked the technical expertise after commissioning the ICL contract and \"very much relied upon their supplier to also be their IT experts and advisors\" [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 35] [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access claims 38] [the-register-2024-01-17-post-office-boss-keeping-mum-remote-access c   else if(S.view==="register"){ const secs=Object.keys(DATA.register.sections||{}); r.innerHTML='<h2>Sections</h2><div class="tree">'+secs.map(s=>`<button data-sec="${esc(s)}">${esc(s)}</button>`).join("")+'</div>'; r.querySelectorAll("button").forEach(b=>b.onclick=()=>{const el=document.getElementById("sec-"+b.dataset.sec.replace(/\W+/g,"-"));if(el)el.scrollIntoView({block:"start"})}) }
  else r.innerHTML='<h2>About</h2><p class="muted" style="font-size:13px">'+esc(DATA.display.about)+'</p>' }
function renderNarrative(n){ const tabs=[["overview","Overview"],["nodes",`Nodes (${n.nodes.length})`],["ledger",`Ledger (${n.ledger.length})`],["carriers","Carriers and interests"],["objections","Objections"],["forks","Forks and tests"],["leads",`Leads (${n.leads.length})`]];
  let h=`<h2 class="sec">${esc(n.title)}</h2><div class="card"><dl class="kv"><dt>Mode</dt><dd>${esc(n.mode)}${n.mode==="fork"?` · parent ${inline(n.parent)}`:""}</dd><dt>Thesis</dt><dd>${inline(n.thesis_line)}</dd><dt>Alternative</dt><dd>${inline(n.alternative_line)}</dd><dt>Span</dt><dd>${esc(n.span)} · lanes ${laneChip(n.lanes)}</dd><dt>Size</dt><dd>${n.words.toLocaleString()} words · ${n.nodes.length} nodes · ${n.ledger.length} ledger rows</dd></dl></div>`;
  h+='<div class="tabs">'+tabs.map(([k,l])=>`<button data-tab="${k}" aria-pressed="${S.tab===k}">${l}</button>`).join("")+'</div>';
  const t=S.tab;
  if(t==="overview"){ h+=`<div class="card"><h3>Score card</h3>${scoreGrid(n)}</div><div class="card"><h3>Nodes by year and lane</h3>${strip(n.nodes)}<div class="legend">${"ABCDEFGH".split("").map(l=>`<span class="chip lane l${l}">${l}</span> <span class="muted">${DATA.lane_names[l]}</span>`).join("")}</div></div><div class="card"><h3>Thesis</h3>${md(n.thesis)}</div>${n.deltas?`<div class="card"><h3>Deltas against the parent</h3>${md(n.deltas)}</div>`:""}<div class="card"><h3>Score card, as written</h3>${md(n.scorecard)}</div>` }
  if(t==="nodes"){ h+=`<div class="card"><input class="search" id="q" placeholder="Filter nodes (text, lane letter, role)" value="${esc(S.q)}">`+table(n.nodes.filter(r=>!S.q||JSON.stringify(r).toLowerCase().includes(S.q.toLowerCase())),[{k:"#",h:"#",cls:"num"},{k:"date",h:"Date",cls:"num"},{k:"lane",h:"Lane",f:laneChip},{k:"node",h:"Node",cls:"narrow"},{k:col(n.nodes,"carriers")||"carriers (independent roots)",h:"Carriers (roots)",cls:"narrow"},{k:"rows",h:"Rows",cls:"narrow"},{k:"depends on",h:"Depends on",cls:"num"},{k:"role",h:"Role",f:roleChip}])+'</div>' }
  if(t==="ledger"){ const mx=Math.max(...n.ledger.map(r=>parseFloat(r.weight)||0),0.01);
    h+='<div class="card">'+table(n.ledger,[{k:"#",h:"#",cls:"num"},{k:"node",h:"Node",cls:"num"},{k:"contradiction",h:"Contradiction",cls:"narrow"},{k:"side taken",h:"Side taken",cls:"narrow"},{k:"other side",h:"Other side",cls:"narrow"},{k:"weight",h:"Weight",cls:"num",f:v=>{const w=parseFloat(v)||0;return `<span class="bar" style="width:${Math.round(w/mx*60)}px"></span>${esc(String(v).split(" ")[0])}`}},{k:"downstream",h:"Downstream",cls:"num",f:(v,r)=>`${esc(String(v).split(" ")[0])}${r._downstream_computed!=null&&String(r._downstream_computed)!==String(v).split(" ")[0]?` <span class="muted" title="computed from Depends on">(${r._downstream_computed})</span>`:""}`},{k:"why survivable",h:"Why survivable",cls:"narrow"},{k:"fork",h:"Fork",f:forkChip},{k:"flare",h:"Flare",cls:"narrow",f:flareChip}])+'</div>' }
  if(t==="carriers"){ h+=`<div class="card"><h3>Carriers</h3>${table(n.carriers)}</div><div class="card"><h3>Interests</h3>${table(n.interests)}</div><div class="card"><h3>Synchrony</h3>${table(n.synchrony)}</div>` }
  if(t==="objections"){ h+=`<div class="card"><h3>Objections (written by the attacker)</h3>${md(n.objections)}</div>` }
  if(t==="forks"){ h+=`<div class="card"><h3>Forks</h3>${md(n.forks)}</div><div class="card"><h3>Tests</h3>${md(n.tests)}</div>` }
  if(t==="leads"){ h+=`<div class="card"><h3>Leads returned</h3>${table(n.leads)}</div><div class="card"><h3>Relations returned</h3>${table(n.relations)}</div>` }
  return h }
function renderCompare(){ const ns=DATA.narratives; const rows=AX.map(([k,lab])=>{ const r={axis:lab}; ns.forEach(n=>{ const a=n.score_lines[0]||{}, b=n.score_lines[1]; r[n.id]=(a[k]??"–")+(b&&b[k]!=null?` → ${b[k]}`:"") }); return r });
  return `<h2 class="sec">Narratives side by side</h2><p class="muted" style="max-width:72ch">No composite rank, by rule. Each cell is the author's figure, then the attacker's after the arrow. Read load against clusters and roots: a story that claims little has few contradictions.</p><div class="card">${table(rows,[{k:"axis",h:"Axis"},...ns.map(n=>({k:n.id,h:short(n.id),cls:"num"}))])}</div><div class="card"><h3>Theses</h3>${table(ns.map(n=>({page:short(n.id),mode:n.mode,thesis:n.thesis_line,alternative:n.alternative_line})),[{k:"page",h:"Page"},{k:"mode",h:"Mode"},{k:"thesis",h:"Thesis",cls:"narrow"},{k:"alternative",h:"Alternative",cls:"narrow"}])}</div>` }
function renderRecurring(){ const g=DATA.recurring; const cross=g.filter(x=>x.kind==="cross-mainline"), inh=g.filter(x=>x.kind!=="cross-mainline");
  const block=(list,title,note)=>`<div class="card"><h3>${title} (${list.length})</h3><p class="muted" style="font-size:13px">${note}</p>`+list.map(x=>`<div class="rec" style="padding:8px 0;border-bottom:1px solid var(--line)"><div>${inline(x.contradiction)}</div><div class="members">${x.members.map(m=>`<button data-nid="${m.page}" data-row="${esc(m.row)}" title="${esc(m.side)}">${esc(short(m.page))} row ${esc(m.row)}${/^possible/i.test(m.flare)?" ⚑":""}</button>`).join("")}</div></div>`).join("")+'</div>';
  return `<h2 class="sec">Contradictions that recur</h2><p class="muted" style="max-width:72ch">Ledger rows on different pages that cite the same row or lead. Those taken by more than one mainline are the next investigations. ⚑ marks a possible flare. Click a member to open that page's ledger.</p>`+block(cross,"Across mainlines","Two or more narrative families had to take a side on the same rows.")+block(inh,"Inherited within one family","A fork carrying its parent's row; the sides may differ.") }
function heat(){ const wins=Object.keys(DATA.grid); const dense=new Set(DATA.dense.map(d=>d.window)); const mx=Math.max(...wins.flatMap(w=>Object.values(DATA.grid[w])));
  return `<div class="tscroll"><table class="grid"><thead><tr><th>Window</th>${"ABCDEFGH".split("").map(l=>`<th title="${DATA.lane_names[l]}">${l}</th>`).join("")}<th>Total</th></tr></thead><tbody>`+wins.map(w=>{const c=DATA.grid[w]; const tot=Object.values(c).reduce((a,b)=>a+b,0); return `<tr class="${dense.has(w)?"dense":""}"><td class="w">${esc(w)}</td>`+"ABCDEFGH".split("").map(l=>{const v=c[l]||0; const a=v?Math.min(0.15+0.85*Math.sqrt(v/mx),1):0; return `<td><span class="cell" style="background:color-mix(in srgb, var(--l${l}) ${Math.round(a*100)}%, transparent)">${v||""}</span></td>`}).join("")+`<td class="num">${tot}</td></tr>`}).join("")+'</tbody></table></div>' }
function renderSynchrony(){ let h=`<h2 class="sec">Synchrony</h2><p class="muted" style="max-width:72ch">Dated timeline rows from ${DATA.display.synchrony_from} on, by window (a year; a quarter from ${DATA.display.quarter_from}) and lane, from the pack's mechanical assignment; the era pages reassign about one row in eight and say why. Bold windows are dense: three or more lanes moving at once.</p><div class="card"><div class="legend">${"ABCDEFGH".split("").map(l=>`<span class="chip lane l${l}">${l}</span> <span class="muted">${DATA.lane_names[l]}</span>`).join("")}</div>${heat()}</div>`;
  const e=DATA.synchrony.find(x=>x.id===S.era)||DATA.synchrony[0]; if(!e) return h; S.era=e.id;
  const tabs=[["co",`Co-movements (${e.co.length})`],["windows",`Windows (${e.windows.length})`],["contradictions",`Contradictions (${e.contradictions.length})`],["signals",`Signals (${e.signals.length})`],["orgs",`Organisations (${e.orgs.length})`],["lanes","Lanes"],["builders","For the builders"]];
  h+=`<h2 class="sec">${esc(e.title)}</h2><div class="tabs">`+tabs.map(([k,l])=>`<button data-etab="${k}" aria-pressed="${S.etab===k}">${l}</button>`).join("")+'</div><div class="card">';
  const t=S.etab; if(t==="co") h+=table(e.co,null,null); else if(t==="windows") h+=table(e.windows); else if(t==="contradictions") h+=table(e.contradictions,Object.keys(e.contradictions[0]||{}).map(k=>({k,h:k,f:k==="flare"?flareChip:undefined,cls:/node|parties|bears/.test(k)?"narrow":""}))); else if(t==="signals") h+=table(e.signals); else if(t==="orgs") h+=table(e.orgs); else if(t==="lanes") h+=md(e.lanes); else h+=md(e.builders);
  return h+'</div>' }
function renderRegister(){ const r=DATA.register; if(!r.title) return '<p class="muted">No register yet.</p>'; let h=`<h2 class="sec">${esc(r.title)}</h2>`; for(const [k,v] of Object.entries(r.sections)) h+=`<div class="card" id="sec-${k.replace(/\W+/g,"-")}"><h3>${esc(k)}</h3>${md(v)}</div>`; return h }
function go(){ document.getElementById("built").textContent="built "+DATA.built; const v=document.getElementById("views"); v.innerHTML=VIEWS.map(([k,l])=>`<button data-v="${k}" aria-pressed="${S.view===k}">${l}</button>`).join(""); v.querySelectorAll("button").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;go()});
  renderRail(); const m=document.getElementById("main"); let h="";
  if(S.view==="narratives"){ if(!S.nid) S.nid=(DATA.narratives.find(n=>n.id===DATA.display.default_page)||DATA.narratives[0]).id; h=renderNarrative(nar(S.nid)) }
  else if(S.view==="compare") h=renderCompare(); else if(S.view==="recurring") h=renderRecurring(); else if(S.view==="synchrony") h=renderSynchrony(); else h=renderRegister();
  m.innerHTML=h; m.querySelectorAll("button[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;go()}); m.querySelectorAll("button[data-etab]").forEach(b=>b.onclick=()=>{S.etab=b.dataset.etab;go()});
  m.querySelectorAll(".rec button[data-nid]").forEach(b=>b.onclick=()=>{S.view="narratives";S.nid=b.dataset.nid;S.tab="ledger";go();const el=document.getElementById("row-"+b.dataset.row);if(el){el.classList.add("hit");el.scrollIntoView({block:"center"})}});
  const q=document.getElementById("q"); if(q){ q.oninput=()=>{S.q=q.value; const pos=q.selectionStart; go(); const q2=document.getElementById("q"); q2.focus(); q2.setSelectionRange(pos,pos)} }
  try{ localStorage.setItem("nv-state",JSON.stringify({view:S.view,nid:S.nid,tab:S.tab,era:S.era,etab:S.etab})) }catch(e){}
  if(S.view==="narratives"&&S.nid) history.replaceState(null,"","#"+short(S.nid)); else history.replaceState(null,"","#"+S.view); window.scrollTo({top:0}) }
(function start(){ try{ const s=JSON.parse(localStorage.getItem("nv-state")||"null"); if(s){ Object.assign(S,s); S.q="" } }catch(e){}
  const tok=(location.hash||"").slice(1); if(tok){ const n=DATA.narratives.find(x=>short(x.id)===tok); if(n){S.view="narratives";S.nid=n.id} else if(VIEWS.some(v=>v[0]===tok)) S.view=tok }
  if(S.nid&&!nar(S.nid)) S.nid=null; go() })();
</script>
</body>
