# Core defaults of the brief templates' pack slots (platform phase 4, 2026-10-22).
# The renderer (wip/platform-phase4/render_briefs.py today; `ledger brief render` in phase 7) fills each {{pack.<key>}} from the
# active pack's briefs/slots.toml, and from this file where the pack gives no value. A slot with no value in either is an error.
# Values are inserted verbatim into the brief text; they are written to read as part of the sentence the template gives them.

[slots]
"name" = "the active pack"
"schema_extensions" = "the active pack's schema-extensions.md"
"model_policy" = "Every reading or writing agent runs on the most capable model at high effort; a small model only for pass-through probes that run a script and relay its line."
"audited_subjects" = "every subject of the project"
"channelled_clause" = "the pack declares no channelled class"
"reference_objects" = "the object register's form (schema section 6); the pack names no reference object, so the criteria column takes `none`."
"reference_objects.watch_name" = "object watch"
"reference_objects.features" = "size, form, markings, condition, what it does"
"actor_register" = "return `actor_rows` in the register's row shape (actors and polities in the vocabulary of tools/platform-plan.md: kind, teller, chain, goals, confidence by provenance; the polity each belongs to; order-of-battle placements) for every actor and polity the source describes, and `polity_statements` (each polity's posture toward the referent, by whose telling) as table rows in the register's statement shape `| # | Teller (note, row, time) | Body (alliance, bloc, coalition, network, faction) | Inside / members | Outside | Opposed | The referent's standing | Time (when said; period it refers to) | Quote (short) | Chain |` (the `#` cell is numbered by `ledger integrate`), or `none`."
"actor_register.findings_heading" = "Actors and polities"
"actor_register.findings_line" = "- [u NNN:L] actor as named: <...> | kind: <state actor | non-state actor | proxy | front | individual> | teller: <...> | firsthand or relayed: <chain> | goals or role: <...> | polity: <the polity it belongs to, or none stated> | order of battle: <part of, run by, funded by, a front for, or none> | posture toward the referent: <...>"
"actor_register.findings_what" = "every actor and polity the source describes, with its place in the order of battle"
"pirs" = "none declared (the project names no priority intelligence requirements)"
"referent" = "the referent object the project's question names (none declared)"
"speaker_ledgers" = "the pack names no ledgered speaker; return nothing for it."
"forthrightness_charts" = "the audit counts line is all the charts need; return nothing more."
"eras" = "the master timeline only (the pack defines no era pages)"
"catalysts" = "the pack names no catalysts"
"stock_phrases" = "tools/stock_phrases.txt alone"
"canon" = "the pack names no canon text"
"codebook" = "the pack names no codebook"
"blocked_precedent" = "the pointer-row form of tools/filter-blocks.md section 5"
"report_keys.document" = "nothing"
"report_keys.video" = "nothing"
"topics" = "`other` (the pack gives no topic codes)"
"basis_vocabulary" = "a ground the speaker names"
"circles" = "the circles the relations register names; the pack names no adverse source"
"exemplars.document" = "no exemplar: the skeleton's form alone"
"exemplars.text" = "no exemplar: the skeleton's form alone"
"exemplars.video" = "no exemplar: the skeleton's form alone"
"exemplars.hearing" = "no exemplar: the skeleton's video form and this brief"
"exemplars.adverse_web" = "no exemplar: the skeleton's form alone (`--form adverse-web`)"
"exemplars.adverse_scan" = "no exemplar: the document form's skeleton"
"free_sections.document" = "none"
"free_sections.video" = "none"
"free_sections.teller" = "`## New in this recording`, `## Forthrightness and the four classes, against the held tellings`, `## Corroboration inside the database`"
"subjects" = "the project's subject pages under subjects/"
"narratives" = "research/narrative-register.md and the narrative pages it lists, the rival sheets and history pages, and the run's digests"
"lenses" = "the core technique catalogue (tools/technique-catalogue.json) with no instance"
"compilers" = "the pack names no compiler"
"archives" = "the pack names no bulk archive"
"base_reading" = "The base reading is the one the project's rulings log records: the material may come from one connected circle of tellers whose main compilers have each built a narrative that fits their own model; whether those are true is unknown."
"narrative_seeds" = "the seeds listed in the narrative register and the run's pack (`seeds.md`)"
"rivals" = "the rival sheets research/narrative-rival-<slug>.md the narrative register lists; each page faces the rival its Alternative names"
"lanes" = "the lanes of tools/narratives.md section 3 as the pack leaves them"
"synchrony_eras" = "one window per era page of the pack (or the whole span as one window when the pack defines no eras)"
"ordinary_grounds" = "classification, pre-publication review, a pending investigation, protecting a named person"
"narrative_reading_list" = "none"
"sample_threshold" = 3   # the sample reading (staged/sample.md); a pack sets it in pack.toml [intake] sample_threshold or briefs/slots.toml
